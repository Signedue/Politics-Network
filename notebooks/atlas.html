dstændigt objektive tal, som er opgørelser over antal medarbejdere i vores offentlige sygehuse. Og man kan se, at tallet i mange år før vi kom til, har det ligget stille, siger han.", "lt": 3, "lp": 0.45, "src": "DR · 2022-10-30", "s": "Imod", "sc": -0.24}, {"p": "Magnus Heunicke", "pa": "S", "c": "Jeg mener ikke, at vi kan sige, at det er en succes, når man ser på antallet af medarbejdere på vores sygehuse. Fordi vi mangler medarbejdere. Vi kan se, at vi hver eneste dag, har svært ved at få vagtplanerne til at gå op. Og vi forsøger at fremlægge politik, der løser de problemer, siger han.", "lt": 1, "lp": 0.58, "src": "DR · 2022-10-30", "s": "Neutral", "sc": 0.05}, {"p": "Magnus Heunicke", "pa": "S", "c": "Jeg vil gerne starte med helt ærligt at sige undskyld. Undskyld for, at vores tiårsplan for psykiatri ikke er klar endnu, sagde Magnus Heunicke.", "lt": 3, "lp": 0.86, "src": "DR · 2022-10-31", "s": "Neutral", "sc": -0.03}, {"p": "Magnus Heunicke", "pa": "S", "c": "Psykiatrien virker ikke på nogen måde tilfredsstillende, sagde han i TV Avisen 11. oktober. Og han uddybede det:", "lt": 0, "lp": 0.72, "src": "DR · 2022-10-31", "s": "Imod", "sc": -0.23}, {"p": "Magnus Heunicke", "pa": "S", "c": "Der er bare kommet flere og flere patienter til, særligt børn og unge, hvor vi kan se, at der er mistrivsel og alvorlig psykiske problemer hos en hel generation, som vi har været alt for dårlige til at håndtere.", "lt": 5, "lp": 0.86, "src": "DR · 2022-10-31", "s": "Imod", "sc": -0.26}, {"p": "Magnus Heunicke", "pa": "S", "c": "Det er der, at vores sundhedsstyrelse siger, at vi skal sætte ind først. Og det er det, vi gør. Klart de fleste midler og de fleste initiativer til næste år i vores tiårsplan kommer til at løfte børne- og ungepsykiatrien, siger Magnus Heunicke til DR.", "lt": 3, "lp": 0.79, "src": "DR · 2022-10-31", "s": "For", "sc": 0.18}, {"p": "Magnus Heunicke", "pa": "S", "c": "Det her resultat i exitpollen underbygger kun det ønske, vi har om et bredt samarbejde. Så lad os nu sætte os sammen og afsøge, om vi ikke kan lave den her brede regering, som jeg synes, vil være det eneste rigtigt svar på det her resultat, siger Magnus Heunicke.", "lt": 3, "lp": 0.93, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.71}, {"p": "Magnus Heunicke", "pa": "S", "c": "Det er ikke nogen hemmelighed, at vi har taget ansvar i en tid, hvor der virkelig var behov for, at nogen tog lederskabet. Det synes jeg, vi har gjort, og jeg synes, at vi kan være stolte af det, vi har gjort. Det er klart, det kan have slidt, og der kan være nogen, der er uenige med nogle af de beslutninger, vi har truffet, siger Magnus Heunicke.", "lt": 3, "lp": 0.51, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.11}, {"p": "Magnus Heunicke", "pa": "S", "c": "Jeg er utrolig taknemlig for, at noget tyder på, at rigtig mange danskere har vist os stor tillid.", "lt": 1, "lp": 0.79, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.24}, {"p": "Magnus Heunicke", "pa": "S", "c": "Præcis det, vi har lovet danskerne. At sørge for, at vi får en regering henover midten.", "lt": 3, "lp": 0.88, "src": "DR · 2022-11-01", "s": "For", "sc": 0.65}, {"p": "Magnus Heunicke", "pa": "S", "c": "Så håber jeg vi får en regering med Venstre, Socialdemokratiet og Moderaterne, siger han.", "lt": 3, "lp": 0.86, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.46}, {"p": "Mai Villadsen", "pa": "EL", "c": "Det er en utrolig dårlig ide at lukke højrefløjen ind til regeringsbordet. Det vil være en katastrofe for klimaet, og jeg synes det er meget mystisk at Mette Frederiksen ønsker at danne regering med partier - som blandt andet konservative - som ønsker at skære i velfærden, siger Mai Villadsen.", "lt": 0, "lp": 0.7, "src": "DR · 2022-10-05", "s": "Imod", "sc": -0.12}, {"p": "Mai Villadsen", "pa": "EL", "c": "Kæden er hoppet fuldstændig af, siger Mai Villadsen om Rwanda-planer Et asylcenter i Rwanda er som ventet det første, der skal diskuteres.", "lt": 0, "lp": 0.79, "src": "TV 2 · 2022-10-05", "s": "Neutral", "sc": -0.05}, {"p": "Mai Villadsen", "pa": "EL", "c": "Vi synes også, at der skal være modtagecentre i Afrika, men vi skal gøre det sammen i EU. Vi har behov for at samarbejde om det. Asyl- og flygtningepolitik er ikke dansk, det er europæisk, siger hun.", "lt": 3, "lp": 0.39, "src": "TV 2 · 2022-10-05", "s": "", "sc": NaN}, {"p": "Mai Villadsen", "pa": "EL", "c": "Jeg synes, at kæden er hoppet fuldstændig af med det her forslag. Men jeg tror heller ikke, at det bliver til noget, siger hun.", "lt": 0, "lp": 0.79, "src": "TV 2 · 2022-10-05", "s": "Imod", "sc": -0.06}, {"p": "Mai Villadsen", "pa": "EL", "c": "Det er helt forfærdeligt, at folk skal føle sig nødsaget til at tage imod almisser, fordi de ikke har råd til almindelige ting som rugbrød og æg og til at betale regningerne. Sådan skal det ikke være i vores land, siger politisk ordfører Mai Villadsen.", "lt": 4, "lp": 0.86, "src": "DR · 2022-10-07", "s": "Imod", "sc": -0.17}, {"p": "Mai Villadsen", "pa": "EL", "c": "I Enhedslisten har vi foreslået, at man skal lave en målrettet engangsskattelettelse på 10.000 kroner til de to millioner danskere, der har mindst. Det er til folk på overførselsindkomster, men også pensionister og folk, der er lavt lønnet, for krisen rammer hårdt for rigtig mange, tilføjer hun.", "lt": 2, "lp": 0.5, "src": "DR · 2022-10-07", "s": "For", "sc": 0.64}, {"p": "Mai Villadsen", "pa": "EL", "c": "Hvis der er en åben familie i dansk politik, så er det vel i blå blok.", "lt": 5, "lp": 0.83, "src": "TV 2 · 2022-10-15", "s": "Imod", "sc": -0.05}, {"p": "Mai Villadsen", "pa": "EL", "c": "Når et nyt folketing er sat sammen, må vi sætte os ned og tage en diskussion om, hvad vi kan blive enige om at undersøge. For mig er det selvfølgelig helt klart, at det ikke skal influere på den retssag, der er. Men er der ting udenom, som man måske kunne se på inden da, så vil vi i hvert fald have et åbent sind over for det, siger Mai Villadsen.", "lt": 2, "lp": 0.92, "src": "DR · 2022-10-17", "s": "Neutral", "sc": 0.03}, {"p": "Mai Villadsen", "pa": "EL", "c": "Det, som vi i Enhedslisten er meget optaget af at undersøge, er, hvad efterretningstjenesterne har gjort, og hvordan de har handlet. Vi har hørt fortællinger om medier, der har følt sig intimideret, og PET, der ifølge Lars Findsen har tilbudt en handel, som ikke er lovlig. FE-sagen er dybt alvorlig, og jeg synes, det er rigtig, rigtig vigtigt, at vi får genopbygget tilliden, siger Mai Villadsen.", "lt": 1, "lp": 0.91, "src": "DR · 2022-10-17", "s": "For", "sc": 0.07}, {"p": "Mai Villadsen", "pa": "EL", "c": "I Enhedslisten kommer vi til at kræve af Mette Frederiksen, at hvis hun skal sidde på vores mandater, så skal hun også levere et stort beløb til ligeløn, siger Mai Villadsen.", "lt": 0, "lp": 0.88, "src": "DR · 2022-10-17", "s": "Imod", "sc": -0.2}, {"p": "Mai Villadsen", "pa": "EL", "c": "Jeg mener, at regeringen og Socialdemokratiet som minimum bør fremlægge, hvor mange penge de er klar til at sætte af til at løse den store udfordring, inden vi går til stemmeurnerne.", "lt": 2, "lp": 0.68, "src": "DR · 2022-10-18", "s": "For", "sc": 0.37}, {"p": "Mai Villadsen", "pa": "EL", "c": "Vi har vores forslag i Enhedslisten, og de andre partier har deres. Det vigtigste lige nu er at sætte en målsætning op for Christiansborg, siger Mai Villadsen.", "lt": 2, "lp": 0.86, "src": "DR · 2022-10-20", "s": "For", "sc": 0.32}, {"p": "Mai Villadsen", "pa": "EL", "c": "Det tror jeg da sagtens, vi kan finde ud af. Det, der i virkeligheden er vigtigt i dette spørgsmål, er at finde ud af, hvem der skal afgive noget plads, siger hun.", "lt": 4, "lp": 0.9, "src": "DR · 2022-10-20", "s": "For", "sc": 0.21}, {"p": "Mai Villadsen", "pa": "EL", "c": "Vi skal spise lidt grønnere allesammen, men det betyder ikke, at vi skal holde op med at drikke mælk eller spise kød. Men vi skal spise grønnere. Det er derfor, at vi skal have skruet på priserne, så det grønne bliver det billige og gode valg, siger Mai Villadsen, politisk ordfører.", "lt": 1, "lp": 0.83, "src": "DR · 2022-10-24", "s": "Neutral", "sc": -0.03}, {"p": "Mai Villadsen", "pa": "EL", "c": "(...)Vi skal tænke over det, vi faktisk forbruger. At det også har en klimapris. Det koster ikkke kun noget på penge, men også på vores klima, siger hun til Information.", "lt": 4, "lp": 0.45, "src": "DR · 2022-10-24", "s": "Imod", "sc": -0.18}, {"p": "Mai Villadsen", "pa": "EL", "c": "Jeg synes nogle gange, at Inger Støjberg taler, som om hun har patent på Danmark og landbruget. Der er sådan set også landmænd i Enhedslisten, og vi vil et grønnere landbrug, siger hun efter debatten.", "lt": 0, "lp": 0.86, "src": "TV 2 · 2022-10-27", "s": "For", "sc": 0.46}, {"p": "Mai Villadsen", "pa": "EL", "c": "Det var derfor, jeg rystede på hovedet, ikke fordi de andre tal var forkerte, siger Mai Villadsen.", "lt": 4, "lp": 0.58, "src": "TV 2 · 2022-10-27", "s": "Neutral", "sc": 0.02}, {"p": "Mai Villadsen", "pa": "EL", "c": "Sæt jer ned, og opfør jer ordentligt, råbte han og fik et stort bifald, inden demonstranterne blev eskorteret ud af salen. Venstre vil trække Danmark Bagud, siger Villadsen Enhedslistens Mai Villadsen langer ud efter Jakob Ellemann-Jensen (V):", "lt": 2, "lp": 0.72, "src": "TV 2 · 2022-10-30", "s": "Neutral", "sc": -0.01}, {"p": "Mai Villadsen", "pa": "EL", "c": "Er det ikke lidt svært at gå forrest i klimakampen, når du vil være statsminister for en blok med partier, der ikke engang har skrevet under på klimaloven? siger hun.", "lt": 5, "lp": 0.86, "src": "TV 2 · 2022-10-30", "s": "Imod", "sc": -0.07}, {"p": "Mai Villadsen", "pa": "EL", "c": "Er det ikke lidt svært at gå forrest som statsministerkandidat, når der er partier i din blok, som ikke engang har skrevet under på klimaloven?", "lt": 5, "lp": 0.86, "src": "TV 2 · 2022-10-30", "s": "Neutral", "sc": -0.03}, {"p": "Mai Villadsen", "pa": "EL", "c": "Er du klar til at lægge mandater til reformer, spurgte Lars Løkke. Det er hun, svarede Mai Villadsen og indvendte, at hun bare er uenig i, at det &quot;altid er dem, der har mindst i vores samfund, det skal gå ud over&quot;.", "lt": 3, "lp": 0.61, "src": "TV 2 · 2022-10-31", "s": "Imod", "sc": -0.68}, {"p": "Mai Villadsen", "pa": "EL", "c": "Jeg føler, at Lars Løkke er sådan en krejler, der har piftet vores cykler og nu prøver at sælge os en meget dyr lapning, sagde hun.", "lt": 1, "lp": 0.72, "src": "TV 2 · 2022-10-31", "s": "For", "sc": 0.08}, {"p": "Mai Villadsen", "pa": "EL", "c": "Vi kan ikke støtte en regering, der vil gennemføre den plan, det må jeg bare sige direkte til dig, Mette Frederiksen.", "lt": 3, "lp": 0.43, "src": "TV 2 · 2022-10-31", "s": "Imod", "sc": -0.61}, {"p": "Marie Bjerre", "pa": "V", "c": "Vi ønsker ikke, at regningen skal ende hos danskerne, og det må heller ikke betyde, at vi skærer i velfærden eller får højere skatter og afgifter, siger klimaordfører Marie Bjerre og fremfører, at Venstre netop derfor har foreslået at sælge en del af statens aktier i Ørsted.", "lt": 1, "lp": 0.64, "src": "DR · 2022-10-23", "s": "Imod", "sc": -0.84}, {"p": "Marie Bjerre", "pa": "V", "c": "Det må ikke blive dyrere at være dansker, og vi må heller ikke forværre dansk landbrugs konkurrenceevne. Så den her CO2-afgift skal jo virke som et incitament i produktionen frem for en afgift på forbrugeren, siger hun.", "lt": 0, "lp": 0.77, "src": "DR · 2022-10-24", "s": "For", "sc": 0.7}, {"p": "Marie Bjerre", "pa": "V", "c": "Vi tror også, at en CO2-afgift kan komme til at virke på en ordentlig måde, hvor man sikrer arbejdspladser. Vi afventer selvfølgelig ekspertgruppen, men vi forestiller os, at man kan skrue den sammen på en klog måde, så man lader pengene gå tilbage til landbruget og investerer i den grønne omstilling, siger Venstres klimaordfører, Marie Bjerre.", "lt": 0, "lp": 0.94, "src": "DR · 2022-10-24", "s": "For", "sc": 1.0}, {"p": "Marie Bjerre", "pa": "V", "c": "Jeg synes egentlig ikke, det er helt rimeligt. Vi er et åbent marked og handler på tværs med hinanden. Men det er klart, at hvis man måler CO2-aftrykker, så har det en positiv effekt, at man slagter lokalt, siger Marie Bjerre.", "lt": 1, "lp": 0.58, "src": "DR · 2022-10-24", "s": "Imod", "sc": -0.1}, {"p": "Marie Bjerre", "pa": "V", "c": "Nej, men vi er som parti bekymrede for, at man slagter eller nedskalerer landbruget groft som venstrefløjen foreslår. Men vi tror på, at en CO2-afgift er en godt værktøj til at sikre reduktioner, fordi man får sat en pris på CO2, siger Marie Bjerre.", "lt": 0, "lp": 0.59, "src": "DR · 2022-10-24", "s": "For", "sc": 0.74}, {"p": "Marie Bjerre", "pa": "V", "c": "Det giver et incitament til innovative, grønne landmænd. Det er sådan set en borgerlig-liberale løsning på klimaudfordringerne, fordi man får sat markedskræfterne i spil, så det er ikke er os, der regulerer, hvordan man skal producere, men markedet der finder ud af honorere dem, der producerer grønnest.", "lt": 2, "lp": 0.86, "src": "DR · 2022-10-24", "s": "Neutral", "sc": 0.01}, {"p": "Marie Bjerre", "pa": "V", "c": "Selvom vi gør rigtig meget i Danmark for at bekæmpe klimaforandringer, bliver vi nødt til at være ansvarlige og erkende, at klimaforandringerne desværre er undervejs, siger Venstres klimaordfører, Marie Bjerre, til TV 2.", "lt": 1, "lp": 0.86, "src": "TV 2 · 2022-10-29", "s": "Imod", "sc": -0.17}, {"p": "Martin Lidegaard", "pa": "RV", "c": "Statsministeren afholder pressemøde onsdag 5. oktober 2022 klokken 13.00 på Marienborg. Her vil statsminister Mette Frederiksen komme med en udtalelse, lyder beskeden fra Statsministeriet.", "lt": 4, "lp": 0.63, "src": "TV 2 · 2022-10-05", "s": "For", "sc": 0.1}, {"p": "Martin Lidegaard", "pa": "RV", "c": "Med den modgang, verden står overfor, kriser, der griber ind over hinanden, er tiden kommet til at afprøve en ny regeringsform i Danmark. Et mere forpligtende politisk samarbejde, siger hun nu.", "lt": 3, "lp": 0.9, "src": "TV 2 · 2022-10-05", "s": "For", "sc": 0.13}, {"p": "Martin Lidegaard", "pa": "RV", "c": "Man må forstå det på den måde, at det er en bred regering under hendes (Mette Frederiksen, red.) ledelse. Det er jo ikke forhandlinger, der handler om, hvorvidt Jakob Ellemann eller Lars Løkke skal lede en regering, siger han til TV 2.", "lt": 3, "lp": 0.65, "src": "TV 2 · 2022-10-05", "s": "For", "sc": 0.94}, {"p": "Martin Lidegaard", "pa": "RV", "c": "Når jeg hører en statsminiser, der gerne vil danne en regering over midten, er det eneste, jeg hører, en statsminister, der vil være statsminister for enhver pris, har Venstre-lederen sagt til TV 2.", "lt": 3, "lp": 0.92, "src": "TV 2 · 2022-10-05", "s": "For", "sc": 0.22}, {"p": "Martin Lidegaard", "pa": "RV", "c": "Stemningen var god 00:44 Folketingsvalg 2022 Kan Mette F. forhandle med Alternativet om advokatundersøgelsen? 01:13 Folketingsvalg 2022 Pia Olsen Dyhr afviser ikke at sidde i regering med Løkke 01:01 Folketingsvalg 2022 Martin Lidegaard vil ikke svare på spørgsmål om Rwanda 00:58 Folketingsvalg 2022 EL er klar til at gå i &quot;benhård opposition&quot;, hvis Løkke kommer i regering 02:01 Folketingsvalg 2022 Hvad er det, Socialdemokratiet vil? spørger Vanopslagh 00:59 Folketingsvalg 2022 Pape: Man kan også arbejde udenfor regeringen 01:05 Folketingsvalg 2022 Vanopslagh:", "lt": 2, "lp": 0.75, "src": "TV 2 · 2022-10-09", "s": "Neutral", "sc": -0.02}, {"p": "Martin Lidegaard", "pa": "RV", "c": "Vi er ikke gået i raseri 01:18 Folketingsvalg 2022 Aaja Chemnitz har møde med Løkke senere 01:20 Folketingsvalg 2022 Danmarksdemokraterne er ude af forhandlingerne 00:33 Folketingsvalg 2022 Støjberg: Vi er enige om et udrejsecenter i Rwanda 00:29 Folketingsvalg 2022", "lt": 2, "lp": 0.93, "src": "TV 2 · 2022-10-09", "s": "Neutral", "sc": 0.0}, {"p": "Martin Lidegaard", "pa": "RV", "c": "Vi har mest snakket politik 00:41 Folketingsvalg 2022 Vil ikke støtte regering, der arbejder videre med Rwanda 00:50 Folketingsvalg 2022 Den rigtige beslutning 00:22 Folketingsvalg 2022 Havde stadig tillid til Sofie Carsten Nielsen 00:12 Folketingsvalg 2022 Rwanda er stadig et krav 00:26 Folketingsvalg 2022", "lt": 2, "lp": 0.89, "src": "TV 2 · 2022-10-09", "s": "Neutral", "sc": -0.02}, {"p": "Martin Lidegaard", "pa": "RV", "c": "Hvor det tidligere var politikerselfien, er det uden tvivl det her shortvideo (kort video, red.) format, der kommer til at tegne valgkampen, siger han.", "lt": 4, "lp": 0.54, "src": "TV 2 · 2022-10-10", "s": "Neutral", "sc": -0.01}, {"p": "Martin Lidegaard", "pa": "RV", "c": "Det står jeg helt på mål for. Uanset hvordan vi lander i aften, synes jeg, det var den rigtige beslutning.", "lt": 2, "lp": 0.83, "src": "DR · 2022-11-01", "s": "For", "sc": 0.27}, {"p": "Martin Lidegaard", "pa": "RV", "c": "Jeg er da møg-ked af det, hvis målingen skulle vise sig at være rigtig. Men jeg tillader mig at sige, at det står i meget stor kontrast til det, jeg har mødt på gaden. Så jeg håber stadig, vi kan snige et mandat eller to mere ind, sagde Martin Lidegaard.", "lt": 2, "lp": 0.61, "src": "DR · 2022-11-01", "s": "Neutral", "sc": -0.02}, {"p": "Martin Lidegaard", "pa": "RV", "c": "Opstår muligheden, kommer vi til at gribe den. Jeg håber på, at vi kan være med til at danne en regering, sagde Pape, der lovede at kæmpe for &quot;maksimal indflydelse&quot;.", "lt": 3, "lp": 0.77, "src": "TV 2 · 2022-11-01", "s": "Neutral", "sc": -0.03}, {"p": "Mattias Tesfaye", "pa": "S", "c": "Jeg har lige selv fået bogen i dag. Jeg har kun lige bladret hurtigt igennem den, så det er lidt svært for mig at kommentere på den, inden jeg har læst noget.", "lt": 0, "lp": 0.83, "src": "DR · 2022-10-13", "s": "Neutral", "sc": 0.0}, {"p": "Mattias Tesfaye", "pa": "S", "c": "Og derudover så er jeg også underlagt tavshedspligt, så derfor kommer jeg ikke til at sige noget om sagen og sagens forløb, desværre, siger Mattias Tesfaye.", "lt": 0, "lp": 0.17, "src": "DR · 2022-10-13", "s": "", "sc": NaN}, {"p": "Mattias Tesfaye", "pa": "S", "c": "Det er rigtigt, det kan jeg hverken bekræfte eller afkræfte, svarer Mattias Tesfaye.", "lt": 2, "lp": 0.58, "src": "DR · 2022-10-13", "s": "Neutral", "sc": 0.02}, {"p": "Mattias Tesfaye", "pa": "S", "c": "Jeg kan sagtens forstå, hvordan det ser ud fra Lars Findsens side. Men vi er måske faktisk lidt i samme båd. For jeg føler heller ikke, jeg kan fremlægge, hvordan anklagemyndigheden ser på denne her sag, siger Mattias Tesfaye og tilføjer:", "lt": 1, "lp": 0.55, "src": "DR · 2022-10-13", "s": "Imod", "sc": -0.06}, {"p": "Mattias Tesfaye", "pa": "S", "c": "Og det er jo derfor både den tiltalte og anklagemyndigheden må have tillid til, at domstolene, efter at have hørt både anklagernes og forsvarens fremlæggelse i retssagen, at dommeren er i stand til at træffe en afgørelse.", "lt": 5, "lp": 0.86, "src": "DR · 2022-10-13", "s": "For", "sc": 0.22}, {"p": "Mattias Tesfaye", "pa": "S", "c": "Jeg er faktisk temmelig forbløffet over, at regeringen har været inde over det her, siger hun.", "lt": 3, "lp": 0.39, "src": "DR · 2022-10-13", "s": "", "sc": NaN}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Det er da glædeligt, at Socialdemokratiet nu trækker lidt i den rigtige retning, omend det er lidt en overraskende melding i forhold til den politik, de har praktiseret, siger hun.", "lt": 3, "lp": 0.72, "src": "DR · 2022-10-09", "s": "Imod", "sc": -0.05}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Det er nye toner fra Socialdemokratiet og det er sødere musik end jeg hidtil har hørt fra dem, men jeg ved ikke helt, om jeg for alvor tror på dem.", "lt": 3, "lp": 0.79, "src": "DR · 2022-10-09", "s": "Imod", "sc": -0.24}, {"p": "Mette Abildgaard", "pa": "KF", "c": "I vores finanslovsudspil har vi foreslået en forebyggelseskommission, som blandt andet skal se på mistrivslen hos unge mennesker. Det her er ikke noget, vi løser med et fingerknips, og vi har ikke alle svarene nu, hvis jeg skal være helt ærlig.", "lt": 1, "lp": 0.38, "src": "DR · 2022-10-10", "s": "", "sc": NaN}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Når der skal ændres en kultur, så er det hele samfundet, der skal spille med. Det er forældrene, det er skolen, og det er civilsamfundet, siger hun.", "lt": 3, "lp": 0.54, "src": "DR · 2022-10-10", "s": "Imod", "sc": -0.12}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Vi har masser af politik på hylderne, som vi gerne vil ud og tale om, og det er selvfølgelig ærgerligt, når man ikke altid kan få lov at levere de budskaber, siger Mette Abildgaard.", "lt": 0, "lp": 0.88, "src": "DR · 2022-10-16", "s": "Neutral", "sc": -0.05}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Om det er det, der spiller ind på meningsmålingerne, det kan jeg ikke konkludere på nogen måde, men jeg kan bare sige, at det er vores partiformand, som har æren for, at vi står til en fremgang i Det Konservative Folkeparti.", "lt": 4, "lp": 0.53, "src": "DR · 2022-10-16", "s": "Neutral", "sc": 0.0}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Som et af de få borgerlige partier står vi jo stadig til at blive et større parti ved det kommende valg, siger Mette Abildgaard.", "lt": 5, "lp": 0.54, "src": "DR · 2022-10-16", "s": "Neutral", "sc": 0.01}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Det er svært at konkludere, hvad der er årsag til det fald. Men det er klart, at når man melder sig som statsministerkandidat, så kommer der et ekstra pres fra alle kanter, både på de personlige sager, men også på det politiske, siger hun.", "lt": 3, "lp": 0.88, "src": "DR · 2022-10-16", "s": "Imod", "sc": -0.16}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Søren Pape er 100 procent Det Konservative Folkepartis statsministerkandidat, og jeg er helt sikker på, han vil være en fantastisk statsminister, siger Mette Abildgaard og tilføjer:", "lt": 4, "lp": 0.91, "src": "DR · 2022-10-16", "s": "For", "sc": 0.3}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Men vi har også hele tiden sagt, at det afgørende er at få en anden statsminister end Mette Frederiksen. Om det så bliver Søren Pape eller en anden i blå blok, det må tiden vise.", "lt": 5, "lp": 0.86, "src": "DR · 2022-10-16", "s": "Imod", "sc": -0.06}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Søren Pape er vores konservative statsministerkandidat, og jeg er ikke et sekund i tvivl om, han vil være en fantastisk statsminister, siger Mette Abildgaard.", "lt": 4, "lp": 0.86, "src": "DR · 2022-10-16", "s": "Neutral", "sc": 0.0}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Jeg synes, at der er meget stor usikkerhed forbundet med Lars Løkkes projekt. Vi må konstatere, at en stemme på ham er en stemme på rød blok, efter de meldinger der er kommet i dag ( i går, red.). Og det håber jeg, at vil få mange borgerlige vælgere til at overveje, om det er den rigtige vej at gå at stemme på ham til det kommende valg, siger hun.", "lt": 0, "lp": 0.68, "src": "DR · 2022-10-22", "s": "Imod", "sc": -0.07}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Der kan også være andre opstillere af landvind, der har et ønske om, at der bliver lavet mere fleksible ordninger, siger Mette Abildgaard.", "lt": 0, "lp": 0.72, "src": "DR · 2022-10-28", "s": "For", "sc": 0.58}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Vestas glemmer, hvor mange der generes af de her meget store vindmøller på land. I Dansk Folkeparti har vi altid været meget optaget af at tage hensyn til dem, der bliver ramt af skyggekast, lavfrekvens støj og så videre.", "lt": 4, "lp": 0.46, "src": "DR · 2022-10-28", "s": "Neutral", "sc": 0.01}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Jeg synes, at man skal prioritere at sætte flere møller op på havet, hvor det ikke generer nogen, siger han.", "lt": 2, "lp": 0.58, "src": "DR · 2022-10-28", "s": "Neutral", "sc": 0.0}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Det er både ambitiøst og realistisk, hvis det gøres på den rigtige måde. Der er plads til det, og vi har brug for, at det skal gå hurtigt, siger han.", "lt": 4, "lp": 0.83, "src": "DR · 2022-10-28", "s": "For", "sc": 0.52}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Pengene skal bruges til at opbygge kommunernes kompetencer til at lave planlægning inden for vedvarende energi, for det er de fleste kommuner rigtig, rigtig dårlige til. Man ville kunne ansætte nogle fagligt kompetente personer i kommunerne, der kan hjælpe med at lave planlægningen.", "lt": 5, "lp": 0.46, "src": "DR · 2022-10-28", "s": "Neutral", "sc": -0.0}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Planlægningen er grundlaget for, at man kan lave en ambitiøs plan. Det er det, der tager lang tid. Og når det ikke lykkes, så er det der, protesterne kommer. Det er ikke på grund af vindmøllerne eller solcellerne eller noget andet.", "lt": 4, "lp": 0.79, "src": "DR · 2022-10-28", "s": "Imod", "sc": -0.18}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Det er simpelthen, fordi planlægningen er for dårlig, og folk føler sig kørt henover og ikke hørt.", "lt": 5, "lp": 0.86, "src": "DR · 2022-10-28", "s": "Imod", "sc": -0.38}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Det er klart, at sådan en meningsmåling er ikke det, vi håber og ønsker at lande på ved valgdagen, siger politisk ordfører Mette Abildgaard.", "lt": 0, "lp": 0.48, "src": "DR · 2022-10-30", "s": "Neutral", "sc": -0.01}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Lige nu bruger vi kræfterne på at sikre de sidste stemmer, og alt, hvad der handler om at kigge tilbage, tager vi efter et valg.", "lt": 1, "lp": 0.55, "src": "DR · 2022-10-30", "s": "For", "sc": 0.17}, {"p": "Mette Abildgaard", "pa": "KF", "c": "Man skal ikke være en højtlønnet politisk analytiker for at regne ud, at vores chancer for at få statsministerposten er blevet noget forringet i forhold til, hvad den var for nogle måneder siden, siger hun.", "lt": 0, "lp": 0.39, "src": "DR · 2022-10-30", "s": "", "sc": NaN}, {"p": "Mette Frederiksen", "pa": "S", "c": "Hvis vi pumper en masse penge ud, så risikerer vi bare, at krisen kører længere og værre. Vi bliver nødt til at tage noget tempo ud af økonomien, sagde hun.", "lt": 1, "lp": 0.67, "src": "DR · 2022-10-05", "s": "Neutral", "sc": 0.03}, {"p": "Mette Frederiksen", "pa": "S", "c": "I Socialdemokratiet går vi til valg på socialdemokratisk politik, som I kender os. Men vi er klar til både kompromiser og til samarbejde. For i de svære tider, vi lever i, med den modgang verden står overfor og kriser, der griber hinanden, så er tiden er kommet til at afprøve en ny regeringsform i Danmark, lød det fra statsministeren. Det vil vi gerne stille os i spidsen for. En bred regering med partier fra begge sider af den politiske midte, sagde Mette Frederiksen.", "lt": 3, "lp": 0.96, "src": "DR · 2022-10-05", "s": "For", "sc": 0.99}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi bekender os til en etpartiregering. Det er det, vi går til valg på og ønsker opbakning til. Men vi vil nu også gerne åbne en diskussion af, om der kan være en bred regering. Det er meget reelt og også rigtigt at åbne den diskussion, så danskerne kan forholde sig til det, også i god tid inden et valg.", "lt": 3, "lp": 0.59, "src": "DR · 2022-10-05", "s": "Imod", "sc": -0.92}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg synes, at det er ærgerligt, at man afviser det så bombastisk, for jeg tror faktisk, at det vil være godt for Danmark. Og når du spørger om, hvem der skal med, så har jeg ikke lyst til at udelukke nogen partier, der kan gå med i sådan et bredt samarbejde. Jeg vil opfordre både Pape og Ellemann til at tænke over det en ekstra gang, siger Mette Frederiksen.", "lt": 3, "lp": 0.42, "src": "DR · 2022-10-05", "s": "Imod", "sc": -0.22}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi går til valg mig med statsministerkandidat, og det kommer vi til at holde fast i, siger Mette Frederiksen.", "lt": 3, "lp": 0.79, "src": "DR · 2022-10-05", "s": "For", "sc": 0.08}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det Mette Frederiksen siger nu er lige så godt, som da jeg selv sagde det i slutningen af sidste valgkamp. Dengang sagde Mette Frederiksen: &#x27;Glem alt om det&#x27;, siger Moderaternes formand, Lars Løkke Rasmussen.", "lt": 1, "lp": 0.79, "src": "DR · 2022-10-05", "s": "Neutral", "sc": -0.02}, {"p": "Mette Frederiksen", "pa": "S", "c": "Men det er da positivt, at hun med nogle års forsinkelse er nået frem til den samme konklusion.", "lt": 3, "lp": 0.54, "src": "DR · 2022-10-05", "s": "Imod", "sc": -0.1}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det lyder lige så godt, som da jeg selv sagde det i afslutningen af sidste valgkamp. Den gang sagde Mette Frederiksen: &quot;Glem alt om det, det er ikke nogen god ide.&quot;", "lt": 1, "lp": 0.79, "src": "DR · 2022-10-05", "s": "Neutral", "sc": -0.05}, {"p": "Mette Frederiksen", "pa": "S", "c": "Men det er positivt, at hun med nogle års forsinkelse er nået til samme konklusion. Så det hilser jeg velkomment.", "lt": 3, "lp": 0.72, "src": "DR · 2022-10-05", "s": "Neutral", "sc": -0.03}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg er klar til at lede Danmark, hvis danskerne vil det. Jeg er klar til at lede Danmark gennem krisen sammen med de andre borgerlige partier.", "lt": 3, "lp": 0.86, "src": "DR · 2022-10-05", "s": "For", "sc": 0.38}, {"p": "Mette Frederiksen", "pa": "S", "c": "Mette Frederiksen mener ikke, hun har begået fejl i minksagen. Hun vil gerne give medarbejdere og kolleger skylden. Alting er altid alle andres skyld, siger han.", "lt": 4, "lp": 0.32, "src": "DR · 2022-10-05", "s": "", "sc": NaN}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi oplever en statsminister, senest her ved valgudskrivelsen, som har reflekteret over, hvad der faktisk vil være bedst for Danmark. Og en statsminister, der viser vilje til at samle og række ud efter et bredere samarbejde.", "lt": 3, "lp": 0.65, "src": "DR · 2022-10-05", "s": "For", "sc": 0.93}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi vil have en bred regering med partier på begge sider af den politiske midte, siger Mette Frederiksen.", "lt": 3, "lp": 0.83, "src": "DR · 2022-10-05", "s": "For", "sc": 0.99}, {"p": "Mette Frederiksen", "pa": "S", "c": "Folketingsvalget i 2022 bliver et tryghedsvalg. Tryghed for den enkelte, for familierne, jeres økonomi og hverdag. Og tryghed for Danmark, Europa og verden.", "lt": 4, "lp": 0.69, "src": "DR · 2022-10-05", "s": "For", "sc": 0.56}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg er stolt af de resultater, den her regering har opnået i mere end tre år. Det, vi sagde før valget, har vi gjort efter valget. Nu beder vi om et nyt mandat tirsdag den 1. november, når Danmark skal til valg, lød det.", "lt": 3, "lp": 0.51, "src": "DR · 2022-10-05", "s": "For", "sc": 0.29}, {"p": "Mette Frederiksen", "pa": "S", "c": "Tampen brænder, svarede Mette Frederiksen med et smil.", "lt": 0, "lp": 0.17, "src": "DR · 2022-10-05", "s": "", "sc": NaN}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg synes, at det er ærgerligt, at man afviser det så bombastisk, for jeg synes faktisk, at det ville være godt for Danmark. Vi fortsætter med at mene, at det er en god idé, sagde hun til TV 2 under et pressemøde på Køge Torv onsdag eftermiddag.", "lt": 5, "lp": 0.47, "src": "TV 2 · 2022-10-05", "s": "Neutral", "sc": 0.01}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi så det sidst i 2019, da Lars Løkke Rasmussen præsenterede samme ide, at det er populært blandt vælgerene. Det handler om, at man godt kan lide at se voksne mennesker sætte sig sammen og tage ansvar, særligt i krisetider, lyder det fra Søs Marie Serup.", "lt": 1, "lp": 0.5, "src": "TV 2 · 2022-10-05", "s": "Imod", "sc": -0.22}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det skyldes, at hun under coronakrisen og krisehåndteringen af krigen i Ukraine har vist, at hun ikke er bange for at tage styringen og lede landet igennem kriser, lyder det fra Jesper Vestergren.", "lt": 1, "lp": 0.86, "src": "TV 2 · 2022-10-05", "s": "Neutral", "sc": -0.01}, {"p": "Mette Frederiksen", "pa": "S", "c": "Alt tyder på, at, ja, det bliver i dag, der bliver udskrevet valg. Kryptiske svar fra statsministeren Mette Frederiksen parerede i går gentagne gange journalisters valgspørgsmål med et skævt smil og kommentaren: &quot;Mon ikke det nærmer sig?&quot;. Så ses vi garanteret alle sammen i morgen Statsminister Mette Frederiksen (S) tirsdag aften Tirsdag aften svarede Mette Frederiksen: &quot;Tampen brænder&quot; under et interview på DR, da hun blev spurgt om valgudskrivelse i dag. Og &quot;det bliver varmere&quot;, lød svaret, da klokkeslættet 10.30 blev nævnt.", "lt": 1, "lp": 0.72, "src": "TV 2 · 2022-10-05", "s": "Neutral", "sc": 0.03}, {"p": "Mette Frederiksen", "pa": "S", "c": "Ja, så kan det godt være, at du skal tænke dig lidt om igen, sagde hun, mens hun satte sig ind i ministerbilen.", "lt": 4, "lp": 0.39, "src": "TV 2 · 2022-10-05", "s": "", "sc": NaN}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg er ret overbevist om, at der bliver udskrevet valg i morgen (onsdag, red.), og det er helt fint med os, sagde hun.", "lt": 5, "lp": 0.79, "src": "TV 2 · 2022-10-05", "s": "Neutral", "sc": -0.0}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det vil vi (Socialdemokratiet, red.) gerne stille os i spidsen for. En bred regering med partier fra begge sider af den politiske midte, siger Mette Frederiksen.", "lt": 3, "lp": 0.91, "src": "TV 2 · 2022-10-05", "s": "For", "sc": 0.99}, {"p": "Mette Frederiksen", "pa": "S", "c": "Tampen brænder, og den brænder endnu mere nu, svarede statsministeren med et skævt smil på vej ind til statsråd på Christiansborg.", "lt": 2, "lp": 0.54, "src": "TV 2 · 2022-10-05", "s": "For", "sc": 0.16}, {"p": "Mette Frederiksen", "pa": "S", "c": "Mennesker med handicap, de allermest udsatte børn, den ensomme ældre, unge i psykiatrien og dig, der ikke tør gå ned i vaskekælderen på grund af nogle utilpassede unge, som forpester din hverdag, siger Mette Frederiksen.", "lt": 4, "lp": 0.88, "src": "TV 2 · 2022-10-05", "s": "For", "sc": 0.17}, {"p": "Mette Frederiksen", "pa": "S", "c": "Og så vil vi huske alle jer, de tusindvis af helt almindelige danskere, som kan se jeres løn blive udhulet på grund af inflationen.", "lt": 4, "lp": 0.6, "src": "TV 2 · 2022-10-05", "s": "Imod", "sc": -0.25}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi har en klar ambition om at komme i Folketinget. Ultimativt på en måde, hvor en regeringsdannelse ikke kan finde sted uden om os, uden at vi har en afgørende stemme, sagde Løkke for eksempel til Berlingske for et år siden, da Moderaterne havde opnået de fornødne vælgererklæringer til at stille op til valget Statsminister Mette Frederiksen (S) går til valg med ønsket om at danne en bred regering med partier fra begge sider af midten i dansk politik.", "lt": 3, "lp": 0.95, "src": "TV 2 · 2022-10-05", "s": "For", "sc": 1.0}, {"p": "Mette Frederiksen", "pa": "S", "c": "Med den modgang, verden står over for, kriser, der griber ind over hinanden, så er tiden kommet til at afprøve en ny regeringsform i Danmark. Et mere forpligtende samarbejde. Det vil vi gerne stille os i spidsen for. En bred regering med partier fra begge sider af den politiske midte, sagde hun.", "lt": 3, "lp": 0.94, "src": "TV 2 · 2022-10-05", "s": "For", "sc": 1.0}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det er en bombe at indlede valgkampen på Den beslutning roser Sofie Carsten Nielsen:", "lt": 2, "lp": 0.58, "src": "TV 2 · 2022-10-05", "s": "For", "sc": 0.21}, {"p": "Mette Frederiksen", "pa": "S", "c": "Mette Frederiksen har gentagne gange rakt hånden frem og været åben over for værdien af en bred regering hen over midten, der kan håndtere kriser, mindske polariseringen og indgå langsigtede aftaler.", "lt": 3, "lp": 0.6, "src": "TV 2 · 2022-10-05", "s": "For", "sc": 0.96}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg mener ikke, at det vil være klogt at lukke højrefløjen ind. Det er partier, som vil skære i velfærden, siger hun og fortsætter:", "lt": 5, "lp": 0.83, "src": "TV 2 · 2022-10-05", "s": "Imod", "sc": -0.95}, {"p": "Mette Frederiksen", "pa": "S", "c": "Derfor mener jeg faktisk, at din udmelding i dag var uklog.", "lt": 0, "lp": 0.17, "src": "TV 2 · 2022-10-05", "s": "", "sc": NaN}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi har ikke snakket om noget Formand for Moderaterne, Lars Løkke Rasmussen, mener ikke, at der er snakket nok politik under debatten.", "lt": 1, "lp": 0.86, "src": "TV 2 · 2022-10-05", "s": "Neutral", "sc": -0.0}, {"p": "Mette Frederiksen", "pa": "S", "c": "Ærligt talt har vi ikke rigtig snakket om noget, siger han.", "lt": 0, "lp": 0.39, "src": "TV 2 · 2022-10-05", "s": "", "sc": NaN}, {"p": "Mette Frederiksen", "pa": "S", "c": "Der er tillid og respekt mellem os kolleger. Der findes ikke et blåt Folketing og et rødt Folketing – der findes kun et Folketing, lød det ganske i tråd med Mette Frederiksens ønske om en bred regering over midten.", "lt": 3, "lp": 0.61, "src": "DR · 2022-10-06", "s": "For", "sc": 0.93}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det var en fejl, at vi ikke fandt nogle bedre muligheder for, at folk kunne sige farvel til hinanden på hospicer og hospitaler, men vi frygtede smitte.", "lt": 3, "lp": 0.54, "src": "DR · 2022-10-06", "s": "Imod", "sc": -0.08}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det var også en fejl, da jeg på et andet pressemøde sagde &quot;lev med det&quot;. Det var tænkt som et forsøg på at forsvare nogle mennesker, der stod midt i krisehåndteringen.", "lt": 4, "lp": 0.86, "src": "DR · 2022-10-06", "s": "Imod", "sc": -0.14}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det var ikke en fejl at slå minkene ned i Danmark. Jeg kunne godt holde en lang tale om den risikovurdering, vi modtog, og vores bekymring for hele verden og vaccinernes effekt. Det har vi gjort ved flere andre lejligheder.", "lt": 4, "lp": 0.86, "src": "DR · 2022-10-06", "s": "Neutral", "sc": 0.01}, {"p": "Mette Frederiksen", "pa": "S", "c": "Men Minkkommissionen siger jo klart, at statsministeren – som jo er undertegnede – at jeg ikke var vidende om, at der ikke var hjemmel, og at jeg i øvrigt har overholdt min sandhedspligt over for Folketinget.", "lt": 3, "lp": 0.79, "src": "DR · 2022-10-06", "s": "Imod", "sc": -0.19}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det er ikke rigtigt, det er meget dygtigt &quot;spunnet&quot;, at magtfuldkommenhed skulle være årsagen til at minkene blev slået ned, lød afvisningen fra Mette Frederiksen.", "lt": 1, "lp": 0.58, "src": "DR · 2022-10-06", "s": "Imod", "sc": -0.45}, {"p": "Mette Frederiksen", "pa": "S", "c": "Priserne stiger på alt det, vi har brug for. På mad i supermarkedet, på strøm og på varmen. Den utryghed, det er den vigtigste politiske opgave lige nu.", "lt": 4, "lp": 0.38, "src": "DR · 2022-10-06", "s": "", "sc": NaN}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi sidder faktisk som regering og kigger på, om der er flere skridt man kan tage. Det er bare vigtigt for os, at hvis vi gør noget, så skal pengene findes et andet sted – i modsætning til under corona, hvor man sendte masser af penge ud i økonomien, næsten uden videre.", "lt": 1, "lp": 0.83, "src": "DR · 2022-10-06", "s": "Imod", "sc": -0.06}, {"p": "Mette Frederiksen", "pa": "S", "c": "Hvis du sender penge ud uden videre, så risikerer du faktisk at priserne stiger endnu mere, og så har man jo tabt i en by som Skarp Salling.", "lt": 1, "lp": 0.88, "src": "DR · 2022-10-06", "s": "Neutral", "sc": 0.01}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg skal bestemt ikke udelukke, at der skal gøres mere – ikke kun for landdistrikterne, men sådan set for hele landet. Jeg hører selv til en af dem, der har gas, og jeg må bare sige, at det er nogle voldsomme regninger, der kommer ind i øjeblikket.", "lt": 5, "lp": 0.55, "src": "DR · 2022-10-06", "s": "Neutral", "sc": -0.01}, {"p": "Mette Frederiksen", "pa": "S", "c": "Hvad der skal gøres, er et rigtig, rigtig stort spørgsmål her i valgkampen.", "lt": 0, "lp": 0.17, "src": "DR · 2022-10-06", "s": "", "sc": NaN}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det siger jo sig selv, at der, hvor der er gasfyr, kan man ikke leje boliger ud. Og slet ikke sælge. Der er virkelig mange, som kommer til at få kæmpe udgifter og kæmpe problemer. Jeg kan da godt være bange for, at de små samfund lukker mere eller mindre ned.", "lt": 4, "lp": 0.91, "src": "DR · 2022-10-06", "s": "Imod", "sc": -0.32}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi vil huske på dig, der ikke tør gå ned i vaskekælderen på grund af nogle utilpassede unge, som forpester din hverdag, sagde hun tidligere på dagen.", "lt": 4, "lp": 0.72, "src": "DR · 2022-10-06", "s": "Imod", "sc": -0.17}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det er med til at skabe en stemning i gadebilledet af, at nu er der valgkamp, og alle skal til at gøre deres stilling op, siger hun.", "lt": 1, "lp": 0.58, "src": "DR · 2022-10-08", "s": "Neutral", "sc": 0.04}, {"p": "Mette Frederiksen", "pa": "S", "c": "At få det brede samarbejde er rigtig godt for den situation, vi står i nu her. Vi ved ikke, hvad der sker i morgen, om en uge eller om en måned, men der er gode kræfter i alle partier, som kun vil landet det bedste.", "lt": 5, "lp": 0.66, "src": "DR · 2022-10-09", "s": "For", "sc": 0.08}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg håber, at hvis der er nogle socialdemokrater, som er imod det, så er det fordi, man ønsker, at den nuværende regering fortsætter. Så det tager jeg som opbakning til regeringen, men ikke desto mindre, så synes jeg, at vi skal lave en bred regering i Danmark, siger Mette Frederiksen.", "lt": 3, "lp": 0.91, "src": "DR · 2022-10-09", "s": "For", "sc": 0.91}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det er helt rigtigt, hvis man skal lave en bred regering i Danmark, så skal vi få enderne til at nå hinanden, og man skal være villig til at indgå nogle kompromiser, siger Mette Frederiksen og understreger, at Socialdemokratiet både er optaget af økonomisk ansvarlighed og social retfærdighed.", "lt": 3, "lp": 0.9, "src": "DR · 2022-10-09", "s": "For", "sc": 0.97}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg kan jo aldrig garantere, hvad de andre partier kommer til forhandlingsbordet med, siger Mette Frederiksen.", "lt": 0, "lp": 0.17, "src": "DR · 2022-10-09", "s": "", "sc": NaN}, {"p": "Mette Frederiksen", "pa": "S", "c": "Nej det vil jeg faktisk ikke, for hvis vi bruger hele valgkampen på, at alle partier siger, at det vil vi ikke, og det vil vi, så kommer vi jo aldrig til at kunne nå hinanden, siger Mette Frederiksen.", "lt": 3, "lp": 0.79, "src": "DR · 2022-10-09", "s": "Imod", "sc": -0.55}, {"p": "Mette Frederiksen", "pa": "S", "c": "I Socialdemokratiet går vi til valg på socialdemokratisk politik, som I kender os. Men vi er klar til både kompromiser og til samarbejde. For i de svære tider, vi lever i, med den modgang verden står overfor og kriser, der griber hinanden, så er tiden er kommet til at afprøve en ny regeringsform i Danmark.", "lt": 3, "lp": 0.94, "src": "DR · 2022-10-09", "s": "For", "sc": 0.19}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det vil vi gerne stille os i spidsen for. En bred regering med partier fra begge sider af den politiske midte, sagde Mette Frederiksen.", "lt": 3, "lp": 0.88, "src": "DR · 2022-10-09", "s": "For", "sc": 0.99}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg tror ikke sådan en regering vil holde ret længe, og at vi inden for kort tid ville blive nødt til at tage et valg igen, siger han.", "lt": 1, "lp": 0.58, "src": "DR · 2022-10-09", "s": "Imod", "sc": -0.07}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg har svært ved at se et regeringssamarbejde med partierne i blå blok. Det brede samarbejde lyder jo rigtig godt, men de blå partier siger jo selv, at de ikke kan gå i regering med Socialdemokratiet.", "lt": 3, "lp": 0.56, "src": "DR · 2022-10-09", "s": "Imod", "sc": -0.98}, {"p": "Mette Frederiksen", "pa": "S", "c": "Der er noget galt i forklaring om bred regering over midten 01:17 Folketingsvalg 2022 Klima stadig på dagsordenen 00:45 Folketingsvalg 2022 Messerschmidt: Det er også en slags danmarkshistorie 00:30 Folketingsvalg 2022 Mette Frederiksen har indgivet afskedsbegæring 00:40 Folketingsvalg 2022 Enhedslisten opdagede optællingsfejl i aftes 01:30", "lt": 2, "lp": 0.61, "src": "TV 2 · 2022-10-09", "s": "Imod", "sc": -0.15}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi kommer til at mangle rigtig mange medarbejdere, derfor er mit bedste bud en helhedsløsning for velfærdssamfundet, hvor vi også anerkender, at løn- og arbejdsvilkår skal spille en rolle, sagde Mette Frederiksen under statsministertriellen.", "lt": 1, "lp": 0.86, "src": "DR · 2022-10-10", "s": "Neutral", "sc": -0.01}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi bliver nødt til at gå til det her spørgsmål på en helt anden måde, end vi har været vant til, for ellers kan vi ikke skaffe de sosu&#x27;er, sygeplejersker og andre vigtige faggrupper, lød det også fra Mette Frederiksen.", "lt": 1, "lp": 0.83, "src": "DR · 2022-10-10", "s": "For", "sc": 0.22}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det, vi kommer til, er at lægge nogle principper frem for, hvordan vi kan arbejde videre med det her lønspørgsmål, som er vigtigt i forhold til vores velfærdssamfund, siger Mette Frederiksen.", "lt": 4, "lp": 0.64, "src": "DR · 2022-10-10", "s": "For", "sc": 0.25}, {"p": "Mette Frederiksen", "pa": "S", "c": "I sidste valgkamp lagde vi også nogle principper frem og lykkedes også med at få det gennemført efterfølgende, siger Mette Frederiksen med henvisning til Arne-pensionen.", "lt": 0, "lp": 0.86, "src": "DR · 2022-10-10", "s": "Neutral", "sc": 0.01}, {"p": "Mette Frederiksen", "pa": "S", "c": "Mette Frederiksen, kameraet er der, værsgo at sige undskyld til de minkavlere, der har mistet hele deres erhverv og hele deres liv... Og til skatteyderne, der har tabt 19 milliarder kroner.", "lt": 5, "lp": 0.79, "src": "DR · 2022-10-10", "s": "Imod", "sc": -0.07}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det siger sig selv, at en sag af den her karakter er jo ikke en, jeg kan gå i detaljer med. Jeg har selv haft, synes jeg, et godt samarbejde med Lars Findsen, også da jeg var justitsminister. Nu er der en sag ved domstolene, siger Mette Frederiksen med henvisning til, at Lars Findsen er tiltalt.", "lt": 2, "lp": 0.54, "src": "DR · 2022-10-13", "s": "Neutral", "sc": 0.01}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg har meget stor tillid til retssystemet i Danmark, og synes selvfølgelig, at det er vigtigt, at sagen får lov til at forløbe, som den skal, siger Mette Frederiksen.", "lt": 1, "lp": 0.79, "src": "DR · 2022-10-13", "s": "Neutral", "sc": -0.02}, {"p": "Mette Frederiksen", "pa": "S", "c": "Til det vil jeg sige, at sagen kører jo ved domstolene nu, og det synes jeg selvfølgelig, at vi som politikere skal have respekt for. Og så er det jo altid op til et Folketing at træffe beslutning om, om der er noget, man vil undersøge på den ene eller anden måde. Men sagen kører ved domstolene, og det er selvfølgelig vigtigt, at der er politisk respekt om retsvæsnet, siger Mette Frederiksen.", "lt": 2, "lp": 0.88, "src": "DR · 2022-10-13", "s": "For", "sc": 0.19}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi skal tage tingene i den rigtige rækkefølge. Der kører nu en sag ved domstolene. Det er vigtigt, at retsvæsnet får lov til at gøre sit arbejde. Og så vil der jo blive nedsat et nyt folketing på et tidspunkt, når vælgerne har fået lov til at sammensætte Folketinget, og der kan Folketinget jo altid tage stilling.", "lt": 4, "lp": 0.93, "src": "DR · 2022-10-13", "s": "Neutral", "sc": 0.03}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg synes, vi skal tage tingene i den rækkefølge, som jeg mener er det mest naturlige, siger Mette Frederiksen.", "lt": 0, "lp": 0.17, "src": "DR · 2022-10-13", "s": "", "sc": NaN}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg ville jo ønske, at jeg kunne svare på alle spørgsmål altid. Der er ikke noget, jeg har mere lyst til. Men det er klart, at der er nogle sager omkring efterretningstjenesterne, hvor vi ikke siger så meget.", "lt": 3, "lp": 0.72, "src": "DR · 2022-10-13", "s": "Imod", "sc": -0.31}, {"p": "Mette Frederiksen", "pa": "S", "c": "Og jeg er jo også underlagt en tavshedspligt omkring forskellige forhold, når vi taler om efterretningstjenesternes arbejde og i det hele taget. Så der vil af gode grunde være spørgsmål, jeg ikke kan besvare, siger Mette Frederiksen.", "lt": 4, "lp": 0.86, "src": "DR · 2022-10-13", "s": "Neutral", "sc": -0.0}, {"p": "Mette Frederiksen", "pa": "S", "c": "Først og fremmest må jeg sige, at jeg ikke har haft lejlighed til at læse bogen. Men jeg kommer nok ikke til på noget tidspunkt at gå ind i en diskussion mellem en departementschef og en FE-chef. Det synes jeg ikke, at jeg har nogen forudsætninger for, siger Mette Frederiksen.", "lt": 1, "lp": 0.83, "src": "DR · 2022-10-13", "s": "Neutral", "sc": -0.01}, {"p": "Mette Frederiksen", "pa": "S", "c": "Inden vi går i gang, skal jeg dog først tale med PET, siger de. En mand og kvinde kommer ind. Jeg kender manden, der er den øverste juridiske chef i PET.", "lt": 0, "lp": 0.79, "src": "DR · 2022-10-13", "s": "Neutral", "sc": 0.01}, {"p": "Mette Frederiksen", "pa": "S", "c": "De siger, at anklagemyndigheden måske vil se på min sag med mildere øjne på to betingelser: At jeg tilstår noget, og at jeg fortæller, hvem pressen har som kilder i PET, skriver han i bogen.", "lt": 1, "lp": 0.83, "src": "DR · 2022-10-13", "s": "Imod", "sc": -0.11}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg svarer senere i dag, lød det Mette Frederiksen her til formiddag.", "lt": 1, "lp": 0.58, "src": "DR · 2022-10-13", "s": "Neutral", "sc": -0.01}, {"p": "Mette Frederiksen", "pa": "S", "c": "Ja. Vi kommer til at stille konkrete krav i forhold til den økonomiske politik, hvor vores støtte selvfølgelig kommer med betingelser.", "lt": 3, "lp": 0.88, "src": "DR · 2022-10-15", "s": "Imod", "sc": -0.13}, {"p": "Mette Frederiksen", "pa": "S", "c": "Og der er det klart, at en skattereform, som giver skattelettelser til blandt andet direktøren, men som ikke tilgodeser pensionisten, den studerende og den enlige mor på kontanthjælp, vil vi ikke acceptere.", "lt": 2, "lp": 0.79, "src": "DR · 2022-10-15", "s": "Imod", "sc": -0.68}, {"p": "Mette Frederiksen", "pa": "S", "c": "Ja selvfølgelig. Det er næsten et mærkeligt spørgsmål, for når vi går til valg på det, så er det, fordi vi mener, at det er rigtigt, i den situation vi står i, at lette skatten på arbejde. Så ja, det er det, som vi har tænkt os at gøre, siger Mette Frederiksen.", "lt": 4, "lp": 0.49, "src": "DR · 2022-10-15", "s": "Neutral", "sc": 0.04}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det kommer an på finansieringen selvfølgelig. Men det forslag, vi har stillet, er at lave en jobcenterreform og ændre på beskæftigelsesindsatsen og samtidig med det sænke skatten på arbejde.", "lt": 4, "lp": 0.45, "src": "DR · 2022-10-15", "s": "For", "sc": 0.51}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det vil vi da kæmpe for, at der er flertal for efter næste valg, og så gennemfører vi det. Jeg tror, at der vil være flertal efter næste valg for at lave en skattereform med fokus på at lette skatten på arbejde, siger Mette Frederiksen.", "lt": 4, "lp": 0.91, "src": "DR · 2022-10-15", "s": "For", "sc": 0.33}, {"p": "Mette Frederiksen", "pa": "S", "c": "Ja, det afgørende for os er, at vi får en sammenhængende politik, som ikke kommer til at øge de økonomiske skel i samfundet. Konkret hvordan en skattereform skal udformes, det må vi jo se på.", "lt": 5, "lp": 0.83, "src": "DR · 2022-10-15", "s": "For", "sc": 0.34}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg går til valg på en borgerlig-liberal regering. Del opslag Facebook X E-mail Link Kl. 22.48 En god debat, siger Mette Frederiksen Mette Frederiksen synes, det var en god debat.", "lt": 1, "lp": 0.47, "src": "TV 2 · 2022-10-16", "s": "Imod", "sc": -0.2}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg sagde to ting. Det ene er, at vi bliver nødt til at erkende er, at løn og vilkår er væsentligt. Vi skal fremlægge nogle principper for, hvordan vi kan arbejde videre. Et af de principper er rekruttering, siger hun.", "lt": 2, "lp": 0.88, "src": "TV 2 · 2022-10-16", "s": "For", "sc": 0.49}, {"p": "Mette Frederiksen", "pa": "S", "c": "Afdæmpet er i virkeligheden det ord, jeg vil sætte på den her debat, siger han og fortsætter:", "lt": 2, "lp": 0.63, "src": "TV 2 · 2022-10-16", "s": "Neutral", "sc": 0.0}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg kommer ikke til at pege på Mette Frederiksen som statsminister Jakob Ellemann-Jensen forsøger at forklare, hvorfor han ikke mener, en bred regering er en god idé.", "lt": 3, "lp": 0.66, "src": "TV 2 · 2022-10-16", "s": "Imod", "sc": -0.68}, {"p": "Mette Frederiksen", "pa": "S", "c": "Når befolkningen så oplever, at man reagerer på det ved at sige: Det vil jeg ikke udtale mig om - og der kan komme en sag om mange år. Så synes jeg ikke, det er ordentligt. Så styrker det ikke tilliden, sagde han.", "lt": 1, "lp": 0.72, "src": "DR · 2022-10-17", "s": "Imod", "sc": -0.16}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg kan fuldstændig afvise, at der skulle være nogen form for politisk forfølgelse i denne her sag, sagde hun.", "lt": 2, "lp": 0.39, "src": "DR · 2022-10-17", "s": "", "sc": NaN}, {"p": "Mette Frederiksen", "pa": "S", "c": "Men jeg håber på en forståelse for, at der er grænser for, hvad man kan udtale sig om, når man er underlagt en tavshedspligt, sagde hun.", "lt": 0, "lp": 0.58, "src": "DR · 2022-10-17", "s": "Neutral", "sc": -0.04}, {"p": "Mette Frederiksen", "pa": "S", "c": "Der, hvor vi har svært ved at rekruttere medarbejdere, der skal vi så kunne bruge løn på en anden måde, end vi gør i dag, sagde Mette Frederiksen.", "lt": 1, "lp": 0.83, "src": "DR · 2022-10-17", "s": "For", "sc": 0.15}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det koster at investere i sundhed. Og faktisk så synes jeg, at man får rigtig meget for det, hvis man gør det her. Og så vil det jo være en god start, siger hun.", "lt": 2, "lp": 0.58, "src": "DR · 2022-10-17", "s": "For", "sc": 0.25}, {"p": "Mette Frederiksen", "pa": "S", "c": "Læg dine planer frem og vær med til at sikre, at der kommer ligeløn, som kan redde vores velfærd.", "lt": 0, "lp": 0.54, "src": "DR · 2022-10-18", "s": "For", "sc": 0.45}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi kommer til at fremlægge de principper, som vi mener kan være rammen for en fortsat diskussion om løn- og arbejdsvilkår, inden danskerne skal stemme den 1. november. Det er jo altid sådan, at når der er en valgkamp, så forsøger vi jo at tilrettelægge det på den bedst mulige måde, siger Mette Frederiksen.", "lt": 2, "lp": 0.93, "src": "DR · 2022-10-18", "s": "For", "sc": 0.48}, {"p": "Mette Frederiksen", "pa": "S", "c": "Den er ikke helt færdig endnu. Vi arbejder stadigvæk på det her. Man kan beskylde mig for rigtigt mange ting, men at være bange er ikke en af dem. Og når vi er gået ind i det her lønspørgsmål, så er det jo, fordi vi mener, at det er vigtigt. Og det er også derfor, at vi kommer til at fremlægge nogle principper for, hvordan vi kan arbejde videre med både løn- og arbejdsvilkår, siger Mette Frederiksen.", "lt": 2, "lp": 0.92, "src": "DR · 2022-10-18", "s": "For", "sc": 0.48}, {"p": "Mette Frederiksen", "pa": "S", "c": "Men når de næsten er klar, så er det jo det samme, som at de ikke er klar endnu. Så vi gør vores arbejde færdigt. Det afgørende er jo, om vi lægger det her frem, inden danskerne skal stemme, og det kommer vi til.", "lt": 2, "lp": 0.53, "src": "DR · 2022-10-18", "s": "For", "sc": 0.43}, {"p": "Mette Frederiksen", "pa": "S", "c": "Når arbejdet er færdigt, siger Mette Frederiksen.", "lt": 4, "lp": 0.58, "src": "DR · 2022-10-18", "s": "For", "sc": 0.13}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det gør vi, fordi der allerede i dag er store problemer med rekruttering og fastholdelse. Vi risikerer, at vores velfærdssamfund, som de fleste af os danskere er glade for, begynder at smuldre. Derfor bliver vi nødt til at anerkende, at løn- og arbejdsforhold er en del af den fremtidige løsning for at sikre vores velfærdssystem, siger hun.", "lt": 2, "lp": 0.93, "src": "DR · 2022-10-25", "s": "For", "sc": 0.7}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det er ikke det, vi foreslår. Vi foreslår at afsætte en pulje på 3 milliarder kroner fra vores 2030-plan med henblik på at sikre en bedre fastholdelse og en bedre rekruttering af medarbejdere i vores velfærdssamfund, siger Mette Frederiksen.", "lt": 0, "lp": 0.55, "src": "DR · 2022-10-25", "s": "Imod", "sc": -0.22}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det er vigtigt for mig at sige, at jeg ikke synes, at det er os politikere, der skal sidde og definere, hvad det er for en gruppe, der skal have mere i løn.", "lt": 1, "lp": 0.86, "src": "DR · 2022-10-25", "s": "Imod", "sc": -0.22}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi skal tage det politiske ansvar for fremtidssikring af vores velfærdssamfund, og der spiller løn- og arbejdsvilkår en rolle, siger Mette Frederiksen.", "lt": 1, "lp": 0.86, "src": "DR · 2022-10-25", "s": "Imod", "sc": -0.3}, {"p": "Mette Frederiksen", "pa": "S", "c": "Ja, det synes jeg bestemt, fordi vi skal virkelig balancere her. På den ene side har vi nogle store udfordringer i velfærdssamfundet, som vi har et ansvar for at være med til at løse. På den anden side har vi en dansk arbejdsmarkedsmodel.", "lt": 1, "lp": 0.9, "src": "DR · 2022-10-25", "s": "For", "sc": 0.07}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi skal balancere mellem de to ting, og det mener jeg, at vi gør ved at tage ansvar for at afsætte nogle penge, indkalde til trepartsforhandlinger og så få fundet en løsning, når det handler om løn- og arbejdsvilkår, siger Mette Frederiksen.", "lt": 1, "lp": 0.9, "src": "DR · 2022-10-25", "s": "Imod", "sc": -0.34}, {"p": "Mette Frederiksen", "pa": "S", "c": "Traditionelt har vi jo set, at aftalerne med de store forbund jo ikke dyrker den meget lokale løndannelse eller en særlig stor løndifferentiering inden for grupperne. Så der bliver bestemt nogle knaster her, hvis det skal målrettes meget specifikt til eksempelvis anæstesisygeplejersker eller akutsygeplejersker.", "lt": 3, "lp": 0.86, "src": "DR · 2022-10-25", "s": "Imod", "sc": -0.09}, {"p": "Mette Frederiksen", "pa": "S", "c": "Der vil bestemt komme nogle diskussioner, som ikke er så simple at lande.", "lt": 1, "lp": 0.72, "src": "DR · 2022-10-25", "s": "For", "sc": 0.17}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det er rigtig svært at gøre det her centralt, for situationen kan se forskellig ud forskellige steder. Derfor ville det være mest oplagt, hvis man lagde de her lønmidler ud til institutionerne og sygehusene, hvor ledelserne kunne allokere pengene derhen, hvor man synes, at de kunne have den største effekt.", "lt": 0, "lp": 0.89, "src": "DR · 2022-10-25", "s": "For", "sc": 0.13}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det ville også være vores anbefaling. Men alle kan jo se allerede i dag, at vi har store problemer på blandt andet ældreområdet, sundhedsområdet og i Kriminalforsorgen, siger hun.", "lt": 2, "lp": 0.58, "src": "DR · 2022-10-25", "s": "For", "sc": 0.21}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det blev dengang og senere kaldt det største bluffnummer i dansk politik. Men hvad er status i dag? I dag har Arne og flere end 40.000 ansatte fået ret til tidlig pension. Det, vi socialdemokrater sagde før valget, leverede vi også på efter valget, sagde Mette Frederiksen.", "lt": 0, "lp": 0.51, "src": "DR · 2022-10-26", "s": "Imod", "sc": -0.14}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi har et fælles problem. Hvis vi ikke gør noget, så må vi se, at vores velfærdssamfund smuldrer langsomt foran os, sagde Mette Frederiksen, der samtidigt hævdede, at timingen af udspillet ikke handler om valgkamp.", "lt": 1, "lp": 0.83, "src": "DR · 2022-10-26", "s": "Neutral", "sc": -0.03}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det her er tænkt som et regneeksempel. Det er et væsentligt beløb, men vi påstår ikke, at alle vil være tilfredse, men afhængigt af, hvordan det bliver gjort, så vil lønstigningen kunne mærkes, sagde statsminister Mette Frederiksen.", "lt": 4, "lp": 0.83, "src": "DR · 2022-10-26", "s": "For", "sc": 0.08}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vores grundvand og vores rene drikkevand er truet. Derfor foreslår vi en fredning for et område på størrelse med cirka fire gange Falster, siger statsminister Mette Frederiksen (S) til Politiken.", "lt": 3, "lp": 0.48, "src": "TV 2 · 2022-10-28", "s": "For", "sc": 0.19}, {"p": "Mette Frederiksen", "pa": "S", "c": "Der er ingen tvivl om, at der er klimatosser Men statsministeren siger til avisen, at der primært vil være tale om områder, hvor der i dag er landbrug. Derfor vil der være noget drift, som skal udgå, men de pågældende landmænd vil blive kompenseret, siger Mette Frederiksen.", "lt": 0, "lp": 0.33, "src": "TV 2 · 2022-10-28", "s": "", "sc": NaN}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi har ikke på noget tidspunkt stillet nogen i udsigt, at alle offentligt ansatte skal have en lønforhøjelse, siger hun.", "lt": 5, "lp": 0.63, "src": "DR · 2022-10-29", "s": "Neutral", "sc": -0.04}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg synes, vi har været meget åbne og ærlige omkring, at vi ønsker at anerkende, at løn og arbejdsvilkår er en del af en helhedsløsning.", "lt": 1, "lp": 0.83, "src": "DR · 2022-10-29", "s": "Imod", "sc": -0.37}, {"p": "Mette Frederiksen", "pa": "S", "c": "Men vi har ikke på noget tidspunkt sagt, at det kommer til at gå til alle offentligt ansatte, for det er der simpelthen ikke råd til, siger Mette Frederiksen.", "lt": 5, "lp": 0.83, "src": "DR · 2022-10-29", "s": "Imod", "sc": -0.07}, {"p": "Mette Frederiksen", "pa": "S", "c": "Derfor er det jo godt, at vi to laver interviewet nu, for så får jeg mulighed for igen at sige, at vi forventer ikke, at alle offentligt ansatte kan se ind i en lønstigning.", "lt": 5, "lp": 0.86, "src": "DR · 2022-10-29", "s": "Imod", "sc": -0.13}, {"p": "Mette Frederiksen", "pa": "S", "c": "Nej, jeg vil snarere sige, at det, der er vores fokus, er der, hvor der er rekrutteringsudfordringer. Dem er der en del af, men på nogle områder større end andre, siger Mette Frederiksen.", "lt": 3, "lp": 0.79, "src": "DR · 2022-10-29", "s": "Imod", "sc": -0.22}, {"p": "Mette Frederiksen", "pa": "S", "c": "Magnus. Er det ikke korrekt forstået, at der er blevet ansat cirka 10.000 flere medarbejdere i sundhedsvæsenet?", "lt": 1, "lp": 0.68, "src": "DR · 2022-10-30", "s": "Neutral", "sc": 0.05}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det er selvfølgelig vores frihed, sagde statsminister Mette Frederiksen (S) i en partilederdebat 5. oktober få timer efter, at hun havde udskrevet valg.", "lt": 4, "lp": 0.72, "src": "TV 2 · 2022-10-30", "s": "Neutral", "sc": 0.02}, {"p": "Mette Frederiksen", "pa": "S", "c": "Vi skal bruge dem, vi har behov for. Det er den korte version. I Europa har vi nedrustet, mens andre har oprustet, siger hun.", "lt": 0, "lp": 0.83, "src": "TV 2 · 2022-10-30", "s": "Neutral", "sc": 0.01}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det er tydeligt, at der stadigvæk er nogle ret store udfordringer i vores sundhedsvæsen. Vi mener, at det i høj grad har at gøre med ventelisterne og dermed med løn og arbejdsvilkår.", "lt": 1, "lp": 0.47, "src": "DR · 2022-10-31", "s": "Imod", "sc": -0.1}, {"p": "Mette Frederiksen", "pa": "S", "c": "Men det at gøre endnu mere for at sikre, at patienterne ikke falder mellem stolene, og dermed får både kommuner, regioner og praktiserende læge til at arbejde tættere sammen, det er noget af det, som vi arbejder videre med, lød det fra Mette Frederiksen på vej ud af bygningen.", "lt": 2, "lp": 0.92, "src": "DR · 2022-10-31", "s": "For", "sc": 0.8}, {"p": "Mette Frederiksen", "pa": "S", "c": "Mette Frederiksen er udfordret af, at hun skal levere et dobbelt budskab. Hendes opgave er at styrke Socialdemokratiet og rød blok, fordi det vil give hende muligheden for at blive statsminister igen. Så hun skal vise, at der er forskel på rød og blå.", "lt": 5, "lp": 0.76, "src": "DR · 2022-10-31", "s": "Imod", "sc": -0.12}, {"p": "Mette Frederiksen", "pa": "S", "c": "Men samtidig argumenterer hun for, at en bred regering hen over midten er det allerbedste for Danmark.", "lt": 3, "lp": 0.79, "src": "DR · 2022-10-31", "s": "For", "sc": 0.99}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det sagde jeg på valgkampens første dag – at vi skal afsøge at lave en bred regering i Danmark. Og det står jeg ved, siger Mette Frederiksen.", "lt": 3, "lp": 0.83, "src": "TV 2 · 2022-10-31", "s": "For", "sc": 0.43}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg har simpelthen været for meget til hestemarked i min barndom til at høre på det her snak. Selv Lars Løkke (M), der har baseret hele sit parti på kampen for en bred regering, tror, at statsministeren kun siger det, fordi hun var nødt til det.", "lt": 3, "lp": 0.91, "src": "TV 2 · 2022-10-31", "s": "Imod", "sc": -0.94}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg er slet ikke i tvivl om, at er der et rødt flertal i morgen, så smutter statsministeren tilbage til sin plan A (en rød regering, red.). Men Mette Frederiksen fastslog endnu engang, at hun mener det helt alvorligt.", "lt": 4, "lp": 0.48, "src": "TV 2 · 2022-10-31", "s": "Neutral", "sc": -0.0}, {"p": "Mette Frederiksen", "pa": "S", "c": "Ligegyldigt hvordan mandaterne falder ud, så vil vi gå efter at danne en bred regering.", "lt": 3, "lp": 0.83, "src": "TV 2 · 2022-10-31", "s": "For", "sc": 0.95}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det sagde jeg på valgkampens første dag, og det står jeg ved.", "lt": 5, "lp": 0.72, "src": "TV 2 · 2022-10-31", "s": "Neutral", "sc": -0.05}, {"p": "Mette Frederiksen", "pa": "S", "c": "Derfor afstemmer jeg også nøje, hvad jeg siger, sagde Løkke og lod vide, at det stadig er helt åbent og op til de kommende forhandlinger, hvem han ender med at krone.", "lt": 5, "lp": 0.67, "src": "TV 2 · 2022-10-31", "s": "Neutral", "sc": -0.01}, {"p": "Mette Frederiksen", "pa": "S", "c": "Jeg håber, at jeg kan sætte mig til bordet sammen med Mette Frederiksen om få dage og tale om, hvordan vi kan samarbejde, siger han.", "lt": 3, "lp": 0.52, "src": "TV 2 · 2022-10-31", "s": "Neutral", "sc": -0.04}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det har jeg også sagt hele valgkampen, så det ville være mærkeligt, hvis jeg pludseligt synes, det var en god idé, siger han.", "lt": 1, "lp": 0.58, "src": "DR · 2022-11-01", "s": "Neutral", "sc": -0.01}, {"p": "Mette Frederiksen", "pa": "S", "c": "Det ser ud til at blive nogle svære og komplicerede forhandlinger, og hvordan skal man egentlig gribe dem an? Der er både politik og bogstavleg, siger han.", "lt": 3, "lp": 0.86, "src": "TV 2 · 2022-11-01", "s": "Imod", "sc": -0.12}, {"p": "Mogens Jensen", "pa": "S", "c": "Men man kunne lave mange løsninger. Vi risikerer, at der er nogle vælgere, vi ikke kommer i dialog med, siger folketingskandidaten, der får opbakning fra flere politiske konkurrenter, herunder socialdemokraten Mogens Jensen og de radikales Kathrine Olldag.", "lt": 2, "lp": 0.83, "src": "TV 2 · 2022-10-18", "s": "For", "sc": 0.19}, {"p": "Mogens Jensen", "pa": "S", "c": "Nogle vælger at komme i midtbyen, mens andre kommer i centret, konstaterer Kenneth Mikkelsen.", "lt": 4, "lp": 0.58, "src": "TV 2 · 2022-10-18", "s": "For", "sc": 0.06}, {"p": "Morten Bødskov", "pa": "S", "c": "Jeg tror, resultatet hænger sammen med, at danskerne ønsker et bredt samarbejde hen over midten, og de ser helt åbenlyst Socialdemokratiet som dem, der kan levere det, siger Morten Bødskov.", "lt": 3, "lp": 0.82, "src": "DR · 2022-10-06", "s": "For", "sc": 1.0}, {"p": "Morten Bødskov", "pa": "S", "c": "Det brede samarbejde er vigtigt, ikke mindst når vi ser på de store udfordringer, som Danmark står med nu. Der er Putin, der truer vores fred og sikkerhed i Europa, der er en energikrise, der er en inflationskrise, og der er en klimakrise.", "lt": 3, "lp": 0.65, "src": "DR · 2022-10-06", "s": "For", "sc": 0.07}, {"p": "Morten Bødskov", "pa": "S", "c": "Der er en helt række store beslutninger, vi skal træffe, som er vigtige for Danmark, og som skal løses i et bredt samarbejde hen over midten, siger Morten Bødskov.", "lt": 3, "lp": 0.71, "src": "DR · 2022-10-06", "s": "For", "sc": 1.0}, {"p": "Morten Bødskov", "pa": "S", "c": "Jeg synes, de skal genoverveje deres standpunkt. De udfordringer, som Danmark står overfor, er meget store. Tiden er ikke til blokpolitik. Tiden er til, at vi kan samarbejde bredt og finde hinanden over midten.", "lt": 3, "lp": 0.91, "src": "DR · 2022-10-06", "s": "Imod", "sc": -0.55}, {"p": "Morten Bødskov", "pa": "S", "c": "Det synes jeg målingen er et ganske godt udtryk for. Med over 27 procents opbakning til Mette Frederiksens lederskab, så er det et meget klart signal.", "lt": 2, "lp": 0.83, "src": "DR · 2022-10-06", "s": "For", "sc": 0.33}, {"p": "Morten Bødskov", "pa": "S", "c": "Det er klart, at Socialdemokratiet er det markant største parti. Vi har vist en vilje og en evne til at levere et bredt samarbejde i coronakrisen, i energikrisen, i klimakrisen og i den krise, som er i Europa nu.", "lt": 3, "lp": 0.55, "src": "DR · 2022-10-06", "s": "For", "sc": 0.99}, {"p": "Morten Bødskov", "pa": "S", "c": "Mette Frederiksen skal være statsminister i Danmark. Det er det, som Socialdemokratiet går til valg på. Og med den opbakning, der er, så er det klart, hun også skal lede en bredt favnende regering hen over midten, siger Morten Bødskov.", "lt": 3, "lp": 0.88, "src": "DR · 2022-10-06", "s": "For", "sc": 1.0}, {"p": "Morten Bødskov", "pa": "S", "c": "Vi konservative står stadig til et rigtig godt valgresultat og til at være et af de partier, der går allermest frem. Det er jeg selvfølgelig glad for, omend jeg selvfølgelig også godt kan se, at der er sivet lidt, siger Abildgaard.", "lt": 0, "lp": 0.53, "src": "DR · 2022-10-06", "s": "Neutral", "sc": 0.0}, {"p": "Morten Bødskov", "pa": "S", "c": "Jeg kan først og fremmest se, at det er tæt på dødt løb imellem blokkene, og det giver god kampgejst i forhold til de kommende uger, siger hun.", "lt": 4, "lp": 0.79, "src": "DR · 2022-10-06", "s": "Imod", "sc": -0.05}, {"p": "Morten Bødskov", "pa": "S", "c": "Så vi er der. Og vi har været der gennem længere tid. Hvad der skal ske med Bornholm og andre dele af det danske forsvar, er noget af det, vi kommer til at drøfte, når vi skal i gang med forligsforhandlingerne for alvor, siger Morten Bødskov.", "lt": 5, "lp": 0.79, "src": "DR · 2022-10-13", "s": "Neutral", "sc": -0.0}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Det handler om, at man selvfølgelig lytter til den kritik, der måtte være, men også holder fast. Hvis man som en anden vindbøjtel bare render rundt og siger, nå, nu må jeg til at mene noget helt andet, så kan det godt være, man får opbakning for en kort stund, men det er ikke særlig troværdigt, sagde Morten Messerschmidt.", "lt": 1, "lp": 0.56, "src": "DR · 2022-10-06", "s": "Neutral", "sc": 0.03}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Den hjælpepakke, som I så kalder det, er jo en hån imod danskerne, sagde han ved onsdagens partilederdebat, og satte trumf på:", "lt": 2, "lp": 0.72, "src": "DR · 2022-10-06", "s": "Imod", "sc": -0.47}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Hvad skal vi gøre i forhold til de folk, der ikke ved, hvordan de skal komme igennem oktober måned, november måned, julemåneden?", "lt": 0, "lp": 0.57, "src": "DR · 2022-10-06", "s": "Imod", "sc": -0.05}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Lad os da halvere fødevaremomsen. Lad os gøre nogen ting, så folk derude kan mærke, at pengene rækker. Lige nu, der roser I jer selv for noget, der først virker om tre måneder. Der kan være mange, der er gået fra hus og hjem til den tid.", "lt": 5, "lp": 0.9, "src": "DR · 2022-10-06", "s": "For", "sc": 0.62}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Ja, altså det ved alle, der arbejder med det her, og det ved Morten også. Desværre er det jo sådan, at vi har 25 procent moms på alt, som det eneste land i Europa. Så det kræver selvfølgelig en systemændring, og det tager lidt tid, siger finansordføreren.", "lt": 4, "lp": 0.88, "src": "DR · 2022-10-06", "s": "Neutral", "sc": -0.01}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Det her handler om at komme folk i møde, så det her ikke går fra at være en energikrise til en socialkrise. Folk ved ikke, hvordan de skal betale deres huslejer, sagde han i debatten.", "lt": 1, "lp": 0.63, "src": "DR · 2022-10-06", "s": "Neutral", "sc": -0.02}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Jeg ved ikke, om det var forkert. Det er jo en del af den pakke, som vi har. Det er ikke det ene initiativ, der kan hjælpe danskerne i morgen.", "lt": 4, "lp": 0.83, "src": "DR · 2022-10-06", "s": "For", "sc": 0.39}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Ja, det kan man godt gøre. Men det er jo faktisk et snuptag, når det er noget, der kan ske inden for 12 måneder, for krisen kommer nok til at vare længere. Derfor skal vi passe på, at vi ikke fyrer en masse penge af nu på den korte bane, som ikke rigtig hjælper.", "lt": 0, "lp": 0.92, "src": "DR · 2022-10-06", "s": "Neutral", "sc": -0.01}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Det skal være, så man kan komme igennem julen i hvert fald. Vi foreslår, at alle dem, der modtager ældrecheck, får en julecheck på 2.000 kroner, siger partiformand Morten Messerschmidt.", "lt": 3, "lp": 0.48, "src": "DR · 2022-10-07", "s": "For", "sc": 0.44}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Vi kan sagtens finansiere det her, statskassen har masser af penge i øjeblikket, tilføjer han.", "lt": 5, "lp": 0.86, "src": "DR · 2022-10-07", "s": "For", "sc": 0.08}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Så ved at give det bredt ud spilder man så at sige nogle penge på at hjælpe nogen, hvor det sådan set ikke gør nogen forskel på, om de kan komme igennem vinteren. De penge kunne man have kanaliseret bedre over til nogle grupper, der lider mere, forklarer han.", "lt": 4, "lp": 0.73, "src": "DR · 2022-10-07", "s": "Neutral", "sc": -0.03}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Jo mere målrettet, man kan gøre det, jo flere penge kan man give, samtidig med at man fører en ansvarlig økonomisk politik, hvor man ikke er med til at øge inflationen, siger professoren.", "lt": 5, "lp": 0.88, "src": "DR · 2022-10-07", "s": "For", "sc": 0.1}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Det er rart at kunne være bare et lille lys i det mørke, de måske synes, de befinder sig i.", "lt": 0, "lp": 0.17, "src": "DR · 2022-10-07", "s": "", "sc": NaN}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Kommunen og staten skal ikke vælge, hvem der kan komme ind i hjemmet. Der skal være tilbud i hver kommune, sagde han.", "lt": 2, "lp": 0.63, "src": "TV 2 · 2022-10-11", "s": "For", "sc": 0.51}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "I dag er udbuddet for private fødeklinikker relativt begrænsede. Her vi vil give et mere varieret udbud og forældrene det bedste forløb op til en fødsel i deres familie, sagde hun.", "lt": 5, "lp": 0.72, "src": "TV 2 · 2022-10-11", "s": "For", "sc": 0.08}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "De seks partiledere vil gerne sende et signal om, at man står samlet, og at man sagtens kan blive enige om noget i blå blok, selvom der er uenighed om for eksempel topskat og dele af udlændingeområdet.", "lt": 2, "lp": 0.49, "src": "TV 2 · 2022-10-11", "s": "For", "sc": 0.11}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Jeg synes, det er fint, det Ellemann siger. Man skal ikke stille krav til folks religion. Men man skal kunne stille krav til, hvem man lukker ind i sit hjem i forhold til fysiske og synlige forhold. Og tørklædet skal man selvfølgelig kunne sige nej til.", "lt": 3, "lp": 0.92, "src": "DR · 2022-10-12", "s": "Neutral", "sc": -0.02}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Som jeg hører Ellemann her, så mener han stadigvæk det, som han mente på pressemødet, siger Morten Messerschmidt.", "lt": 5, "lp": 0.79, "src": "DR · 2022-10-12", "s": "Imod", "sc": -0.09}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Jeg synes ikke, at det i sig selv er et kriterium, man kan stille op. Jeg synes, at det er vigtigt, at man tager udgangspunkt i borgeren og tager udgangspunkt i, om man får den service, man kan forvente.", "lt": 3, "lp": 0.57, "src": "DR · 2022-10-12", "s": "Imod", "sc": -0.14}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Hvis man ikke har noget problem med at lukke det muslimske tørklæde ind, så kan man jo bare sige ja. Men hvorfor vil man fratage de ældre, som bliver utrygge og synes, det er noget fremmedartet, retten til at sige fra og på den måde give dem en dårlig oplevelse i deres eget hjem, siger Morten Messerschmidt.", "lt": 5, "lp": 0.9, "src": "DR · 2022-10-12", "s": "Imod", "sc": -0.08}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Det er jo ikke nogen hemmelighed i, at Dansk Folkeparti altid har været et andet sted og altid vil være et andet sted i udlændinge- og værdipolitikken og for så vidt også i ældrepolitikken end de andre borgerlige partier.", "lt": 1, "lp": 0.62, "src": "DR · 2022-10-12", "s": "For", "sc": 0.12}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Det er underligt, at man ikke tager hensyn til den enkelte ældre, siger Morten Messerschmidt.", "lt": 4, "lp": 0.72, "src": "DR · 2022-10-12", "s": "Imod", "sc": -0.09}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Jeg mener, at borgerne skal have ret til at afvise en medarbejder med hvad end en begrundelse, de måtte have. Så jeg er enig i forslaget, lød det fra Vanopslagh.", "lt": 2, "lp": 0.48, "src": "DR · 2022-10-12", "s": "For", "sc": 0.32}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Jeg mener generelt, at man skal kunne fravælge en hjemmehjælper, man er utryg ved, men det bliver selvfølgelig nødt til at være ud fra saglige kriterier, og desto mere jeg tænker over det, desto mere bliver jeg overbevist om, at religiøse årsager ikke er en stærk nok begrundelse.", "lt": 4, "lp": 0.72, "src": "DR · 2022-10-12", "s": "Imod", "sc": -0.08}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Ja, jeg begynder at hælde til et nej, lyder det nu fra Vanopslagh.", "lt": 5, "lp": 0.45, "src": "DR · 2022-10-12", "s": "Imod", "sc": -0.07}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Helt generelt synes jeg, vi skal tage meget stort hensyn til de mennesker, der bor i eget hjem og skal bruge hjælp. Det er ikke bare et spørgsmål om tørklæder, men for eksempel også om man som enlig kvinde helst vil bades af en anden kvinde, siger Støjberg.", "lt": 5, "lp": 0.53, "src": "DR · 2022-10-12", "s": "Neutral", "sc": 0.02}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Jo, men nu er det jo ikke skrevet i grundloven, at alle kommuner og byer skal have et gymnasium. Vi har en meget fin og meget privilegeret adgang til uddannelse her i landet.", "lt": 1, "lp": 0.59, "src": "DR · 2022-10-13", "s": "Imod", "sc": -0.25}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Derfor har vi som politikere selvfølgelig også et ansvar for at sikre, at social kontrol og andet, som foregår på nogle af de her gymnasier, hvor der er en meget stor koncentration af elever med en mellemøstlig baggrund, bliver holdt nede, siger han.", "lt": 1, "lp": 0.83, "src": "DR · 2022-10-13", "s": "For", "sc": 0.48}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Den her skandale falder tilbage på regeringen. Man har afsat pengene, men intet aktivt gjort for, at de kommer ud til de borgere, som er dybt, dybt bekymret for, hvordan de kommer igennem de kommende måneder og allerede nu har skruet ned for radiatoren og sidder og fryser i deres stue, siger formand Morten Messerschmidt, som mener, det er bedre at hjælpe med en lavere moms på fødevarer.", "lt": 0, "lp": 0.81, "src": "DR · 2022-10-13", "s": "Neutral", "sc": -0.01}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "NEJ, nu da, råbte Sofie Carsten Nielsen.", "lt": 3, "lp": 0.58, "src": "TV 2 · 2022-10-30", "s": "Imod", "sc": -0.19}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Så kom dog hjem
