, Lars Video: Ida Marie Lomholt Wismann Som noget af det sidste i aftenens debat fik vi rundet et centralt tema: den brede regering.", "lt": 1, "lp": 0.5, "src": "TV 2 · 2022-10-30", "s": "Imod", "sc": -0.38}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Jeg kan ikke se den store forskel på Jakob Ellemann og Inger Støjberg på udlændingepolitikken, når jeg kigger på det her. Det er selvfølgelig ekstremt skuffende, siger Morten Messerschmidt.", "lt": 1, "lp": 0.54, "src": "DR · 2022-10-31", "s": "Neutral", "sc": -0.01}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Jeg synes, det er underligt, når man har kørt den profil og sagt til danskerne, at de jo nok ved, hvad man står for, og at man så i virkeligheden står for det, som Venstre også står for.", "lt": 2, "lp": 0.9, "src": "DR · 2022-10-31", "s": "Neutral", "sc": -0.01}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Venstre fører en stram og konsekvent udlændingepolitik, og det ved Inger også godt. Men der er nok gået lidt valgkamp i den, lyder det fra Søren Gade.", "lt": 1, "lp": 0.86, "src": "DR · 2022-10-31", "s": "For", "sc": 0.96}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Venstre vil tilbagerulle regeringens højere ydelser til arbejdsløse indvandrere, have fokus på danske værdier og sikre den nødvendige kontrol med asyltilstrømningen.", "lt": 1, "lp": 0.58, "src": "DR · 2022-10-31", "s": "For", "sc": 0.8}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Der er ingen tvivl om, at der er klimatosser Ældre er for Dansk Folkeparti, hvad børn er for SF.", "lt": 4, "lp": 0.79, "src": "TV 2 · 2022-11-01", "s": "Imod", "sc": -0.08}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "We’re still standing Formanden lover, at Dansk Folkeparti stadig har deres bedste dage foran sig på en aften, hvor de står til historisk lussing.", "lt": 5, "lp": 0.62, "src": "TV 2 · 2022-11-01", "s": "Neutral", "sc": -0.04}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Hvad morgendagen bringer, ved vi ikke endnu. Prognoserne er helt uklare. Vi ved slet ikke, hvad Lars Løkke vil. Men fundamentet bag vores parti er 27 år gammelt, siger han.", "lt": 4, "lp": 0.72, "src": "TV 2 · 2022-11-01", "s": "Neutral", "sc": -0.01}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Så kære venner, hav en fantastisk aften.", "lt": 1, "lp": 0.58, "src": "TV 2 · 2022-11-01", "s": "Neutral", "sc": -0.02}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Jeg tror, at det er samme svar, sagde Morten Messerschmidt.", "lt": 1, "lp": 0.72, "src": "TV 2 · 2022-11-01", "s": "Neutral", "sc": 0.01}, {"p": "Morten Messerschmidt", "pa": "DF", "c": "Alle kender Pia, men jeg kender alle hernede Partiets mor Dansk Folkeparti blev stiftet på Christiansborg 6. oktober 1995, efter at Pia Kjærsgaard og flere andre folketingsmedlemmer brød med Fremskridtspartiet.", "lt": 2, "lp": 0.45, "src": "TV 2 · 2022-11-01", "s": "Neutral", "sc": -0.02}, {"p": "Nicolai Wammen", "pa": "S", "c": "Vi skal have øget den private beskæftigelse markant, sagde Wammen.", "lt": 5, "lp": 0.79, "src": "DR · 2022-10-09", "s": "For", "sc": 0.05}, {"p": "Nicolai Wammen", "pa": "S", "c": "Det vil give god mening, at man dér starter med at tage et godt nøk op mod de 2.000 kroner. Men det er først i 2030, at det vil være fuld indfaset, sagde finansminister Nicolai Wammen (S) på pressemødet.", "lt": 0, "lp": 0.53, "src": "DR · 2022-10-26", "s": "Imod", "sc": -0.08}, {"p": "Nicolai Wammen", "pa": "S", "c": "Vi vil forhandle det her med arbejdsmarkedets parter i en trepart i 2024. Og der kan man forestille sig, at man tager et pænt løft der. Så er det fuldt indfaset i årene frem mod 2030. Så det er for tidligt nu at sige, præcis hvad det vil være i 2024. Det kommer an på, hvad man bliver enig om i den forhandling, der kommer.", "lt": 5, "lp": 0.63, "src": "DR · 2022-10-27", "s": "For", "sc": 0.14}, {"p": "Nicolai Wammen", "pa": "S", "c": "Det vil jo være, når vi eksempelvis siger, at 235.000 medarbejdere får glæde af det, så vil det fuldt indfaset svare til 2.000 kroner mere om måneden. At man så tager en pæn del af det, og så må man i de resterende år frem til 2030 nå helt i mål.", "lt": 0, "lp": 0.92, "src": "DR · 2022-10-27", "s": "For", "sc": 0.14}, {"p": "Nicolai Wammen", "pa": "S", "c": "Vi har stor respekt for, at vi vil sætte os i en trepartsforhandling i 2024 og lave en aftale med de forskellige parter. Det, vi har sagt i dag, er, at fuldt indfaset i 2030 skal der være en økonomi på tre milliarder kroner. Hvordan det skal fordeles, er op til en forhandling, og det har vi meget stor respekt for, siger Nicolai Wammen.", "lt": 5, "lp": 0.93, "src": "DR · 2022-10-27", "s": "For", "sc": 0.27}, {"p": "Nicolai Wammen", "pa": "S", "c": "Det er helt sædvanlig praksis, at man siger, at der selvfølgelig kan være usikkerheder om det helt præcise beløb, siger Nicolai Wammen.", "lt": 3, "lp": 0.79, "src": "DR · 2022-10-28", "s": "Imod", "sc": -0.08}, {"p": "Nicolai Wammen", "pa": "S", "c": "Jeg mener ikke, der er behov for en plan B, fastslår ministeren.", "lt": 4, "lp": 0.43, "src": "DR · 2022-10-28", "s": "Imod", "sc": -0.06}, {"p": "Nicolai Wammen", "pa": "S", "c": "Vi vil selvfølgelig følge det her tæt, men jeg er rolig og tryg ved de forudsætninger, vi har lagt ind fra Finansministeriet.", "lt": 4, "lp": 0.54, "src": "DR · 2022-10-28", "s": "Neutral", "sc": 0.0}, {"p": "Nicolai Wammen", "pa": "S", "c": "Og er der behov for justeringer undervejs, så gør vi det, lover Nicolai Wammen.", "lt": 5, "lp": 0.54, "src": "DR · 2022-10-28", "s": "For", "sc": 0.09}, {"p": "Peder Hvelplund", "pa": "EL", "c": "De skattelettelser, der er lagt op til i socialdemokraternes udspil, som tilgodeser direktøren, men som ikke tilgodeser pensionisten, den studerende eller den enlige mor på kontanthjælp, dem vil vi ikke acceptere, siger Enhedslistens gruppeformand, Peder Hvelplund.", "lt": 2, "lp": 0.64, "src": "DR · 2022-10-15", "s": "Imod", "sc": -0.12}, {"p": "Peder Hvelplund", "pa": "EL", "c": "Nej, vi kommer til at stille betingelser for at kunne pege på en regering, der betinger sig vores støtte, fastslår Peder Hvelplund.", "lt": 3, "lp": 0.91, "src": "DR · 2022-10-15", "s": "Neutral", "sc": -0.04}, {"p": "Peder Hvelplund", "pa": "EL", "c": "Sådan spiller klaveret jo ikke, siger Peder Hvelplund.", "lt": 3, "lp": 0.79, "src": "DR · 2022-10-15", "s": "Imod", "sc": -0.13}, {"p": "Peder Hvelplund", "pa": "EL", "c": "Det er klart, hvis Enhedslisten skal støtte en ny regering, så kommer det også med betingelser, og det bliver blandt andet i forhold til, at man ikke kan føre en økonomisk politik, der er usolidarisk og asocial, siger Peder Hvelplund.", "lt": 3, "lp": 0.67, "src": "DR · 2022-10-15", "s": "Imod", "sc": -0.68}, {"p": "Peder Hvelplund", "pa": "EL", "c": "Vi har jo ikke en principiel modstand mod skattelettelser, hvis det blot er skattelettelser i bunden, altså i form af personfradrag, som tilgodeser samtlige indtægtsgrupper, også de allermest udsatte, fastslår Peder Hvelplund.", "lt": 4, "lp": 0.91, "src": "DR · 2022-10-15", "s": "Neutral", "sc": -0.0}, {"p": "Peder Hvelplund", "pa": "EL", "c": "Jeg synes også, at der skal være et krav om større enheder i regionerne, men så skal pengene også følge med. Vi kan ikke straffe regionerne for noget, de ikke får penge til. Vi er nødt til at investere i sundhedsvæsenet, siger Peder Hvelplund.", "lt": 2, "lp": 0.92, "src": "DR · 2022-10-29", "s": "For", "sc": 0.49}, {"p": "Peder Hvelplund", "pa": "EL", "c": "Demensudredning er et af de områder, hvor man meget tydeligt mærker de begrænsninger, det giver, når vi mangler de nødvendige medarbejdere, lyder det i et skriftligt svar fra Danske Regioner.", "lt": 1, "lp": 0.5, "src": "DR · 2022-10-29", "s": "Imod", "sc": -0.39}, {"p": "Peder Hvelplund", "pa": "EL", "c": "De pynter sig med lånte fjer, siger sundhedsordfører Peder Hvelplund, der kritiserer Socialdemokratiet for at tegne et decideret urealistisk billede af virkeligheden.", "lt": 2, "lp": 0.83, "src": "DR · 2022-10-30", "s": "Imod", "sc": -0.28}, {"p": "Pelle Dragsted", "pa": "EL", "c": "Problemet med det her forslag er, at det med kirurgisk præcision undlader at hjælpe de grupper, der har allermest brug for det, nemlig vores folkepensionister, førtidspensionister og mennesker, der er ramt af sygdom og arbejdsløshed, siger Pelle Dragsted, der er kandidat til Folketinget for Enhedslisten.", "lt": 2, "lp": 0.49, "src": "DR · 2022-10-09", "s": "Imod", "sc": -0.2}, {"p": "Pelle Dragsted", "pa": "EL", "c": "De får nul kroner, mens for eksempel direktøren, konsulenten og advokaten kan se frem til en skattelettelse, og det synes vi er fuldstændigt skævt, siger han.", "lt": 0, "lp": 0.83, "src": "DR · 2022-10-09", "s": "Imod", "sc": -0.1}, {"p": "Pelle Dragsted", "pa": "EL", "c": "Jeg er da glad for, at Socialdemokratiet nu indrømmer, at den politik, de har ført de sidste tre år, har været forkert. De har sat skatter og afgifter op med over 10 milliarder kroner, og nu vil de så gå en anden vej. Det er da godt, at de er kommet i tanke om det, siger han.", "lt": 1, "lp": 0.35, "src": "DR · 2022-10-09", "s": "", "sc": NaN}, {"p": "Pelle Dragsted", "pa": "EL", "c": "Det ved jeg ikke, det må vælgerne jo vurdere. Jeg bedømmer regeringen på, hvad de har sagt og gjort her på Christiansborg, og jeg har deltaget i uendeligt mange forhandlinger med regeringen, hvor det at sætte skatten ned for de laveste indkomster ikke har været noget, de har støttet. Det vil de så nu, og det kommer vi selvfølgelig til at holde dem fast på efter et valg.", "lt": 3, "lp": 0.64, "src": "DR · 2022-10-09", "s": "Imod", "sc": -0.64}, {"p": "Pelle Dragsted", "pa": "EL", "c": "Regeringen indrømmer jo, at den skræmmekampagne, de har kørt mod skattelettelser de seneste mange år, nu ophører. Og det synes jeg da, man skal kvittere for.", "lt": 4, "lp": 0.63, "src": "DR · 2022-10-09", "s": "Neutral", "sc": 0.03}, {"p": "Pelle Dragsted", "pa": "EL", "c": "Vælgerne har krav på at vide, hvilke økonomiske interesser der finansierer de enkelte partiers valgkampe og med hvor meget. De øvrige partier bør følge Enhedslistens eksempel og fortælle, hvem der støtter deres valgkamp, siger Enhedslistens spidskandidat i København, Pelle Dragsted, i en mail til TV 2.", "lt": 2, "lp": 0.82, "src": "TV 2 · 2022-10-27", "s": "For", "sc": 0.21}, {"p": "Pelle Dragsted", "pa": "EL", "c": "Det er selvfølgelig både kritisabelt og uacceptabelt, har Martin Lidegaard selv sagt om metoden.", "lt": 3, "lp": 0.58, "src": "TV 2 · 2022-10-27", "s": "Imod", "sc": -0.31}, {"p": "Per Larsen", "pa": "KF", "c": "Det er jo sådan, spillets regler er. Vi har en rigtig god liste med gode kandidater, og vi kæmper selvfølgelig om de mandater, der nu er. Det gør vi lige frem til den 1. november, siger Per Larsen.", "lt": 1, "lp": 0.72, "src": "DR · 2022-10-29", "s": "For", "sc": 0.15}, {"p": "Per Larsen", "pa": "KF", "c": "Det har stor konsekvenser for både den enkelte og for familien, siger Per Larsen.", "lt": 0, "lp": 0.86, "src": "DR · 2022-10-29", "s": "Neutral", "sc": 0.0}, {"p": "Per Larsen", "pa": "KF", "c": "På den måde kan man bedre udnytte kapaciteten, og flere kan blive udredt hurtigere, selv om det kan give lidt længere transporttid, siger Per Larsen.", "lt": 1, "lp": 0.72, "src": "DR · 2022-10-29", "s": "Imod", "sc": -0.08}, {"p": "Per Larsen", "pa": "KF", "c": "Det er klart, at vi lige skal have de sidste stemmer med, og der er stadig mulighed for at påvirke folk, siger Per Larsen.", "lt": 1, "lp": 0.46, "src": "DR · 2022-10-29", "s": "Imod", "sc": -0.11}, {"p": "Per Larsen", "pa": "KF", "c": "Det er klart, at det havde været skønnere, hvis vi stod til at få flere mandater valgt til Folketinget. Men situationen er, som den er, og så kæmper vi for de stemmer, der er. Det er jo en kamp mellem kandidaterne. Det er de personlige stemmer, der tæller, siger Per Larsen.", "lt": 2, "lp": 0.94, "src": "DR · 2022-10-29", "s": "For", "sc": 0.15}, {"p": "Pernille Vermund", "pa": "LA", "c": "Der er overhovedet ikke noget nyt i det. Reglerne er allerede sådan, at det er borgernes frie valg, om man dels vil have hjemmehjælp, og hvem man vil have til at levere den hjemmehjælp. Så der er ikke noget nyt i det. Det er også derfor, det er sådan en mærkelig diskussion.", "lt": 1, "lp": 0.54, "src": "DR · 2022-10-12", "s": "Neutral", "sc": -0.03}, {"p": "Pernille Vermund", "pa": "LA", "c": "Det er jo heller ikke noget, vi foreslår. Det er noget, der kommer op på baggrund af et spørgsmål fra en journalist, siger Pernille Vermund.", "lt": 0, "lp": 0.58, "src": "DR · 2022-10-12", "s": "Imod", "sc": -0.14}, {"p": "Pernille Vermund", "pa": "LA", "c": "Jeg ser ikke nogen forskel på Støjberg og Venstre. Det ærgrer mig. Inger har selvfølgelig fra begyndelsen sagt, at hun er Venstre-kvinde helt inde i hjertet. Så på den måde burde det jo ikke komme bag på mig, siger Pernille Vermund.", "lt": 4, "lp": 0.79, "src": "DR · 2022-10-31", "s": "Neutral", "sc": -0.0}, {"p": "Pernille Vermund", "pa": "LA", "c": "Jeg må sige, at jeg er skuffet. Men omvendt, så er det måske også en væsentlig årsag til, at Inger Støjberg har stiftet sit eget parti og ikke meldt sig ind i Nye Borgerlige eksempelvis, siger Vermund.", "lt": 3, "lp": 0.57, "src": "DR · 2022-10-31", "s": "Imod", "sc": -0.16}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Vi synes, det er et godt bidrag i en tid, hvor folk har svært ved at få tingene til at hænge sammen og en vigtig håndsrækning for fremtiden, hvor folk, der arbejder hårdt, skal kunne beholde flere af pengene selv, siger beskæftigelsesminister Peter Hummelgaard (S).", "lt": 2, "lp": 0.91, "src": "DR · 2022-10-09", "s": "For", "sc": 0.54}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Vismændene sagde i går, at mange kan risikere at miste deres arbejde på grund af den inflations og energikrise, vi har i hele Europa. Venstre kvitterer det med at sige, de vil skære i arbejdsløses sikkerhedsnet ved at forringe dagpengene fremadrettet, siger han.", "lt": 4, "lp": 0.91, "src": "DR · 2022-10-12", "s": "Imod", "sc": -0.18}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Mange af de forbedringer, som vi har fået gennemført, vil man rulle tilbage. Det stærkere sikkerhedsnet vil man begrænse, siger han.", "lt": 0, "lp": 0.58, "src": "DR · 2022-10-12", "s": "Neutral", "sc": -0.01}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Vi har gjort det, fordi vi under coronakrisen lærte, at et stærkt sikkerhedsnet er en rigtig god forudsætning for, at folk i de første måneder har mulighed for at få ro på og kan betale deres regninger, inden de søger uddannelse eller kommer i arbejde.", "lt": 0, "lp": 0.43, "src": "DR · 2022-10-12", "s": "For", "sc": 0.12}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Hvis der er problemer med lovgivningen, så skal det ændres, og det skal gå stærkt, siger han.", "lt": 2, "lp": 0.72, "src": "DR · 2022-10-13", "s": "For", "sc": 0.44}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Der er altså mennesker i vores samfund, som har svært ved at finde penge til de uforudsete udgifter, som de her helt uforskyldt har fået. Dem vil regeringen hjælpe.", "lt": 4, "lp": 0.75, "src": "DR · 2022-10-13", "s": "For", "sc": 0.43}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Det er hul i hovedet. Os på kontanthjælp bliver efterladt til at passe os selv, selvom vi er nogle af dem, der er hårdest ramt, siger hun.", "lt": 2, "lp": 0.72, "src": "DR · 2022-10-13", "s": "Neutral", "sc": 0.01}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Det er meget snævre regler. Det betyder, at de 200 millioner, som regeringen har afsat, kommer til at samle støv i statskassen med mindre, at man ændrer reglerne. Det er tudetosset. Der er borgere, som desperat har brug for hjælp, siger hun.", "lt": 0, "lp": 0.8, "src": "DR · 2022-10-13", "s": "Imod", "sc": -0.15}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Det er for sløvt, at flere kommuner ikke har benyttet sig af den mulighed her. Jeg har som beskæftigelsesminister adskillige gange skrevet til Kommunernes Landsforening og gjort dem opmærksom på de 100 millioner kroner, som skal hjælpe borgere, der mangler hjælp. Man skal sørge for, at de penge kommer ud at arbejde, siger han.", "lt": 5, "lp": 0.62, "src": "DR · 2022-10-13", "s": "For", "sc": 0.15}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Det er vores indtryk, at der bliver arbejdet med sagen i kommunerne, men også, at mange af de borgere, der søger, får afslag, fordi de ikke lever op til de meget strikse kriterier. For eksempel er der et kriterie om, at man ikke må have en formue på over 10.000 kr. Det er svært for de fleste at leve op til.", "lt": 2, "lp": 0.6, "src": "DR · 2022-10-13", "s": "Neutral", "sc": 0.04}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Hvis der er problemer med lovgivningen, så skal det ændres, og det skal gå stærkt. Vi kigger gerne på kriterierne for at tildele støtte, fortæller han.", "lt": 2, "lp": 0.86, "src": "DR · 2022-10-13", "s": "For", "sc": 0.62}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Hvis der er problemer med lovgivningen, så skal det ændres, og det skal gå stærkt, fortæller han.", "lt": 2, "lp": 0.72, "src": "DR · 2022-10-13", "s": "For", "sc": 0.43}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Det gør mig rigtig, rigtig vred. Jeg synes, det er et meget stort svigt af de borgere, som er derude, og som virkelig har brug for hjælp. Jeg mener, at kommunerne tolker de her regler alt, alt for stramt, siger Peter Hummelgaard.", "lt": 2, "lp": 0.92, "src": "DR · 2022-10-14", "s": "Imod", "sc": -0.16}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Det kan vi ikke som kommune. Det er vores regering, der definerer regelsættet, og det er vi selvfølgelig forpligtet til som kommune at følge, siger hun.", "lt": 2, "lp": 0.63, "src": "DR · 2022-10-14", "s": "Imod", "sc": -0.08}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Styrelsen (Styrelsen for Arbejdsmarked og Rekruttering, red.) kan ikke genkende det billede, og jeg ved, at styrelsen kommer til at sende et brev til Københavns Kommune, hvor de gør opmærksom på, at man anlægger en for stram fortolkning af reglerne, siger Peter Hummelgaard.", "lt": 2, "lp": 0.66, "src": "DR · 2022-10-14", "s": "Imod", "sc": -0.12}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Der er ikke nogen, der har bedt kommunerne om at overtolke reglerne for stramt. Og jeg har faktisk ad flere omgange skrevet til Kommunernes Landsforenings formand, Martin Damm (V), og bedt ham gøre mere for, at kommunerne bruger den her pulje, siger Peter Hummelgaard.", "lt": 2, "lp": 0.92, "src": "DR · 2022-10-14", "s": "Neutral", "sc": 0.0}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Kommunernes Landsforening meddeler, at vi på grund af den igangværende valgkamp ikke kommenterer på udmeldinger fra enkeltpartier og de enkelte folketingskandidater.", "lt": 4, "lp": 0.79, "src": "DR · 2022-10-14", "s": "Neutral", "sc": -0.0}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Man får lyst til at trykke på en knap og rulle metoderne ud til hele landet. Hele ideen om at investere i en forstærket indsats og hjælpe borgere tilbage på arbejde, er jo bare indlysende rigtig, sagde socialdemokraten.", "lt": 2, "lp": 0.52, "src": "DR · 2022-10-15", "s": "For", "sc": 0.33}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Men så handler det selvfølgelig også om, at lønnen og arbejdsvilkårene er gode nok til, at vi både kan rekruttere og fastholde dem, vi har brug for, siger Peter Hummelgaard.", "lt": 2, "lp": 0.68, "src": "DR · 2022-10-17", "s": "For", "sc": 0.61}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Jeg synes, at svaret fra Finansministeriet viser, at det er håndterbart, og at der er veje at gå. Det, der er vigtigt for os, er, at det skal ske inden for rammerne af den danske model, siger Peter Hummelgaard med henvisning til, at det er arbejdsmarkedets parter - og ikke politikerne - der aftaler løn- og arbejdsvilkår.", "lt": 2, "lp": 0.95, "src": "DR · 2022-10-17", "s": "For", "sc": 0.16}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Der er ikke noget usædvanligt i, at man fra det offentliges side beder om, at penge, der bliver udbetalt til kommunerne, skal være revideret, så man er sikker på, at pengene går det rigtige sted hen, siger Peter Hummelgaard.", "lt": 2, "lp": 0.6, "src": "DR · 2022-10-25", "s": "For", "sc": 0.13}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Perspektivet kan jeg godt se, men når det er så små beløb som det her virker det temmelig absurd, at en tredjedel går til borgerne og to tredjedele går til revisorerklæringer, siger han.", "lt": 0, "lp": 0.79, "src": "DR · 2022-10-25", "s": "Imod", "sc": -0.19}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Jeg mener, man kunne have gjort mange andre ting, som kunne have gjort mere, hvis man ville. Men det andet lyder flot. Men det hjælper jo ikke. Jeg har ikke mærket noget til det, siger hun.", "lt": 4, "lp": 0.79, "src": "DR · 2022-10-25", "s": "Imod", "sc": -0.31}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Jeg tror ikke, at der er nogen, der har haft endagsture og indkøbsture i tankerne, da man lavede de regler. Derfor er vi naturligvis også åbne for at kigge på, om loven skal laves om, siger beskæftigelsesminister Peter Hummelgaard (S).", "lt": 1, "lp": 0.92, "src": "DR · 2022-10-25", "s": "Neutral", "sc": -0.02}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Reglerne er lavet til en situation, hvor en person på kontanthjælp for eksempel rejser hjem og besøger sin familie i Libyen i flere uger, siger Peter Hummelgaard.", "lt": 5, "lp": 0.52, "src": "DR · 2022-10-25", "s": "For", "sc": 0.22}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Ja, og derfor kunne det jo have været oplagt, at man i det her tilfælde havde informeret kommunen. Men vi kan jo også overveje, om der er nødt til at være en bagatelgrænse.", "lt": 2, "lp": 0.72, "src": "DR · 2022-10-25", "s": "For", "sc": 0.3}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Det har vi simpelthen ikke taget stilling til. Det her er første gang, at jeg har hørt et eksempel på, at der er nogen, der er blevet sanktioneret for at tage over grænsen.", "lt": 5, "lp": 0.5, "src": "DR · 2022-10-25", "s": "Imod", "sc": -0.11}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Det er helt urimeligt, at kontanthjælpsmodtagere ikke lige må tage et smut over grænsen. Jeg har ikke været opmærksom på det – det tror jeg faktisk ikke, at der er nogen, der har.", "lt": 5, "lp": 0.43, "src": "DR · 2022-10-25", "s": "Imod", "sc": -0.19}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Det er pilskævt, og jeg synes helt ærligt, at det skriger til himlen.", "lt": 0, "lp": 0.17, "src": "DR · 2022-10-26", "s": "", "sc": NaN}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Der er ikke noget, hverken tidligere eller nu, der giver mig indtryk af, at loven ikke skulle være god nok, siger han.", "lt": 1, "lp": 0.72, "src": "DR · 2022-10-29", "s": "Neutral", "sc": -0.0}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Puljen kan benyttes af de danskere, som rammes af de stigende priser, og det går jeg ud fra, at øvrige myndigheder også noterer sig, siger ministeren.", "lt": 1, "lp": 0.46, "src": "DR · 2022-10-29", "s": "For", "sc": 0.24}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Helt grundlæggende er der kommuner, der har kunnet finde ud af at anvende puljen. Kommunerne har ikke på noget tidspunkt gjort mig som minister opmærksom på, at der var problemer med hverken lovgrundlag eller tildelingskriterier eller noget som helst andet, siger han.", "lt": 2, "lp": 0.63, "src": "DR · 2022-10-29", "s": "For", "sc": 0.08}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Kommunerne har administreret efter de regler, ministeren med Folketingets opbakning har fastlagt, og kommunernes praksis er indtil videre blevet bekræftet af Ankestyrelsen. Hvis et flertal i Folketinget efter folketingsvalget ønsker at ændre reglerne, indgår KL meget gerne i dialog, og kommunerne vil naturligvis i så fald indrette praksis derefter, skriver KL.", "lt": 2, "lp": 0.95, "src": "DR · 2022-10-29", "s": "For", "sc": 0.48}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Enhedslisten må ikke diktere den økonomiske politik Til Politiken siger beskæftigelsesminister Peter Hummelgaard (S), at han er enig i retningen af kravet fra de radikale. Men han afviser pure, at man skal pille ved efterlønnen. Forelagt at Radikale Venstres betingelse med det samme er blevet afvist af Enhedslisten og SF, svarer Andreas Steenberg:", "lt": 2, "lp": 0.94, "src": "TV 2 · 2022-10-29", "s": "Imod", "sc": -0.08}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Vi har haft en regeringsperiode på lidt over tre år, hvor vi har været igennem mange svære kriser, hvor Danmark er kommet styrket igennem. Det er lykkedes at gøre tingene på en ansvarlig måde, siger Peter Hummelgaard.", "lt": 1, "lp": 0.91, "src": "DR · 2022-11-01", "s": "For", "sc": 0.05}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Jeg forventer, at der vil være en opbakning til Mette Frederiksen som statsminister, siger han.", "lt": 3, "lp": 0.79, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.25}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Det ser ud til, at det er lidt broget i øjeblikket. Nu skal vi lige vente på det endelige resultat.", "lt": 3, "lp": 0.58, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.25}, {"p": "Peter Hummelgaard", "pa": "S", "c": "Lad os nu lige se det endelige resultat. Jeg synes, vi har leveret vores til den blå familie, siger Støjberg.", "lt": 0, "lp": 0.83, "src": "DR · 2022-11-01", "s": "Neutral", "sc": 0.02}, {"p": "Peter Juel-Jensen", "pa": "V", "c": "Jeg tror, det vil være det helt rigtige signal at sende, at vi genopretter Bornholms Værn. Både af hensyn til en bedre rekruttering, men også fordi det er et stærkt politisk signal, siger Peter Juel-Jensen (V).", "lt": 2, "lp": 0.88, "src": "DR · 2022-10-13", "s": "For", "sc": 0.8}, {"p": "Peter Kofod", "pa": "DF", "c": "Jeg er nødt til at tro på, at det er en fejl, at man har indrettet reglerne på denne her måde, siger Peter Kofod.", "lt": 2, "lp": 0.54, "src": "DR · 2022-10-25", "s": "Imod", "sc": -0.09}, {"p": "Peter Kofod", "pa": "DF", "c": "Jeg tror, at vi skal passe meget på med alt det bureaukrati. Jeg vil ikke stå og sige, præcis hvordan det skal skrues sammen, for det kan jo være, at der er nogen, der har en rigtig god løsning til, hvordan man gør det, siger Peter Kofod.", "lt": 2, "lp": 0.88, "src": "DR · 2022-10-25", "s": "For", "sc": 0.09}, {"p": "Peter Skaarup", "pa": "DD", "c": "At stå til otte procent som et helt nystartet parti, synes jeg, er rigtig flot, siger han.", "lt": 2, "lp": 0.72, "src": "DR · 2022-10-16", "s": "For", "sc": 0.09}, {"p": "Peter Skaarup", "pa": "DD", "c": "Jeg synes, der er en utrolig positiv stemning, når vi kommer ud, og vi er lige startet.", "lt": 3, "lp": 0.72, "src": "DR · 2022-10-16", "s": "For", "sc": 0.29}, {"p": "Peter Skaarup", "pa": "DD", "c": "Men vi har ikke et kæmpe kampagneapparat som Socialdemokratiet, Venstre og Konservative, som jo får store beløb til en valgkampagne. Vi gør det bedst muligt, siger han.", "lt": 3, "lp": 0.48, "src": "DR · 2022-10-16", "s": "For", "sc": 0.08}, {"p": "Peter Skaarup", "pa": "DD", "c": "Nej, jeg mærker faktisk en utrolig flot og god stemning, når jeg kommer rundt, og det samme gør Inger Støjberg. Så vi er taknemmelige for hver evig eneste dansker, der vil give os sit kryds, siger Skaarup.", "lt": 3, "lp": 0.83, "src": "DR · 2022-10-16", "s": "Neutral", "sc": 0.0}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Vi ser gerne, at det nuværende flertal - fra Enhedslisten til Det Radikale Venstre - fortsætter. Det har været det grønneste flertal Danmark nogensinde har haft, siger SFs formand Pia Olsen Dyhr.", "lt": 2, "lp": 0.92, "src": "DR · 2022-10-05", "s": "For", "sc": 0.11}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Vi har gennemført en ambitiøs klimalov og skaffet minimumsnormeringer i vores daginstitutioner. Og det er jo det, som jeg er bange for bliver smidt væk, hvis vi får en regering hen over midten, for eksempel med De Konservative, som jo ønsker at afskaffe minimumsnormeringer og skære i den offentlige sektor, siger Pia Olsen Dyhr inden hun tilføjer, at den bekymring ikke ændrer på, at SF peger på Mette Frederiksen som statsminister.", "lt": 0, "lp": 0.54, "src": "DR · 2022-10-05", "s": "Imod", "sc": -0.07}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Jeg er klar til at komme ud og diskutere med danskerne. Det er noget, vi har gået og ventet på et stykke tid og vidst, at det Radikale ultimatum har ligget der i lang tid. Jeg glæder mig til at komme ud at diskutere de politiske mærkesager, der er vigtige for os.", "lt": 2, "lp": 0.91, "src": "DR · 2022-10-05", "s": "For", "sc": 0.05}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Vi vil tale om klima, tale om børn og unges trivsel og tale om den ulighed, vi har i Danmark, og som vi ønsker at mindske.", "lt": 0, "lp": 0.6, "src": "DR · 2022-10-05", "s": "For", "sc": 0.31}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Vi ser gerne, at det flertal, der har været, kan fortsætte - fra Enhedslisten til Radikale Venstre - og jeg har også foreslået, at vi kunne danne en regering over den bredde, siger Pia Olsen Dyhr.", "lt": 2, "lp": 0.47, "src": "DR · 2022-10-05", "s": "For", "sc": 0.24}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Vi har lavet en CO₂-afgift, som gælder alt andet i det danske samfund end landbruget. Det skulle vi have lavet her i efteråret, nu skal vi så til valg, siger Pia Olsen Dyhr og tilføjer:", "lt": 5, "lp": 0.86, "src": "TV 2 · 2022-10-07", "s": "For", "sc": 0.05}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Det synes jeg er lidt ærgerligt, for jeg vil gerne have brugt tiden på at lave en CO₂-afgift for landbruget.", "lt": 0, "lp": 0.86, "src": "TV 2 · 2022-10-07", "s": "For", "sc": 0.16}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Jeg tror, det landbrug, der flytter sig først – og dansk landbrug er dygtigt – kan inspirere resten af verden, siger hun.", "lt": 0, "lp": 0.83, "src": "TV 2 · 2022-10-07", "s": "For", "sc": 0.15}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Den er ikke større, end hvad vi stiller af krav til den øvrige del af industrien.", "lt": 3, "lp": 0.79, "src": "TV 2 · 2022-10-07", "s": "Imod", "sc": -0.16}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Nej, jeg tror, at hvis du går ud og spørger gartnerierne, så synes de faktisk, det her er rigtig svært.", "lt": 3, "lp": 0.79, "src": "TV 2 · 2022-10-07", "s": "Neutral", "sc": -0.01}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Man kan bare vælge at have nogle andre støttepartier bag den regering, siger hun og understreger, at SF ikke vil stille mistillidsvotum af den grund.", "lt": 3, "lp": 0.54, "src": "TV 2 · 2022-10-07", "s": "Imod", "sc": -0.8}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Jeg kunne godt tænke mig at spørge Fru Pia Olsen Dyhr: Hvordan ved en baby, at den er født i den forkerte krop?, lød det fra Skaarup.", "lt": 4, "lp": 0.79, "src": "DR · 2022-10-08", "s": "For", "sc": 0.2}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Jeg synes, det er en dårlig ide med skattelettelser i en tid, hvor vores velfærdssamfund mangler penge. I virkeligheden skal vi investere i vores sundhedsvæsen og i børn og unges mistrivsel, så vi får et mere sammenhængende samfund, siger Pia Olsen Dyhr, formand for SF.", "lt": 4, "lp": 0.45, "src": "DR · 2022-10-09", "s": "Imod", "sc": -0.4}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Fordi den er ubalanceret. Når man fokuserer bredt som i planen her, så hjælper man en lillesmule alle steder. Jeg vil meget hellere lave en målrettet hjælp til nogen af dem, der virkelig er i risikozonen fra at gå fra hus og hjem, siger hun.", "lt": 5, "lp": 0.45, "src": "DR · 2022-10-09", "s": "Neutral", "sc": -0.02}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Det her ligger helt øverst på SF’s dagsorden, siger Pia Olsen Dyhr til DR og uddyber:", "lt": 2, "lp": 0.58, "src": "DR · 2022-10-10", "s": "For", "sc": 0.22}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Vi vil gerne ned på 24 elever i klassen og fjerne de nationale test, vi har i folkeskolen. Vi har fået antallet af test ned, men de skal helt væk. Karakterer er også noget, vi skal lægge til side, så de unge får mulighed for at bruge tiden på at lære at danne sig.", "lt": 3, "lp": 0.61, "src": "DR · 2022-10-10", "s": "Imod", "sc": -0.12}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Det her er et samfundsproblem. Vi må aldrig gøre det til den enkeltes ansvar at løse, for så tager vi ikke problemet alvorligt, siger Pia Olsen Dyhr.", "lt": 1, "lp": 0.79, "src": "DR · 2022-10-10", "s": "Neutral", "sc": -0.03}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Hvis man ser på universitetsområdet, har de faglige krav aldrig været så få, som de er i dag. Pensum er kortere end nogensinde, og det faglige niveau er ikke højere end tidligere, siger han.", "lt": 1, "lp": 0.54, "src": "DR · 2022-10-10", "s": "Neutral", "sc": 0.03}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Særligt som civilsamfund har vi et enormt ansvar for at styrke de små fællesskaber, som kan være med til at modarbejde mistrivslen. Men at tro, at staten eller politikerne kan løse mistrivslen, synes jeg er naivt.", "lt": 1, "lp": 0.86, "src": "DR · 2022-10-10", "s": "Imod", "sc": -0.19}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Det er helt absurd. Og særligt absurd, fordi der er danske familier, som fryser. Det er en skandale, for vi skal have de her penge ud at virke, siger Pia Olsen Dyhr, formand for SF.", "lt": 5, "lp": 0.86, "src": "DR · 2022-10-13", "s": "Imod", "sc": -0.36}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Der er for meget bureaukrati ind over. Aftalen er god nok, men kriterierne er forkerte, siger hun.", "lt": 4, "lp": 0.58, "src": "DR · 2022-10-13", "s": "Imod", "sc": -0.29}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "SF får svært ved at støtte en regering, der ikke vil se på ligeløn i den offentlige sektor, siger SF-formand Pia Olsen Dyhr.", "lt": 3, "lp": 0.6, "src": "DR · 2022-10-17", "s": "Imod", "sc": -0.99}, {"p": "Pia Olsen Dyhr", "pa": "SF", "c": "Svaret fra Finansministeriet viser mig både, at det er muligt at løfte grupper med rekrutteringsudfordringer, men også at sc": -0.05}, {"p": "Rasmus Jarlov", "pa": "KF", "c": "Jeg synes, det er vigtigt, at vi får styrket vores forsvar i forhold til Østersøen og dermed også det forsvar, vi har på Bornholm, siger hun.", "lt": 4, "lp": 0.88, "src": "DR · 2022-10-13", "s": "For", "sc": 0.32}, {"p": "Rasmus Jarlov", "pa": "KF", "c": "Hvis der kun kommer 40 milliarder kroner ind, så er det stadig også mange penge, og så må vi bruge dem, før vi leder efter flere penge, siger Rasmus Jarlov.", "lt": 5, "lp": 0.9, "src": "DR · 2022-10-28", "s": "Imod", "sc": -0.16}, {"p": "Rasmus Jarlov", "pa": "KF", "c": "Hvis der kun kommer 40 milliarder kroner ind, så er det stadig også mange penge, og så må vi bruge dem, før vi leder efter flere penge, siger Rasmus Jarlov.", "lt": 5, "lp": 0.9, "src": "DR · 2022-10-28", "s": "Imod", "sc": -0.16}, {"p": "Rasmus Jarlov", "pa": "KF", "c": "Jo, hvis TV 2 lægger sendeflade til, kan I bare sige til. Vi har jo også fremlagt et udspil . Det er også meget op til jer, hvilke emner I sætter fokus på. Vi oplever ikke, at medierne er superinteresseret i at tage det op, siger Rasmus Jarlov.", "lt": 5, "lp": 0.67, "src": "TV 2 · 2022-10-30", "s": "Neutral", "sc": -0.01}, {"p": "Rasmus Jarlov", "pa": "KF", "c": "Nej, nej, vi siger også ting hver dag, og jeg har hver dag sagt noget om Forsvaret.", "lt": 3, "lp": 0.54, "src": "TV 2 · 2022-10-30", "s": "Neutral", "sc": -0.0}, {"p": "Rasmus Jarlov", "pa": "KF", "c": "Vi har brug for ret store reformer, hvis vi skal sikre, at vi har en arbejdsstyrke, der er stor nok til, at vi kan få et velfærdssamfund til at fungere og blive ved med at være et velstående land, siger Rasmus Jarlov, der er reformordfører for Det Konservative Folkeparti.", "lt": 4, "lp": 0.59, "src": "TV 2 · 2022-10-31", "s": "For", "sc": 0.58}, {"p": "Rasmus Jarlov", "pa": "KF", "c": "Det største problem for Danmark er mangel på arbejdskraft, siger Rasmus Jarlov.", "lt": 5, "lp": 0.83, "src": "TV 2 · 2022-10-31", "s": "Imod", "sc": -0.25}, {"p": "Rasmus Jarlov", 5", "s": "Neutral", "sc": -0.03}, {"p": "Rasmus Lund-Nielsen", "pa": "M", "c": "Man kan have nogen tilknyttet centralt, der lærer de unge op, så de ikke skal gøre det ude på de enkelte sygehuse, siger Rasmus Lund-Nielsen.", "lt": 5, "lp": 0.53, "src": "DR · 2022-10-25", "s": "Neutral", "sc": -0.01}, {"p": "Rasmus Stoklund", "pa": "S", "c": "Har statsministeren begået fejl i minkskandalen. Ja eller nej?, lød det fra Jakob Ellemann Jensen.", "lt": 3, "lp": 0.44, "src": "DR · 2022-10-06", "s": "Imod", "sc": -0.13}, {"p": "Rasmus Stoklund", "pa": "S", "c": "Ja, der blev begået fejl, men det var ikke statsministeren, der var klar over, at der blev begået fejl.", "lt": 4, "lp": 0.51, "src": "DR · 2022-10-06", "s": "Neutral", "sc": -0.02}, {"p": "Rasmus Stoklund", "pa": "S", "c": "Har statsministeren begået fejl i minkskandalen - ja eller nej?, spurgte Venstres formand, Jakob Ellemann-Jensen.", "lt": 4, "lp": 0.59, "src": "TV 2 · 2022-10-06", "s": "Neutral", "sc": 0.02}, {"p": "Rasmus Stoklund", "pa": "S", "c": "Spørgsmålene går i ring På intet tidspunkt svarede Stoklund klart ja eller nej.", "lt": 3, "lp": 0.39, "src": "TV 2 · 2022-10-06", "s": "", "sc": NaN}, {"p": "Rasmus Stoklund", "pa": "S", "c": "Man skulle næsten tro, at det var hr. Clement Kjærsgaard (studievært på DR, red.), der arbejdede her i salen. For det handler ikke om, hvad man vil i næste valgperiode, men spørgsmålene går i ring, sagde han.", "lt": 4, "lp": 0.51, "src": "TV 2 · 2022-10-06", "s": "Imod", "sc": -0.14}, {"p": "Rosa Lund", "pa": "EL", "c": "Jeg synes faktisk, at det er meget politik. Alt, hvad vi lægger op, har et politisk fokus. Det er bare politik på en anden måde. Hvis jeg lagde noget op, hvor jeg bare stod og dansede, ville det være noget andet, siger Rosa Lund.", "lt": 5, "lp": 0.86, "src": "TV 2 · 2022-10-10", "s": "Imod", "sc": -0.06}, {"p": "Rosa Lund", "pa": "EL", "c": "Der er masser underholdning, men det er jo med et politisk twist. Det er jo et andet medie end eksempelvis Facebook med lange opslag og forklaringer. Men jeg forsøger at have noget med politik med, siger hun.", "lt": 5, "lp": 0.86, "src": "TV 2 · 2022-10-10", "s": "Neutral", "sc": -0.04}, {"p": "Rosa Lund", "pa": "EL", "c": "Det er heller ikke, fordi det er dilemmafrit at være på TikTok. Jeg synes, at det er et fedt medie, fordi det kan nogle ting. Men jeg synes også, at det er bekymrende, fordi vi reelt ikke ved, om kineserne lige pludselig tapper vores oplysninger, siger Rosa Lund.", "lt": 5, "lp": 0.72, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.06}, {"p": "Rosa Lund", "pa": "EL", "c": "Jeg synes, at man bør være lige kritisk overfor både TikTok og Facebook. Jeg er lige så bange for amerikanerne, som jeg er for kineserne, siger hun og henviser til NSA-skandalen .", "lt": 0, "lp": 0.79, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.24}, {"p": "Sophie Løhde", "pa": "V", "c": "Grundlæggende sparker Moderaterne en åben dør ind med mange af deres forslag, som også er at finde i det sundhedsudspil, som Venstre præsenterede i går, så det er positivt, siger hun.", "lt": 5, "lp": 0.88, "src": "DR · 2022-10-14", "s": "Neutral", "sc": 0.05}, {"p": "Sophie Løhde", "pa": "V", "c": "Det er nok det sted, hvor vi ikke helt ser ens på tingene. Vi ønsker ikke at tage rettighederne fra patienterne. Snarere tværtimod har vi behov for at udnytte al ledig kapacitet, fordi vi har nogle store problemer med ventelister i det danske sundhedsvæsen, siger hun.", "lt": 1, "lp": 0.35, "src": "DR · 2022-10-14", "s": "", "sc": NaN}, {"p": "Søren Egge Rasmussen", "pa": "EL", "c": "Det er jo socialpolitik, betalt af ens naboer i de almene boliger.", "lt": 4, "lp": 0.58, "src": "DR · 2022-10-27", "s": "Imod", "sc": -0.15}, {"p": "Søren Egge Rasmussen", "pa": "EL", "c": "Jeg kan bedre acceptere, at lejernes egne penge går til at renovere ekstra i den almene sektor. Men det her er noget socialhjælp, som vi skal finde ud af på Christiansborg, så det er statskassen, der kommer til at betale, siger han.", "lt": 4, "lp": 0.9, "src": "DR · 2022-10-27", "s": "For", "sc": 0.2}, {"p": "Søren Egge Rasmussen", "pa": "EL", "c": "Pengene skal gå til boligrenoveringer, energieffektiviseringer og i nogle tilfælde også huslejestøtte, lyder det fra SF&#x27;s Lisbeth Bech-Nielsen.", "lt": 1, "lp": 0.72, "src": "DR · 2022-10-27", "s": "Imod", "sc": -0.29}, {"p": "Søren Egge Rasmussen", "pa": "EL", "c": "Det er lejerne selv, der er med til at finansiere, at de lejere, som er mest udsatte, ikke skal gå fra hus og hjem, så på den måde er der tale om en solidarisk finansiering, siger han.", "lt": 5, "lp": 0.63, "src": "DR · 2022-10-27", "s": "For", "sc": 0.4}, {"p": "Søren Egge Rasmussen", "pa": "EL", "c": "Vi er helt åbne om finansieringen, og for os er det afgørende at give en hjælpende hånd direkte til de lejere, som har mindst, og som er i risikozonen for at måtte gå fra hus og hjem, siger ministeren.", "lt": 5, "lp": 0.9, "src": "DR · 2022-10-27", "s": "Neutral", "sc": 0.05}, {"p": "Søren Espersen", "pa": "DD", "c": "Nej, fordi forsvarsforligskredsen er ikke sammensat endnu. Alle er enige i regeringens måde at gøre det her på i forhold til våbenleverance, støtte og alle mulige ting. Der er ikke ét parti i Folketinget, der ikke synes, at det er en god idé, siger han.", "lt": 3, "lp": 0.91, "src": "TV 2 · 2022-10-30", "s": "For", "sc": 0.73}, {"p": "Søren Gade", "pa": "V", "c": "Jeg vidste godt, at Venstre ville gå tilbage, men jeg må indrømme, at jeg havde håbet på, at vi havde ligget bedre i exitpolls, siger Søren Gade. Han er selv opstillet i Vestjylland.", "lt": 2, "lp": 0.72, "src": "DR · 2022-11-01", "s": "Neutral", "sc": 0.02}, {"p": "Søren Gade", "pa": "V", "c": "Det står for egen regning, det her, lyder det fra Søren Gade som fortsætter:", "lt": 5, "lp": 0.83, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.1}, {"p": "Søren Gade", "pa": "V", "c": "Men det her med, at man på blå stue stillede med to statsministerkandidater, det skal laves om. Det må være sådan, at man samler sig om en, og så har vælgerne én statsministerkandidat at forholde sig til, når man går til valg næste gang.", "lt": 3, "lp": 0.4, "src": "DR · 2022-11-01", "s": "", "sc": NaN}, {"p": "Søren Gade", "pa": "V", "c": "Set i bagklogskabens klare lys, så var det en katastrofe, lyder det fra Claus Hjort Frederiksen.", "lt": 3, "lp": 0.43, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.2}, {"p": "Søren Gade", "pa": "V", "c": "Man kan sige, at den måde, det er gået De Konservative og Søren Pape, så har de ikke bidraget til overhovedet at sikre en blå valgsejr.", "lt": 0, "lp": 0.79, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.17}, {"p": "Søren Gade", "pa": "V", "c": "Man starter valgkampen med et ønske om at ville give de rigeste topskattelettelser. Jeg har snakket med De Konservative om det i rigtig mange år. Det er en taberstrategi.", "lt": 1, "lp": 0.83, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.58}, {"p": "Søren Søndergaard", "pa": "EL", "c": "Forslaget er aldeles ubegrundet, når man ser på myndighedernes nyeste vurderinger af udfordringer for det danske grundvand og lytter til førende eksperter, siger han.", "lt": 2, "lp": 0.79, "src": "TV 2 · 2022-10-28", "s": "Imod", "sc": -0.11}, {"p": "Thomas Danielsen", "pa": "V", "c": "Det er en helt særlig dag, hvor man mindes de mistede søfolk, og der er kransenedlægninger, og mange holder fri eller holder en halv arbejdsdag, siger han.", "lt": 1, "lp": 0.86, "src": "TV 2 · 2022-10-05", "s": "Neutral", "sc": 0.01}, {"p": "Tobias Grotkjær Elmstrøm", "pa": "M", "c": "Jeg har set de stramninger, der har været, og mener, at vi skal have fornuften tilbage, siger Tobias Grotkjær Elmstrøm, da TV 2 møder ham på det lille kontor i bazaren.", "lt": 1, "lp": 0.58, "src": "TV 2 · 2022-10-11", "s": "For", "sc": 0.41}, {"p": "Trine Bramsen", "pa": "S", "c": "Jeg er med på, at der ikke er noget at bebrejde hverken FE, din indhentningschef eller dig. Men du har været med så mange år, at du godt ved, at jeg skal kunne tælle til 90, refererer han forsvarsministeren for at sige.", "lt": 2, "lp": 0.58, "src": "DR · 2022-10-13", "s": "Neutral", "sc": 0.0}, {"p": "Trine Bramsen", "pa": "S", "c": "Det synes jeg ikke. Trine Bramsen er ikke forsvarsminister mere, og jeg kan ikke engang bekræfte, at der har været sådan et møde, siger han.", "lt": 5, "lp": 0.39, "src": "DR · 2022-10-13", "s": "", "sc": NaN}, {"p": "Trine Bramsen", "pa": "S", "c": "Det bliver lidt svært at diskutere det her i offentligheden, og derfor er det også en appel fra min side om at stole på, at vi har uafhængige dommere, der er i stand til at træffe en afgørelse, efter de selvfølgelig har haft adgang til alt, hvad sagen handler om.", "lt": 1, "lp": 0.64, "src": "DR · 2022-10-13", "s": "For", "sc": 0.06}, {"p": "Trine Bramsen", "pa": "S", "c": "Jeg har noteret mig, at han har skrevet en bog, men jeg kan jo ikke gå ind og kommentere på ting, hvor jeg har tavshedspligt. Derfor kommer jeg heller ikke til at kunne svare på nogle af de påstande, han kommer med, siger hun.", "lt": 1, "lp": 0.72, "src": "DR · 2022-10-13", "s": "Neutral", "sc": 0.02}, {"p": "Trine Bramsen", "pa": "S", "c": "Hvis du fjerner den øverste ledelse i tjenesten umiddelbart før tilsynets kritik, vil alle tro, at FE har gjort noget forkert, og at der er grundlag for kritikken. Og det vil være forkert, sagde Findsen ifølge bogen til ministeren.", "lt": 1, "lp": 0.91, "src": "TV 2 · 2022-10-13", "s": "Neutral", "sc": -0.03}, {"p": "Trine Bramsen", "pa": "S", "c": "Jeg kan kun tolke det sådan, at det, mine gæster og jeg har sagt i mit hus om navngivne politikere og om, hvordan jeg skulle stille mig, når kommissionens resultat kom, som frygtet bliver brugt imod mig.", "lt": 3, "lp": 0.86, "src": "TV 2 · 2022-10-13", "s": "Imod", "sc": -0.24}, {"p": "Troels Lund Poulsen", "pa": "V", "c": "Men en ting er, hvad man siger, og noget andet er, hvad man har gjort. Og hvis vi dømmer Socialdemokratiet på historien, mens de har haft magten, så har de altså sat skatten op, siger Troels Lund Poulsen.", "lt": 4, "lp": 0.52, "src": "DR · 2022-10-09", "s": "Imod", "sc": -0.16}, {"p": "Troels Lund Poulsen", "pa": "V", "c": "Det er helt afgørende, at det bedre skal kunne betale sig at arbejde, og vi synes også, at det er rimeligt, at skatteborgerne kan beholde flere af deres egne penge, siger partiets finansordfører, Troels Lund Poulsen (V), til TV 2.", "lt": 4, "lp": 0.92, "src": "TV 2 · 2022-10-11", "s": "For", "sc": 0.1}, {"p": "Troels Lund Poulsen", "pa": "V", "c": "Vi mener, at det er ambitiøst, fordi det skal også kunne realiseres. Det er afgørende, at det man præsenter, kan lade sig gøre, ellers kan man jo bare lave et tomt slag ud i luften, siger han.", "lt": 0, "lp": 0.72, "src": "TV 2 · 2022-10-11", "s": "For", "sc": 0.1}, {"p": "Troels Lund Poulsen", "pa": "V", "c": "Der skal være en ret til fuldtid som offentligt ansatte, og det stiller skrappere krav til det offentlige.", "lt": 5, "lp": 0.49, "src": "TV 2 · 2022-10-11", "s": "Imod", "sc": -0.29}, {"p": "Troels Lund Poulsen", "pa": "V", "c": "Ja man skal kigge på en bred vifte af ting, fordi der er steder, hvor arbejdsmiljøet er presset, så det skal man også kigge på.", "lt": 1, "lp": 0.69, "src": "TV 2 · 2022-10-11", "s": "For", "sc": 0.35}, {"p": "Troels Lund Poulsen", "pa": "V", "c": "Det, som andre partier har fremlagt, har været nogle drømmescenarier, som ikke kan materialiseres i dansk politik – og derfor er det, vi lægger på bordet realistisk og muligt at gennemføre, siger han til DR Nyheder.", "lt": 0, "lp": 0.63, "src": "DR · 2022-10-12", "s": "Neutral", "sc": -0.04}, {"p": "Troels Lund Poulsen", "pa": "V", "c": "Det er jo ikke første gang, at Venstre går tilbage. Jeg var meget tæt på at ryge ud ved valget i 2015, og ti dage efter var jeg erhvervsminister. Så det viser, hvor hurtigt det kan gå i politik, siger Troels Lund Poulsen.", "lt": 4, "lp": 0.9, "src": "DR · 2022-10-29", "s": "Neutral", "sc": 0.04}, {"p": "Troels Lund Poulsen", "pa": "V", "c": "Vi har brug for flere hænder for at få vores samfund til at hænge bedre sammen. Både i forhold til de private virksomheder, der efterspørger mere arbejdskraft, men også fordi den offentlige sektor kommer til at mangle hænder, fordi vi bliver flere ældre og flere børn. Derfor skal vi sikre, at der er de hænder, som der er brug for, siger Troels Lund Poulsen.", "lt": 4, "lp": 0.96, "src": "TV 2 · 2022-10-31", "s": "For", "sc": 0.71}, {"p": "Troels Lund Poulsen", "pa": "V", "c": "Vi skal give skattelettelser for, at det bedre kan betale sig at arbejde.", "lt": 4, "lp": 0.83, "src": "TV 2 · 2022-10-31", "s": "For", "sc": 0.12}, {"p": "Troels Lund Poulsen", "pa": "V", "c": "Vi skal gøre en ekstra indsats for at tiltrække udenlandsk arbejdskraft til Danmark.", "lt": 4, "lp": 0.72, "src": "TV 2 · 2022-10-31", "s": "For", "sc": 0.46}, {"p": "Troels Lund Poulsen", "pa": "V", "c": "Fordi hvis man skal gøre noget, der er holdbart, bliver man jo nødt til at være sikker på, at det, man beslutter, også kan lade sig gøre, siger Troels Lund Poulsen.", "lt": 4, "lp": 0.86, "src": "TV 2 · 2022-10-31", "s": "For", "sc": 0.13}, {"p": "Troels Lund Poulsen", "pa": "V", "c": "Hvis man som Venstre gerne vil styrke velfærdssamfundet og give flere penge til sundhed og ældre, skal man også være sikker på, at der er nogle mennesker til at udføre den service, som man har fundet pengene til.", "lt": 4, "lp": 0.92, "src": "TV 2 · 2022-10-31", "s": "For", "sc": 0.63}, {"p": "Victoria Velasquez", "pa": "EL", "c": "Det er hovedrystende og under alt kritik. Vi har at gøre med nogle af de mennesker, som bliver ramt hårdest af de stigende priser, og aftalen blev netop lavet for at få varmehjælp ud til dem, siger Victoria Velasquez.", "lt": 1, "lp": 0.39, "src": "DR · 2022-10-13", "s": "", "sc": NaN}, {"p": "Victoria Velasquez", "pa": "EL", "c": "Efter valget vil vi som det første spørge kritisk ind til Finansministeriets beregninger. Hvis det skulle vise sig, at Finansministeriets skøn er uholdbart, vil vi selvfølgelig foreslå nye finansieringskilder til den grønne omstilling, som er fuldstændigt afgørende for Enhedslisten, skriver finansordfører Victoria Velasquez i en kommentar.", "lt": 0, "lp": 0.5, "src": "DR · 2022-10-28", "s": "For", "sc": 0.19}, {"p": "Victoria Velasquez", "pa": "EL", "c": "Det er jo hamrende alvorligt. Folk kan ikke betale deres regninger og har ondt i maven, når de går mod køledisken i slutningen af måneden. Vi ved, at de kriterier for at få penge fra den her varmepulje er alt for strikse, siger hun.", "lt": 0, "lp": 0.83, "src": "DR · 2022-10-30", "s": "Imod", "sc": -0.13}, {"p": "Zenia Stampe", "pa": "RV", "c": "Det er frygteligt. Vi har kendt hinanden i mange år, så vi støtter faktisk hinanden i den her situation. Hun sendte mig en sms, hvor hun skrev, at vi virkelig har brug for at give hinanden et stort kram snart. Det er en ret svær situation, men det vigtigste er, at man støtter hinanden, siger Zenia Stampe.", "lt": 2, "lp": 0.95, "src": "DR · 2022-10-29", "s": "For", "sc": 0.27}, {"p": "Zenia Stampe", "pa": "RV", "c": "Jeg tænker ikke på det, som om vi konkurrerer mod hinanden. Jeg tænker faktisk, at vi begge kæmper med at hente stemmer hjem til vores parti, så på den måde er vi på samme hold. Så må vi se på valgdagen.", "lt": 4, "lp": 0.52, "src": "DR · 2022-10-29", "s": "Neutral", "sc": 0.0}, {"p": "Zenia Stampe", "pa": "RV", "c": "Det er ret vigtigt, at når man konkurrerer indbyrdes om nogle mandater, at man samtidig husker på, at vi også er i en fælles interesse for, at vi overhovedet får mandater til partiet, siger Zenia Stampe.", "lt": 1, "lp": 0.86, "src": "DR · 2022-10-29", "s": "For", "sc": 0.16}], "pol": [{"n": "Alex Vanopslagh", "pa": "LA", "k": 24, "lt": 5, "lp": 0.37, "ex": [14, 12, 4]}, {"n": "Astrid Krag", "pa": "S", "k": 4, "lt": 3, "lp": 0.27, "ex": [27, 25, 26]}, {"n": "Inger Støjberg", "pa": "DD", "k": 40, "lt": 4, "lp": 0.21, "ex": [34, 66, 71]}, {"n": "Jakob Engel-Schmidt", "pa": "M", "k": 27, "lt": 0, "lp": 0.38, "ex": [94, 92, 90]}   const title = S.level === "citat" ? `${esc(x.p)} (${esc(x.pa)})` : `${esc(x.n)} (${esc(x.pa)})`;
  const sub = S.level === "citat" ? `<div class="meta">${x.c.length > 140 ? x.c.slice(0, 140) + " …" : x.c}</div>` : `<div class="meta">${x.k} citater · ${esc(tname(x.lt))}</div>`;
  return `<button class="nb" data-i="${j}"><div class="t"><span><b>${r + 1}.</b> ${title}</span><span class="v">${fmt(sim, 2)}</span></div>${sub}
    <div class="simbar"><i style="width:${Math.max(0, sim) * 100}%"></i></div></button>`;
}
function panel() {
  const s = S.sel;
  if (s == null) { $("sel").innerHTML = `<p class="empty">Klik på et punkt, eller søg efter et ord eller en politiker. Her ser du så de ${K} nærmeste naboer målt med cosinus i det oprindelige rum – og om kortet placerer dem tæt på.</p><button class="btn" id="rnd">Vælg et tilfældigt</button>`;
    $("rnd").onclick = () => select(Math.floor(Math.random() * items().length)); return; }
  const m = M(), nn = m.nn[s], kept = mapNeighbors(s).filter(j => nn.includes(j)).length;
  const same = nn.filter(j => items()[j].pa === items()[s].pa).length;
  $("sel").innerHTML = itemCard(s) +
    `<h3>${K} nærmeste naboer · ${S.rep === "lda" ? "LDA (Hellinger)" : "TF-IDF (cosinus)"}</h3>` +
    nn.map((j, r) => nbRow(j, r, m.sim[s][r])).join("") +
    `<div class="verdict">På ${S.map === "pca" ? "PCA" : "t-SNE"}-kortet er <b>${kept} af ${K}</b> af dem også blandt de ${K} nærmeste punkter. ${same} af ${K} er fra samme parti.</div>`;
  for (const b of $("sel").querySelectorAll(".nb")) b.onclick = () => select(+b.dataset.i);
}
function stats() {
  const lvl = D.maps[S.level];
  $("statsub").textContent = `Gennemsnit over alle ${S.level === "citat" ? "citater" : "politikere"}: hvor mange af de ${K} rigtige naboer kortet også lægger blandt de ${K} nærmeste, og hvor ofte naboerne er fra samme parti.`;
  $("stats").innerHTML = ["tfidf", "lda"].map(r => { const s = lvl[r].stats;
    return `<tr${r === S.rep ? ' style="font-weight:600"' : ""}><td>${r === "lda" ? "LDA" : "TF-IDF"}</td><td class="n">${fmt(s.pca)} af ${K}</td><td class="n">${fmt(s.tsne)} af ${K}</td><td class="n">${pct(s.party)} (tilfældigt ${pct(s.base)})</td></tr>`; }).join("");
}
function select(i) { S.sel = i; draw(); }
function setOpt(k, v) {
  if (S[k] === v) return;
  const anim = k === "map"; S[k] = v;
  if (k === "level" || k === "rep") { if (k === "level") { S.sel = null; if (v !== "citat" && S.color === "stance") S.color = "parti";
    try { history.replaceState(null, "", v === "politiker" ? "#politikere" : "#citater"); } catch (e) {} } }
  draw(anim);
}
for (const [id, k] of [["s-level", "level"], ["s-rep", "rep"], ["s-map", "map"], ["s-color", "color"]])
  $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (b && !b.disabled) setOpt(k, b.dataset.v); });
$("lines").addEventListener("change", e => { S.lines = e.target.checked; draw(); });
let tq;
$("q").addEventListener("input", e => { clearTimeout(tq); tq = setTimeout(() => search(e.target.value), 150); });
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { const b = $("res").querySelector("button"); if (b) b.click(); } });
function search(v) {
  const q = v.trim().toLowerCase();
  if (!q) { $("res").innerHTML = ""; return; }
  const it = items(), hits = [];
  it.forEach((x, i) => { const hay = S.level === "citat" ? (x.c + " " + x.p + " " + x.pa) : (x.n + " " + x.pa); if (hay.toLowerCase().includes(q)) hits.push(i); });
  $("res").innerHTML = hits.length ? hits.slice(0, 8).map(i => `<button data-i="${i}"><b>${esc(label(i))}</b>${S.level === "citat" ? ` – <span class="meta">${C[i].c.slice(0, 90)} …</span>` : ""}</button>`).join("") +
    (hits.length > 8 ? `<p class="meta">${hits.length} træf – viser 8.</p>` : "") : `<p class="meta">Ingen træf.</p>`;
  for (const b of $("res").querySelectorAll("button")) b.onclick = () => { select(+b.dataset.i); $("res").innerHTML = ""; };
}
$("ldasub").textContent = `${D.meta.lda}. De vigtigste ord per emne:`;
$("topics").innerHTML = T.map((t, i) => `<div><span class="dot" style="background:${D.ldaFarver[i]}"></span><b>${esc(t.label)}</b>${t.words ? " · " + esc(t.words) : ""}</div>`).join("");
$("note").innerHTML = `<p><b>To repræsentationer, to slags lighed.</b> TF-IDF (${esc(D.meta.tf)}) finder citater, der bruger de samme sjældne ord. LDA beskriver hvert citat som en blanding af emner, og to citater er naboer, hvis blandingerne ligner hinanden (Hellinger-afstand). Politikere er gennemsnittet af deres citater.</p>
<p><b>Forbehold.</b> Citaterne er korte, så mange citater får næsten ét LDA-emne, og emnerne kan være svage. Kortet er kun et billede: brug nabolisten, og læs citaterne, før du konkluderer.</p>`;
const themeObs = new MutationObserver(() => draw());
themeObs.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
if (typeof Plotly === "undefined") $("lede").textContent = "Plotly kunne ikke indlæses. Tjek din internetforbindelse og genindlæs siden.";
else draw();
}
</script>
</body></html>
