<!DOCTYPE html>
<html lang="da"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Et atlas over valgkampens citater</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
/* VOICE: avisens grafikredaktion – sagligt, præcist, roligt
   IDEA: et atlas over valgkampen; kortet skifter, vektorerne gør ikke
   PICTURE: ét stort kort med naboer trukket op som linjer, panel ved siden af
   COLOUR and TYPE: hvid, sort blæk, rød fane; Source Serif 4 + Inter
   LAYOUT: rød fane, overskrift, kontrolstribe, kort 2/3 + panel 1/3, tal og emner under */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#10191e);--ink:light-dark(#121212,#e9eef0);--mute:light-dark(#5b6670,#9aa8b1);
--rule:light-dark(#d9dee2,#26343b);--panel:light-dark(#e3ecf0,#17242b);--red:#e3120b;--chip:light-dark(#fff,#10191e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3vw,40px) max(4vw,16px);max-width:1360px;margin:0 auto}
.tab-red{display:block;width:44px;height:8px;background:var(--red);margin-bottom:14px}
h1{font:600 clamp(30px,4.2vw,46px)/1.05 "Source Serif 4",Georgia,serif;margin:0 0 10px;text-wrap:balance;max-width:26ch}
.lede{color:var(--mute);margin:0;max-width:72ch}
.bar{display:flex;gap:12px 22px;align-items:end;flex-wrap:wrap;padding:18px 0 14px;border-bottom:1px solid var(--rule)}
.ctl{display:flex;flex-direction:column;gap:4px}.lbl{font-size:13px;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--chip);color:var(--ink);padding:0 13px;min-height:40px;font:500 14px Inter,sans-serif;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer;min-height:40px}
.main{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:0}
.mapwrap{padding:12px 18px 0 0;border-right:1px solid var(--rule)}
#map{height:min(70vh,640px);min-height:420px}
.mapsub{font-size:13px;color:var(--mute);margin:0}
aside{padding:14px 0 14px 18px}
input[type=search]{font:16px Inter,sans-serif;padding:0 12px;min-height:44px;border:1px solid var(--rule);border-radius:8px;background:var(--chip);color:var(--ink);width:100%}
.res{display:flex;flex-direction:column;margin-top:6px}
.res button,.nb{all:unset;cursor:pointer;display:block;padding:8px 6px;border-bottom:1px solid var(--rule);font-size:14px}
.res button:hover,.nb:hover{background:var(--panel)}.res button:focus-visible,.nb:focus-visible{outline:2px solid var(--red)}
.sel{margin-top:14px}
h2{font:600 20px/1.2 "Source Serif 4",Georgia,serif;margin:0 0 4px}
h3{font:600 16px/1.3 Inter,sans-serif;margin:18px 0 2px}
.meta{font-size:13px;color:var(--mute)}
q{display:block;font-size:15px;margin:6px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.simbar{height:4px;background:var(--rule);margin-top:5px}.simbar i{display:block;height:4px;background:var(--red)}
.nb .t{display:flex;justify-content:space-between;gap:10px}.nb .v{font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
.verdict{background:var(--panel);padding:10px 12px;font-size:14px;margin-top:12px}
.empty{color:var(--mute);font-size:15px}
.btn{border:1px solid var(--rule);background:var(--chip);color:var(--ink);border-radius:8px;padding:0 14px;min-height:40px;font:500 14px Inter,sans-serif;cursor:pointer;margin-top:10px}
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 36px;border-top:1px solid var(--rule);margin-top:8px;padding-top:6px}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.topics div{padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}
.note{background:var(--panel);padding:16px 18px;margin-top:22px;font-size:15px}.note p{margin:0 0 8px;max-width:85ch}.note p:last-child{margin:0}
@media(max-width:900px){.main,.lower{grid-template-columns:minmax(0,1fr)}.mapwrap{border-right:0;padding-right:0}aside{padding-left:0;border-top:1px solid var(--rule)}#map{height:460px}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:9em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8.5em;margin-inline-start:-9em;white-space:normal;color:var(--mute)}}
</style></head><body>
<div class="band">
  <span class="tab-red"></span>
  <h1>Et atlas over valgkampens citater</h1>
  <p class="lede" id="lede"></p>
  <div class="bar">
    <div class="ctl"><span class="lbl">Niveau</span><div class="seg" id="s-level"><button data-v="citat">Citater</button><button data-v="politiker">Politikere</button></div></div>
    <div class="ctl"><span class="lbl">Repræsentation</span><div class="seg" id="s-rep"><button data-v="tfidf">TF-IDF</button><button data-v="lda">LDA</button></div></div>
    <div class="ctl"><span class="lbl">Kort</span><div class="seg" id="s-map"><button data-v="pca">PCA</button><button data-v="tsne">t-SNE</button></div></div>
    <div class="ctl"><span class="lbl">Farv efter</span><div class="seg" id="s-color"><button data-v="parti">Parti</button><button data-v="lda">LDA-emne</button><button data-v="stance">Stance</button></div></div>
    <label class="chk"><input type="checkbox" id="lines" checked> Linjer til naboer</label>
  </div>
  <div class="main">
    <div class="mapwrap"><div id="map" role="img" aria-label="Kort over citater"></div><p class="mapsub" id="mapsub"></p></div>
    <aside>
      <input type="search" id="q" placeholder="Søg citat, politiker eller parti" aria-label="Søg">
      <div class="res" id="res"></div>
      <div class="sel" id="sel"></div>
    </aside>
  </div>
  <div class="lower">
    <section><h2>Hvor meget kan man stole på kortet?</h2><p class="meta" id="statsub"></p>
      <table class="stack"><thead><tr><th>Repræsentation</th><th class="n">Naboer bevaret, PCA</th><th class="n">Naboer bevaret, t-SNE</th><th class="n">Naboer fra samme parti</th></tr></thead><tbody id="stats"></tbody></table>
    </section>
    <section class="topics"><h2>LDA-emnerne</h2><p class="meta" id="ldasub"></p><div id="topics"></div></section>
  </div>
  <div class="note" id="note"></div>
</div>
<script>
{
const D = {"partier": ["EL", "SF", "S", "RV", "M", "KF", "V", "LA", "DD", "DF"], "partiFarver": {"EL": "#C2185B", "SF": "#E57399", "S": "#D7262B", "RV": "#7B3F98", "M": "#9C7BD6", "KF": "#2E8B57", "V": "#1F5FAD", "LA": "#2BA3B4", "DD": "#4A7FD0", "DF": "#E3B61F", "ALT": "#5F9E3A", "IA": "#8C564B", "SP": "#6B8E9E", "N": "#999999", "JF": "#777777", "UFG": "#AAAAAA"}, "stanceFarver": {"For": "#2E8B57", "Neutral": "#9AA1A9", "Imod": "#D7262B"}, "hasStance": true, "ldaFarver": ["#1F5FAD", "#E3A01F", "#2E8B57", "#7B3F98", "#E3120B", "#2BA3B4"], "topics": [{"label": "Økonomi & Landbrug", "words": "frem, tale, måned, 000, krone, landbrug, lægge, levere"}, {"label": "Udlændinge & Arbejdsmarked", "words": "handle, lyde, sted, udlændingepolitik, løse, løn, medarbejder, ende"}, {"label": "Kommuner & Beskæftigelse", "words": "2022, kommune, sætte, 00, arbejde, stå, dansker, peter"}, {"label": "Regeringsdannelse & Midten", "words": "regering, bred, statsminister, midte, klar, samarbejde, stille, nej"}, {"label": "Velfærd, Børn & Unge", "words": "arbejde, tænke, betale, ung, fejl, vigtig, barn, land"}, {"label": "Blokpolitik & Statsfinanser", "words": "penge, blok, stå, hjem, rød, høre, rasmus, blå"}], "citater": [{"p": "Alex Vanopslagh", "pa": "LA", "c": "Jeg synes, det er ærgerligt, at vi nu skal til at give danskerne en slags kviklån, fordi vi har beskattet dem så hårdt, siger Alex Vanopslagh med henvisning til den politiske aftale, der giver danskerne mulighed for at vente med at betale en del af deres el- og gasregning senere.", "lt": 2, "lp": 0.61, "src": "DR · 2022-10-05", "s": "For", "sc": 0.24}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Regeringens kamp mod de unges frie valg skal stoppes med det samme, hvis vi får et borgerligt flertal, sagde Alex Vanopslagh og fik opbakning fra de øvrige blå partiledere i Fællessalen på Christiansborg.", "lt": 5, "lp": 0.47, "src": "DR · 2022-10-11", "s": "Imod", "sc": -0.27}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Mette Frederiksen vil fratage unge det frie gymnasievalg, står der blandt andet på Venstres hjemmeside i en pressemeddelelse fra februar i år.", "lt": 5, "lp": 0.83, "src": "DR · 2022-10-11", "s": "Neutral", "sc": -0.01}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Dog er det sikkert, at unge ikke længere selv kan vælge, hvor de vil gå i gymnasiet. Sikkert er det også, at man som gymnasiesøgende i de store byer fremover kan risikere at havne på et gymnasie langt fra de gode venner, lyder det.", "lt": 4, "lp": 0.88, "src": "DR · 2022-10-11", "s": "Imod", "sc": -0.07}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Vi skal ikke gøre det afgørende for unges fremtid, hvad der er pengekontoen hos deres forældre, sagde Alex Vanopslagh.", "lt": 5, "lp": 0.79, "src": "DR · 2022-10-11", "s": "Imod", "sc": -0.17}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Men vi kommer aldrig – aldrig – til at anerkende en løsning, hvor man tager hele ungdommen som gidsel i de røde partiers lighedsmageri, slog han videre fast.", "lt": 2, "lp": 0.63, "src": "DR · 2022-10-11", "s": "Imod", "sc": -0.07}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Man kan skære ned på SU&#x27;en, og så står der straks 20.000 studerende og brøler herude – men det er meget sjældent, at de ældre råber op. Derfor er jeg glad for, at vi her i den borgerlige familie er enige om at give de ældre flere og mere frie valg,", "lt": 5, "lp": 0.92, "src": "DR · 2022-10-11", "s": "For", "sc": 0.62}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "I den borgerlige opposition mener vi, at pengene skal følge borgerne, og at en plads på et plejehjem skal betales over skatten efter samme vilkår som i dag, startede hun og tilføjede:", "lt": 2, "lp": 0.5, "src": "DR · 2022-10-11", "s": "For", "sc": 0.55}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Vi lever i landet med verdens højeste skattetryk, og alligevel går langt størstedelen af danskerne rundt med en frygt for at komme på plejehjem – det er fuldstændig uacceptabelt.", "lt": 1, "lp": 0.89, "src": "DR · 2022-10-11", "s": "Neutral", "sc": -0.05}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Men lad os nu se. Der er næsten to uger tilbage af valgkampen, og målinger kan jo tage fejl, så jeg vil ikke juble for tidligt. Men det giver da et rygstød og noget ekstra motivation, siger partileder Alex Vanopslagh.", "lt": 4, "lp": 0.63, "src": "DR · 2022-10-22", "s": "Neutral", "sc": 0.05}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Jeg er jo selvfølgelig flov og ærgerlig over den sag, for prøv at hør, jeg er en liberal politiker, der går op i lov og orden og at passe på skatteborgernes penge, og når man så ikke har styr på reglerne, så er det pinligt.", "lt": 2, "lp": 0.55, "src": "DR · 2022-10-22", "s": "Neutral", "sc": -0.02}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Men jeg håber, folk kan se, at jeg tager det fulde ansvar på mig, lægger mig fladt ned, og gør hvad jeg kan for at rette op på de fejl, og det er det, jeg mener, at man skal gøre som politiker, når man klokker i det.", "lt": 0, "lp": 0.45, "src": "DR · 2022-10-22", "s": "Neutral", "sc": 0.01}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Lars Løkke hører jo til i rød blok. Han har sagt, at han under ingen omstændigheder vil have en borgerlig regering, siger Alex Vanopslagh og fortsætter:", "lt": 5, "lp": 0.7, "src": "DR · 2022-10-22", "s": "Imod", "sc": -0.06}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Det må jo også gælde, hvis han selv bliver statsminister i en borgerlig regering, så han er en del af rød blok, og derfor kan man jo godt sige, at valget ser ud til at være tabt, når man lægger Løkkes 18 mandater oven i rød blok. Så fører rød blok jo enormt.", "lt": 5, "lp": 0.78, "src": "DR · 2022-10-22", "s": "Imod", "sc": -0.17}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Ja, altså så længe Lars Løkke insisterer på, at han ikke vil have en borgerlig regering – ikke engang hvis han selv er statsminister – men at han derimod vil gøre Mette Frederiksen til statsminister.", "lt": 3, "lp": 0.51, "src": "DR · 2022-10-22", "s": "Imod", "sc": -0.98}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Han siger, at Socialdemokratiet skal være med i en regering. Så hører han jo med til rød blok. Og når man lægger Løkkes mandater oveni rød blok, så er det altså noget af et comeback, vi skal ud i, siger Alex Vanopslagh.", "lt": 5, "lp": 0.72, "src": "DR · 2022-10-22", "s": "Imod", "sc": -0.17}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Mange danskere overvejer at stemme på Moderaterne, fordi vi holder fast i den politiske substans. Det er præcis det, man får med vores parti. Vi ønsker en regering hen over midten, og den statsministerkandidat, der er bedst til at facilitere et bredt samarbejde, er den vi peger på.", "lt": 3, "lp": 0.94, "src": "DR · 2022-10-22", "s": "For", "sc": 0.98}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Vi ønsker som stort set alle andre partier også grøn omstilling og mindre CO₂-udledning, men det skal ske på en måde, hvor vi bliver rigere og skaber arbejdspladser, siger Alex Vanopslagh.", "lt": 1, "lp": 0.53, "src": "TV 2 · 2022-10-27", "s": "Imod", "sc": -0.99}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Her er den største grund til ikke at genvælge den her uansvarlige regering.", "lt": 3, "lp": 0.39, "src": "DR · 2022-10-28", "s": "", "sc": NaN}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Den kommer til at pumpe penge ud - og bliver presset af sine støttepartier til at pumpe mere ud - og inflationen kommer til at vare i årevis. Stem på et parti, der ikke lover dig hjælpepakker, skrev LA&#x27;s frontperson til billedet.", "lt": 5, "lp": 0.88, "src": "DR · 2022-10-28", "s": "Imod", "sc": -0.43}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Vi er selvfølgelig enige i, at hvis man finansierer højere ydelser med mindre offentligt forbrug, så er det sådan cirka inflationsneutralt, skriver Alex Vanopslagh.", "lt": 5, "lp": 0.86, "src": "DR · 2022-10-28", "s": "Neutral", "sc": 0.0}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "De ting, Socialdemokratiet foreslår i sit udspil, er peanuts i forhold til de ekstraregninger, som inflationen har medført. Socialdemokratiet kommer enten til at skuffe rigtig mange eller at åbne for et gedemarked af nye inflationspakker. Ingen af delene er ansvarligt, skriver LA-formanden.", "lt": 3, "lp": 0.92, "src": "DR · 2022-10-28", "s": "Neutral", "sc": -0.0}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Hvis man begynder at have en størrelse, hvor man nærmer sig de 10 procent, så er det noget, man skal at overveje, ja. Men lige nu har vi tre mandater i folketingsgruppen, så lad os tage den snak efter valget, siger partileder Alex Vanopslagh.", "lt": 5, "lp": 0.86, "src": "DR · 2022-10-30", "s": "Neutral", "sc": -0.02}, {"p": "Alex Vanopslagh", "pa": "LA", "c": "Jeg kommer ikke til at gå ind i en regering, hvor Mette Frederiksen er statsminister. Så jeg synes, at alle sejl skal sættes ind på et borgerligt flertal, siger han.", "lt": 3, "lp": 0.86, "src": "DR · 2022-10-30", "s": "Imod", "sc": -0.93}, {"p": "Astrid Krag", "pa": "S", "c": "Det er fuldstændig afgørende, at vi ikke laver en økonomisk politik, der puster til inflationen, for det vil også ramme dem, som har det hårdest. Derfor har vi haft fokus på, hvor vi kan lave en målrettet hjælp, som er social retfærdig, men også økonomisk forsvarlig, tilføjer Astrid Krag.", "lt": 5, "lp": 0.93, "src": "DR · 2022-10-07", "s": "Imod", "sc": -0.22}, {"p": "Astrid Krag", "pa": "S", "c": "Jeg er helt med på, at det er hårde tider i vores samfund på grund af inflationen og den krise, vi står i, og det kan selvfølgelig mærkes bredt, siger Astrid Krag.", "lt": 3, "lp": 0.55, "src": "DR · 2022-10-15", "s": "Neutral", "sc": 0.04}, {"p": "Astrid Krag", "pa": "S", "c": "Så vi skal bruge de midler, der er. Vi har løftet kommunernes økonomi, men vi kan også se, at et ret stort beløb ikke er endt der, hvor borgerne møder velfærd, men på administration og forvaltning, siger hun.", "lt": 1, "lp": 0.92, "src": "DR · 2022-10-15", "s": "Imod", "sc": -0.15}, {"p": "Astrid Krag", "pa": "S", "c": "Noget tyder på, at der er behov for at få kigget på kriterierne for at få godkendt en ansøgning til varmepuljen. Det håber jeg, et flertal vil være med til på den anden side af valget, siger hun.", "lt": 3, "lp": 0.52, "src": "DR · 2022-10-30", "s": "Imod", "sc": -0.28}, {"p": "Brigitte Klintskov Jerkel", "pa": "KF", "c": "Vi synes sådan set, at minimumsnormeringer er vigtige. Men det er den enkelte kommune, der har bedst styr på den enkelte institution. Der kan jo være nogle børnegrupper, som ikke kræver så meget personale som en anden gruppe, hvor børnene måske kræver mere omsorg, støtte og tid, siger børneordfører for Konservative Brigitte Klintskov Jerkel.", "lt": 4, "lp": 0.66, "src": "DR · 2022-10-14", "s": "Imod", "sc": -0.14}, {"p": "Brigitte Klintskov Jerkel", "pa": "KF", "c": "Vi går ind for minimumsnormeringer, men vi synes, kommunerne skal påtage sig den opgave at sørge for, der er hænder nok til børnene. Det er ikke noget, vi skal sidde og detailstyre indefra Christiansborg, siger børneordfører for Konservative, Brigitte Klintskov Jerkel.", "lt": 5, "lp": 0.55, "src": "DR · 2022-10-29", "s": "Neutral", "sc": -0.01}, {"p": "Camilla Fabricius", "pa": "S", "c": "Det er trist, når børn og unge ikke trives. Det tager både jeg og mit parti meget alvorligt. Jeg har arbejdet med mennesker med psykiatriske lidelser stort set hele mit liv.", "lt": 4, "lp": 0.86, "src": "DR · 2022-10-11", "s": "For", "sc": 0.15}, {"p": "Camilla Fabricius", "pa": "S", "c": "Det er noget, vi skal gøre noget ved, og det er derfor, at vi har lavet en tiårig psykiatrihandlingsplan. For den situation, vi hører om, det er ikke godt nok.", "lt": 5, "lp": 0.72, "src": "DR · 2022-10-11", "s": "Imod", "sc": -0.28}, {"p": "Henrik Frandsen", "pa": "M", "c": "De to partier vil jo have skattelettelser, hvor vi andre vil have velfærd. Det hænger jo ikke helt sammen, at de rige vil slippe for at betale mere i skat, og så skal der spares på de svageste. Altså de ældre og børn, utilpassede børn, børn med diagnoser og deslige, siger Henrik Frandsen.", "lt": 4, "lp": 0.92, "src": "DR · 2022-10-09", "s": "For", "sc": 0.54}, {"p": "Inger Støjberg", "pa": "DD", "c": "Vi har ingen tillid til Mette Frederiksen, siger Danmarksdemokraternes formand.", "lt": 1, "lp": 0.79, "src": "DR · 2022-10-05", "s": "Imod", "sc": -0.09}, {"p": "Inger Støjberg", "pa": "DD", "c": "Vi er jo et nyt parti, men på trods af det, så synes jeg, at vi har forberedt os rigtig godt, siger hun.", "lt": 0, "lp": 0.17, "src": "DR · 2022-10-05", "s": "", "sc": NaN}, {"p": "Inger Støjberg", "pa": "DD", "c": "Når jeg hører Søren Pape, så har jeg ikke en fornemmelse af, at der ikke kan blive bygget en bro over det her. Vi kommer til bordet med netop et forslag om at lette skatten i bunden, fordi det for alt for mange ikke kan betale sig at arbejde, sagde Inger Støjberg, der forinden havde slukket lyset for den konservative økonomiske plan.", "lt": 4, "lp": 0.92, "src": "DR · 2022-10-05", "s": "Neutral", "sc": -0.03}, {"p": "Inger Støjberg", "pa": "DD", "c": "Ja, altså vi ser i hvert fald ikke, at man skal fjerne topskatten, sagde Inger Støjberg og nævnte, at den tidligere Thorning-regering hævede beløbsgrænsen for, hvornår man skal betale topskat.", "lt": 3, "lp": 0.6, "src": "DR · 2022-10-05", "s": "Imod", "sc": -0.26}, {"p": "Inger Støjberg", "pa": "DD", "c": "Men det er bare ikke der, vi starter. Vi går først og fremmest op i at sænke skatten i bunden, så det bedre kan betale sig at arbejde, fastslog Inger Støjberg.", "lt": 4, "lp": 0.77, "src": "DR · 2022-10-05", "s": "For", "sc": 0.06}, {"p": "Inger Støjberg", "pa": "DD", "c": "Der er ikke en skat, jeg ikke synes, det kunne være rart at få sat ned, men der skal også være penge til det. Jeg kan godt se mig selv være med til at sænke topskatten, sagde Inger Støjberg.", "lt": 2, "lp": 0.72, "src": "DR · 2022-10-05", "s": "For", "sc": 0.12}, {"p": "Inger Støjberg", "pa": "DD", "c": "Det eneste, der kommer ud af det, hun gør – at tale splittelsen op og fremprovokere falske modsætninger – er risikoen for at smadre sammenhængskraften, der ellers er det vigtigste våben for os som lille land i en krise.", "lt": 4, "lp": 0.83, "src": "TV 2 · 2022-10-06", "s": "Imod", "sc": -0.38}, {"p": "Inger Støjberg", "pa": "DD", "c": "Hun står ved, hvad hun siger Som statsministeren har også Inger Støjberg anskaffet sig en valgbus.", "lt": 3, "lp": 0.72, "src": "TV 2 · 2022-10-07", "s": "Neutral", "sc": 0.03}, {"p": "Inger Støjberg", "pa": "DD", "c": "Det er spændende, at hun er fra Nordjylland som mig. Så ved man, man har en lokal stemme på Christiansborg, siger han med henvisning til Inger Støjbergs bopæl i Hadsund.", "lt": 2, "lp": 0.79, "src": "TV 2 · 2022-10-07", "s": "For", "sc": 0.2}, {"p": "Inger Støjberg", "pa": "DD", "c": "Arh, jeg har godt nok svært ved at se mig selv i en regering, hvor Barbara Bertelsen sidder for bordenden, som hun gør nu, svarede Inger Støjberg.", "lt": 3, "lp": 0.79, "src": "DR · 2022-10-08", "s": "Imod", "sc": -0.8}, {"p": "Inger Støjberg", "pa": "DD", "c": "Jeg vil i hvert fald sige, at jeg har meget, meget svært ved at se Barbara Bertelsen spille en særlig stor rolle, hvis der kommer en borgerlig regering.", "lt": 3, "lp": 0.9, "src": "DR · 2022-10-08", "s": "Imod", "sc": -0.92}, {"p": "Inger Støjberg", "pa": "DD", "c": "Jeg synes, det er ret charmerende, at der hænger valgplakater over alt. Der er et eller andet hyggeligt ved valgkampe med plakater, siger hun.", "lt": 5, "lp": 0.72, "src": "DR · 2022-10-08", "s": "Neutral", "sc": 0.04}, {"p": "Inger Støjberg", "pa": "DD", "c": "Altså helt ærligt... Der er mennesker i det her land, som har svært ved at betale deres elregninger, og så er det sådan noget, man bruger tid på inde på Christiansborg. Det, synes jeg, er forkert, siger Inger Støjberg i programmet Mød Partierne.", "lt": 4, "lp": 0.92, "src": "DR · 2022-10-08", "s": "Imod", "sc": -0.17}, {"p": "Inger Støjberg", "pa": "DD", "c": "Vi er ret overbeviste om, at hvis man har en rettighed som den her, skal det også give mere varierede udbud. Det mener vi vil give forældrene det bedste forløb op til fødslen, sagde hun.", "lt": 5, "lp": 0.58, "src": "DR · 2022-10-11", "s": "For", "sc": 0.12}, {"p": "Inger Støjberg", "pa": "DD", "c": "Jeg synes, det er en dybt alvorlig sag, når det handler om, om man er fortrolig og har det godt med de mennesker, der kommer i ens eget hjem. Når det kommer til ens eget hjem, må man have noget selvbestemmelse, siger Inger Støjberg.", "lt": 5, "lp": 0.52, "src": "DR · 2022-10-12", "s": "Neutral", "sc": -0.02}, {"p": "Inger Støjberg", "pa": "DD", "c": "Jeg savner mennesker frem for politikere. Nogen, som tør sige deres mening, men som alligevel godt kan blive enige, uddyber Mette Voss.", "lt": 0, "lp": 0.43, "src": "TV 2 · 2022-10-16", "s": "Neutral", "sc": -0.01}, {"p": "Inger Støjberg", "pa": "DD", "c": "Så nu skal jeg bare fokusere på at trække dem til, som måske har mistet troen på Dansk Folkeparti, og så skal jeg hjælpe dem med at genfinde den ved at snakke politik og fortælle, hvad vi stadig kan, siger hun:", "lt": 4, "lp": 0.86, "src": "TV 2 · 2022-10-23", "s": "For", "sc": 0.18}, {"p": "Inger Støjberg", "pa": "DD", "c": "Vi er jo det eneste parti i blå blok, der går meget op i, at vi får en ordentlig ældrepleje og sundhedssystem.", "lt": 5, "lp": 0.72, "src": "TV 2 · 2022-10-23", "s": "Imod", "sc": -0.1}, {"p": "Inger Støjberg", "pa": "DD", "c": "Jamen, jeg tror ikke, at vi kommer under spærregrænsen. Indhold mangler Indholdet er ikke længere tilgængeligt og kan derfor ikke vises. Folk vil ikke have flyers Det er især den ansvarlige socialpolitik, sundhed og ældrepolitikken, der tiltaler hende ved Dansk Folkeparti. Og selvfølgelig hård udlændingepolitik. Manden i kørestolen har stemt på Dansk Folkeparti før, fortæller han.", "lt": 4, "lp": 0.49, "src": "TV 2 · 2022-10-23", "s": "Imod", "sc": -0.07}, {"p": "Inger Støjberg", "pa": "DD", "c": "Vi har svigtet dem ved ikke at stille tydelige krav, siger hun.", "lt": 3, "lp": 0.72, "src": "TV 2 · 2022-10-23", "s": "Imod", "sc": -0.23}, {"p": "Inger Støjberg", "pa": "DD", "c": "Det er helt klart, at en CO2-afgift får varernes pris til at stige. Det bliver dyrere at drikke mælk. Det bliver dyrere at spise oksekød og købe sig en pakke smør. Det må jeg sige, at det er jeg meget i mod i en tid, hvor priserne er så høje i forvejen, siger hun.", "lt": 1, "lp": 0.92, "src": "DR · 2022-10-24", "s": "Imod", "sc": -0.45}, {"p": "Inger Støjberg", "pa": "DD", "c": "Vi kan nogle gange slås, så blodet sprøjter, Mai og mig Så snart valgkampen er ovre, bør politikeren sætte uenigheder til side og tage sig at dette emne, mener Inger Støjberg.", "lt": 1, "lp": 0.48, "src": "TV 2 · 2022-10-27", "s": "Imod", "sc": -0.12}, {"p": "Inger Støjberg", "pa": "DD", "c": "Vi kan nogle gange slås, så blodet sprøjter, Mai og mig. Men lige præcis det her er for vigtig til, at der må gå politik i den, siger Inger Støjberg.", "lt": 3, "lp": 0.72, "src": "TV 2 · 2022-10-27", "s": "Imod", "sc": -0.32}, {"p": "Inger Støjberg", "pa": "DD", "c": "Alt for lang tid har man på Christiansborg handlet for lidt Mai Villadsen takker Brian Hummel for at dele sin historie, for det er vigtigt at få talt om trivselskrisen.", "lt": 4, "lp": 0.73, "src": "TV 2 · 2022-10-27", "s": "For", "sc": 0.1}, {"p": "Inger Støjberg", "pa": "DD", "c": "Alt for lang tid har man på Christiansborg handlet for lidt, siger hun.", "lt": 4, "lp": 0.54, "src": "TV 2 · 2022-10-27", "s": "Neutral", "sc": 0.01}, {"p": "Inger Støjberg", "pa": "DD", "c": "Man kan roligt sige, at der er vi jo ikke nået i mål med, at Danmark skal være et demensvenligt land, faktisk tværtimod. Det er meget uvenligt, at man kommer til at stå på en venteliste i op til 70 uger, siger hun.", "lt": 5, "lp": 0.5, "src": "DR · 2022-10-29", "s": "Neutral", "sc": -0.0}, {"p": "Inger Støjberg", "pa": "DD", "c": "Vi så det inden for kræftområdet i sin tid, hvor man fik samlet nogle ting, der betød, at vi er nået rigtig langt i forhold til kræftbehandlingen. Derfor er det vigtigt at få samlet ekspertisen i nogle større enheder, siger Danmarksdemokraternes leder.", "lt": 1, "lp": 0.52, "src": "DR · 2022-10-29", "s": "Imod", "sc": -0.21}, {"p": "Inger Støjberg", "pa": "DD", "c": "Jeg er imod en CO₂-afgift på landbruget. Og når man hører Jakob Ellemann sige, at man godt kan se en CO₂-afgift, så ved jeg jo godt, hvorfor der ikke var plads til mig i Venstre, siger Inger Støjberg.", "lt": 5, "lp": 0.91, "src": "TV 2 · 2022-10-30", "s": "Imod", "sc": -0.53}, {"p": "Inger Støjberg", "pa": "DD", "c": "Vi er imod en CO₂-afgift på landbruget. Og når jeg hører Jakob Ellemann stå og argumentere for en CO₂-afgift, så ved jeg jo godt, hvorfor der ikke var plads til mig i Venstre, fordi det er et af de steder, hvor vores makkerskab måtte skilles, sagde hun.", "lt": 5, "lp": 0.82, "src": "TV 2 · 2022-10-30", "s": "Imod", "sc": -0.95}, {"p": "Inger Støjberg", "pa": "DD", "c": "Ja, det er rigtigt, at Venstre har rykket sig på klimaområdet under mit lederskab.", "lt": 2, "lp": 0.58, "src": "TV 2 · 2022-10-30", "s": "Neutral", "sc": 0.04}, {"p": "Inger Støjberg", "pa": "DD", "c": "NEJ, nu da, råber Sofie Carsten Nielsen Video: Emil Eire Frerk Olsen Sofie Carsten Nielsen (R) og Morten Messerschmidt (DF) havnede under debatten om inflation i en diskussion om fjernvarme.", "lt": 1, "lp": 0.43, "src": "TV 2 · 2022-10-30", "s": "Imod", "sc": -0.4}, {"p": "Inger Støjberg", "pa": "DD", "c": "Hun står ved det, hun har gjort og ser pissegodt ud Stjæler vælgere fra Venstre Udover &quot;Løkke-effekten&quot; viser Megafon-målingen, at opbakningen til Moderaterne bunder i en kritik af de øvrige partier – særligt de partier, respondenterne stemte på ved sidste folketingsvalg i 2019.", "lt": 2, "lp": 0.59, "src": "TV 2 · 2022-10-30", "s": "Imod", "sc": -0.12}, {"p": "Inger Støjberg", "pa": "DD", "c": "Helt generelt er der en lidt lempeligere tilgang til udlændingepolitikken fra Venstre i dag, end der var, mens jeg var med. Og jeg ser også, at Venstre på en eller anden måde nærmer sig både De Radikale og Moderaterne, når det handler om udlændingepolitik og værdipolitik.", "lt": 1, "lp": 0.57, "src": "DR · 2022-10-31", "s": "Imod", "sc": -0.96}, {"p": "Inger Støjberg", "pa": "DD", "c": "Med al respekt kan det godt være, der er noget i posen til senere i den her valgkamp, svarede Støjberg.", "lt": 0, "lp": 0.17, "src": "DR · 2022-10-31", "s": "", "sc": NaN}, {"p": "Inger Støjberg", "pa": "DD", "c": "Det er simpelthen ikke korrekt, at Venstre bakker op om de fem prioriteter, jeg har sat op.", "lt": 2, "lp": 0.48, "src": "DR · 2022-10-31", "s": "Imod", "sc": -0.08}, {"p": "Inger Støjberg", "pa": "DD", "c": "Min bekymring er, at udlændingepolitikken kan ende med at blive lempet, hvis der, som nogle partier taler for, skal dannes en regering hen over midten.", "lt": 3, "lp": 0.43, "src": "DR · 2022-10-31", "s": "Imod", "sc": -0.99}, {"p": "Inger Støjberg", "pa": "DD", "c": "Ydelserne skal sænkes, vi skal have flere kriminelle udvist, og vi skal have et tørklædeforbud for piger i folkeskolen. Et sådant forbud støtter Venstre mig bekendt heller ikke.", "lt": 2, "lp": 0.72, "src": "DR · 2022-10-31", "s": "Neutral", "sc": -0.04}, {"p": "Inger Støjberg", "pa": "DD", "c": "Jeg synes, vi har leveret vores til den blå familie, det må jeg sige, lød det til journalisterne ude foran Christiansborgs trappe.", "lt": 0, "lp": 0.45, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.09}, {"p": "Inger Støjberg", "pa": "DD", "c": "Kære, kære venner. Så kom vi ind i Folketinget, siger Inger Støjberg.", "lt": 3, "lp": 0.58, "src": "DR · 2022-11-01", "s": "Neutral", "sc": 0.03}, {"p": "Inger Støjberg", "pa": "DD", "c": "Det er under ti måneder siden, at jeg blev smidt ud af Folketinget. Partiet er lige godt fire måneder gammelt, siger Inger Støjberg.", "lt": 0, "lp": 0.63, "src": "DR · 2022-11-01", "s": "Neutral", "sc": -0.05}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Jeg tror, det er fordi, Moderaterne insisterer på altid at tale om substansen og ikke personspørgsmål, lyder hans forklaring på de stigende målinger.", "lt": 1, "lp": 0.56, "src": "DR · 2022-10-16", "s": "Imod", "sc": -0.05}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Jeg tror, det vil være bedst for Danmark at få en regering over midten, og det vil et absolut rødt flertal selvfølgelig forhindre. Så det håber jeg ikke bliver en realitet, siger han.", "lt": 3, "lp": 0.71, "src": "DR · 2022-10-16", "s": "Imod", "sc": -0.94}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Man kan altid bruge mandater i Folketinget og omsætte dem til indflydelse. Ligegyldig hvilken konstellation der kommer efter valget, så vil Moderaterne arbejde hårdt for at nå det mål.", "lt": 3, "lp": 0.53, "src": "DR · 2022-10-16", "s": "For", "sc": 0.23}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Vi er glade for, at mange danskere synes, vores partiformand gør det rigtig godt, siger han.", "lt": 2, "lp": 0.79, "src": "DR · 2022-10-16", "s": "For", "sc": 0.34}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Nu er jeg jo ikke pressechef i Det Konservative Folkeparti, men hvis jeg var, vil jeg råde partiets politiske ordfører til at tale om partiets politik i stedet for at udlægge andres.", "lt": 4, "lp": 0.71, "src": "DR · 2022-10-22", "s": "Neutral", "sc": -0.0}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Moderaterne går til valg på at omsætte vores mandater til en bred regering henover midten, hvor partier fra både rød og blå blok deltager. En stemme på Moderaterne er derfor hverken en stemme på rød eller blå blok, men på et samarbejde hen over den politiske midte, siger Jakob Engel-Schmidt.", "lt": 0, "lp": 0.55, "src": "DR · 2022-10-22", "s": "Neutral", "sc": 0.0}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Jeg har et dybt hav inde i maven, der bare er i vildt oprør. Det føles rigtig, rigtig rart. Men omvendt der er meget langt til mål.", "lt": 4, "lp": 0.86, "src": "DR · 2022-10-22", "s": "Neutral", "sc": -0.01}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Det er utroligt dejligt, at så mange vælgere vil stemme på moderaterne. Personligt tror jeg, det har noget at gøre med, at vi er et af de eneste partier, der har fokuseret og insisteret på kun at tale om substansen, siger han.", "lt": 0, "lp": 0.83, "src": "DR · 2022-10-22", "s": "Neutral", "sc": -0.0}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Det lader til at være en fejltagelse, og det kommer vi også til at rette på DR efterfølgende. For man kan slet ikke forestille sig, at landbruget - som det eneste erhverv i Danmark - ikke også skal være med til at bidrage, siger Jakob Engel-Schmidt.", "lt": 0, "lp": 0.9, "src": "DR · 2022-10-25", "s": "Imod", "sc": -0.12}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Jeg tror egentlig ikke, det er et holdningsskifte, så meget som det er et udtryk for, at vi tilsyneladende skal kontrollere vores svar bedre, før vi sender dem ind til dr.dk. Vi er et lille parti. Da valgkampen gik i gang havde vi tre en halv medarbejder, men den fejl tager jeg på min kappe, siger han.", "lt": 1, "lp": 0.67, "src": "DR · 2022-10-25", "s": "Neutral", "sc": -0.0}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Ja, jeg kan sagtens forestille mig, at vi ender et sted, hvor man ude i forbrugerleddet kan se, at prisen også er en afspejling af, i hvor høj grad denne her fødevare i dens produktion og i dens tilblivelse belaster klimaet. Det synes jeg kun er fornuftigt, siger Jakob Engel-Schmidt.", "lt": 1, "lp": 0.62, "src": "DR · 2022-10-25", "s": "Neutral", "sc": -0.01}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Det er ikke sikkert, at det er de samme arbejdspladser, vi har om ti år, som vi har i dag. Men ambitionen er at have flere arbejdspladser i landbruget i fremtiden. For det er en vigtig del af det danske samfund og en vigtig del af vores økonomi, siger han.", "lt": 4, "lp": 0.6, "src": "DR · 2022-10-25", "s": "For", "sc": 0.47}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Vi kunne ikke drømme om at fremlægge en skatteplan, der gør helt almindelige mennesker fattigere. Jeg har noteret mig, at der er en faglig diskussion mellem forskellige tænketanke om, hvordan nogle af effekterne kommer til at påvirke økonomien, og viser det sig, at der er behov for at justere vores skatteplan, så gør vi selvfølgelig det, siger Jakob Engel-Schmidt.", "lt": 0, "lp": 0.73, "src": "DR · 2022-10-26", "s": "Imod", "sc": -0.15}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Ifølge Kraka gør den her plan Danmark markant rigere i 2030. Ifølge Cepos er det noget andet. Der er en faglig diskussion, og hvor den ender henne, det må Kraka og Cepos debattere færdig, siger Jakob Engel-Schmidt.", "lt": 0, "lp": 0.45, "src": "DR · 2022-10-26", "s": "Neutral", "sc": 0.03}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Beregningerne fra Cepos tager ikke højde for de overenskomster, der ligger til grund for løndannelsen for de grupper man har regnet på, hvorfor resultaterne fra Cepos mere må betragtes som gætværk end fakta.", "lt": 4, "lp": 0.83, "src": "DR · 2022-10-26", "s": "Imod", "sc": -0.34}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "I virkeligheden er det lige meget, om du lægger en skat på lønsummen, som virksomheden betaler, eller du lader lønmodtageren betale den direkte. Den her lønsumsafgift gør, at det bliver dyrere at ansætte folk. Derfor vil virksomhederne være mere tilbageholdende med at ansætte folk, og det presser lønningerne ned over tid.", "lt": 0, "lp": 0.92, "src": "DR · 2022-10-26", "s": "Imod", "sc": -0.08}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Jo, hvis det viser sig at være realiteten og det, der kommer ud af vores plan, så jo. Men det er jeg helt sikker på, at det ikke er.", "lt": 4, "lp": 0.79, "src": "DR · 2022-10-26", "s": "Imod", "sc": -0.18}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Viser det sig, at vores skatteplan har behov for at blive justeret, så gør vi naturligvis det. Vi er et parti, der altid lytter til gode input, og vi er klar til at blive klogere, siger Jakob Engel-Schmidt.", "lt": 0, "lp": 0.69, "src": "DR · 2022-10-26", "s": "Neutral", "sc": 0.0}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Som jeg sagde før, så kunne vi ikke drømme om at fremlægge en skatteplan, der gør helt almindelige mennesker fattigere. Den gør alle mennesker rigere i Danmark i hvert fald i 2030, siger Jakob Engel-Schmidt, der specifikt i forhold til sygeplejerskerne fremhæver Moderaternes forslag om at give dem 2.500 kroner ekstra om måneden for gå på fuldtid i 2023.", "lt": 0, "lp": 0.64, "src": "DR · 2022-10-26", "s": "Imod", "sc": -0.08}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Jeg tænker, at jeg som politisk chef ofte er den, man henviser til lige meget hvad. Og det er også rigtigt, at vi siger til vores kandidater, at når det kommer til de her kandidattests, så kan det godt betale sig lige at spørge tv-stationerne, hvad det handler om, fordi de (kandidattestene, red.) jo er så håbløst unuancerede, siger Jakob Engel-Schmidt og tilføjer:", "lt": 4, "lp": 0.42, "src": "TV 2 · 2022-10-26", "s": "Neutral", "sc": -0.02}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Du er meget velkommen til at stille mig et spørgsmål, der handler om politisk substans.", "lt": 1, "lp": 0.39, "src": "TV 2 · 2022-10-26", "s": "", "sc": NaN}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Det er da, fordi spørgsmålet er så unuanceret, siger Jakob Engel-Schmidt og gentager, at TV 2 Fyns journalist er &quot;mere end velkommen&quot; til at stille spørgsmål til den politiske substans.", "lt": 0, "lp": 0.54, "src": "TV 2 · 2022-10-26", "s": "Neutral", "sc": -0.02}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Vi har lagt en plan frem, som gør Danmark 20 milliarder kroner rigere og skaber 20.000 jobs.", "lt": 0, "lp": 0.65, "src": "TV 2 · 2022-10-26", "s": "For", "sc": 0.21}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "I en situation, hvor vi er udsat for en historisk skræmmekampagne fra Socialdemokratiet, kritik fra blå blok, der mener vi er røde, og kritik fra rød blok, der mener, at vi er blå, der håber jeg, at vælgerne vil lytte til den substans, vi fremlægger, siger han.", "lt": 0, "lp": 0.94, "src": "DR · 2022-10-30", "s": "Imod", "sc": -0.13}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Moderaterne har ikke haft et folketingsvalg, så vi ved ikke, hvad fremgang eller tilbagegang er. Jeg vil arbejde hårdt for, at vi får det bedst mulige valgresultat.", "lt": 3, "lp": 0.44, "src": "DR · 2022-10-30", "s": "Neutral", "sc": -0.04}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Vi går mere op i at tale om os selv end andres politik, siger Jakob Engel-Schmidt.", "lt": 0, "lp": 0.79, "src": "DR · 2022-10-30", "s": "Neutral", "sc": -0.04}, {"p": "Jakob Engel-Schmidt", "pa": "M", "c": "Vi vil bruge mandaterne til at danne en bred regering henover midten med de partier, som nu vil være med. Det er vigtigere for os at få gennemført vores politik, end hvem der skal være statsminister, siger Jakob Engel-Schmidt.", "lt": 3, "lp": 0.64, "src": "DR · 2022-10-30", "s": "For", "sc": 1.0}, {"p": "Jens Henrik Thulesen Dahl", "pa": "DD", "c": "Jo, men det må de altså leve med. Nu er der udskrevet et Folketingsvalg, og det kan jo have rigtig mange udkommer. Der er mange, der må vente på at få resultaterne af valget. Sådan er verden jo lige nu, siger Jens Henrik Thulesen Dahl, der er Danmarksdemokraternes medlem af Uddannelses- og Forskningsudvalget.", "lt": 4, "lp": 0.5, "src": "DR · 2022-10-12", "s": "Neutral", "sc": -0.01}, {"p": "Jens Henrik Thulesen Dahl", "pa": "DD", "c": "Det kan jeg jo ikke, inden ekspertgruppen har et overblik over, hvad der er konsekvenserne ved aftalen er.", "lt": 2, "lp": 0.72, "src": "DR · 2022-10-12", "s": "Neutral", "sc": 0.02}, {"p": "Jens Henrik Thulesen Dahl", "pa": "DD", "c": "Ikke Danmarksdemokraterne, siger Jens Henrik Thulesen Dahl.", "lt": 1, "lp": 0.58, "src": "DR · 2022-10-12", "s": "Neutral", "sc": -0.02}, {"p": "Jens Henrik Thulesen Dahl", "pa": "DD", "c": "Jamen, vi er jo slet ikke med i aftalen, så jeg mener sådan set ikke, at vi kan være bundet op af noget.", "lt": 4, "lp": 0.39, "src": "DR · 2022-10-12", "s": "", "sc": NaN}, {"p": "Jeppe Bruus", "pa": "S", "c": "Selv hvis man skraber de økonomiske konsekvenser fra, så er der en udfordring i, hvor hurtigt man kan gøre det. Selv hvis vi politisk vedtager det, vil det tage nogle år at få gennemført, siger Jeppe Bruus (S).", "lt": 4, "lp": 0.83, "src": "DR · 2022-10-06", "s": "Imod", "sc": -0.12}, {"p": "Jesper Petersen", "pa": "S", "c": "På mit område har vi foreslået et maks på 10 som adgangskrav for at komme ind på en videregående uddannelse. Det ønsker vi for at skabe en sundere læringskultur og mindske det karakterræs, der er på rigtig mange uddannelser, siger Jesper Petersen.", "lt": 1, "lp": 0.88, "src": "DR · 2022-10-10", "s": "For", "sc": 0.31}, {"p": "Jesper Petersen", "pa": "S", "c": "Vi skal give en chance til de unge, der ikke fik de bedste karakterer i gymnasiet, men som alligevel er egnet til de forskellige uddannelser. Derfor skal vi øge andelen af optag på kvote 2 på de videregående uddannelser.", "lt": 5, "lp": 0.86, "src": "DR · 2022-10-10", "s": "For", "sc": 0.32}, {"p": "Jesper Petersen", "pa": "S", "c": "Et af de steder, man får flest fællesskaber, er i foreningslivet. Foreningslivet har haft trange kår efter folkeskolereformen. Derfor ønsker vi at afskaffe folkeskolereformen og heldagsskolen for at skabe kortere dage og give plads til foreningsfællesskabet.", "lt": 1, "lp": 0.88, "src": "DR · 2022-10-10", "s": "Neutral", "sc": -0.03}, {"p": "Jesper Petersen", "pa": "S", "c": "Jeg synes, at det er dybt utroværdigt og meget problematisk, hvis de mandater, der er bag denne her aftale, ikke står ved den, bare fordi de nu er i et nyt parti, siger han.", "lt": 3, "lp": 0.83, "src": "DR · 2022-10-12", "s": "Imod", "sc": -0.51}, {"p": "Jesper Petersen", "pa": "S", "c": "Lad mig gøre det helt klart, at det taxameter skal blive på det forhøjede niveau. Så bliver det ikke gennem denne her aftale, fordi borgerlige partier ikke bakker op eller andre springer fra, så vil vi gå andre veje for at finansiere det forslag, lyder det fra Uddannelses- og forskningsministeren.", "lt": 2, "lp": 0.89, "src": "DR · 2022-10-12", "s": "Neutral", "sc": -0.04}, {"p": "Jesper Petersen", "pa": "S", "c": "Jeg gjorde ikke noget for at sætte en ny aftale i søen, men det er vores ønske at beholde og permanentgøre taxameterløftet. Og vi er klar til at sikre det ved at gå andre veje, afslutter Jesper Petersen.", "lt": 2, "lp": 0.88, "src": "DR · 2022-10-12", "s": "Neutral", "sc": 0.04}, {"p": "Kaare Dybvad Bek", "pa": "S", "c": "Jeg forstår godt, at de her enkeltsager vækker følelser, og at man kan have stor sympati for udlændinge, der ønsker at leve i Danmark. Men vi er helt inde i kernen af dansk udlændingepolitik: Når man er her som flygtning, så er man her midlertidigt. Og det gælder uanset, om man er ledig, i arbejde, under uddannelse eller pensioneret, for alle er lige for loven.", "lt": 1, "lp": 0.71, "src": "DR · 2022-10-12", "s": "For", "sc": 0.57}, {"p": "Karsten Hønge", "pa": "SF", "c": "Jeg er noget skeptisk. Jeg er bange for, at vi laver en overspringshandling i stedet for at løse det, der er hovedproblemet. Nemlig at vi ikke har en værdig ældrepleje, siger SF&#x27;eren, der hellere vil se på løn og arbejdsforhold for de ansatte i ældreplejen end at inddrage de pårørende.", "lt": 1, "lp": 0.9, "src": "DR · 2022-10-11", "s": "Imod", "sc": -0.18}, {"p": "Karsten Hønge", "pa": "SF", "c": "Så får vi nogle pårørende til at udføre en opgave, som vi burde have professionelt personale til. Vi risikerer, at det her kører i grøften, og det mere ender med at blive en øvelse i at spare, siger Karsten Hønge.", "lt": 1, "lp": 0.43, "src": "DR · 2022-10-11", "s": "For", "sc": 0.06}, {"p": "Karsten Hønge", "pa": "SF", "c": "Det er et skråplan, og vi skal passe på med, at vi ikke skubber til balancen. Det kan hurtigt blive sådan, at så indgår pårørende nærmest i det daglige skema. Det skal nødigt være sådan, at de føler sig presset af, at det så er op til dem, og ellers så bliver der bare ikke støvsuget.", "lt": 4, "lp": 0.83, "src": "DR · 2022-10-11", "s": "For", "sc": 0.26}, {"p": "Karsten Hønge", "pa": "SF", "c": "Det er både et spørgsmål om at finde pengene, men det er især også et spørgsmål om at finde det personale, der skal udfylde de roller. Jeg ser et scenarie, hvor selvom vi måtte have pengene, så har vi simpelthen ikke personaleresourcerne til at løse det, siger han.", "lt": 5, "lp": 0.65, "src": "DR · 2022-10-11", "s": "Neutral", "sc": 0.04}, {"p": "Karsten Hønge", "pa": "SF", "c": "Der er rigtig mange Sosu-assistenter, Sosu-hjælpere og sygehjælpere, der nærmer sig pensionsalderen, mens der er færre og færre unge, der søger ind på de uddannelser.", "lt": 5, "lp": 0.79, "src": "DR · 2022-10-11", "s": "Neutral", "sc": 0.0}, {"p": "Karsten Hønge", "pa": "SF", "c": "De fattige pensionister får med grovfilen, som åbenbart skal slibe folkepensionen væk. Nu er Liberalist-Løkke tilbage – og jeg har ikke savnet ham, siger han til Ritzau.", "lt": 2, "lp": 0.58, "src": "TV 2 · 2022-10-27", "s": "For", "sc": 0.15}, {"p": "Karsten Hønge", "pa": "SF", "c": "Det er ikke, fordi jeg ikke synes, at sygeplejerskerne skal have mere løn i dag. Men vi fik flyttet debatten til noget, der var mere fremtidsorienteret, siger hun.", "lt": 1, "lp": 0.72, "src": "TV 2 · 2022-10-27", "s": "Imod", "sc": -0.42}, {"p": "Karsten Hønge", "pa": "SF", "c": "Det var rart at høre dem tale om løsninger på tværs af partierne.", "lt": 0, "lp": 0.29, "src": "TV 2 · 2022-10-27", "s": "", "sc": NaN}, {"p": "Karsten Hønge", "pa": "SF", "c": "Jeg er overordnet skuffet, siger hun til TV 2, da hun bagefter har taget sit overtøj på.", "lt": 3, "lp": 0.72, "src": "TV 2 · 2022-10-27", "s": "Imod", "sc": -0.1}, {"p": "Karsten Hønge", "pa": "SF", "c": "Men det bliver jo netop dyrt, hvis vi ikke gør det. Han er så bange for at pille ved status quo-politikken. Eksempelvis landbruget, siger hun.", "lt": 0, "lp": 0.86, "src": "TV 2 · 2022-10-27", "s": "Imod", "sc": -0.1}, {"p": "Katrine Robsøe", "pa": "RV", "c": "Vi har så mange dygtige kandidater opstillet – også folk, der ikke sidder på Christiansborg på nuværende tidspunkt. Hvem der bliver valgt, det må være op til danskerne, siger Katrine Robsøe.", "lt": 2, "lp": 0.88, "src": "TV 2 · 2022-10-06", "s": "For", "sc": 0.14}, {"p": "Katrine Robsøe", "pa": "RV", "c": "Meningsmålinger går op og ned, og jeg har en ret stor tiltro til, at når vi rammer valgdagen, har vi fået snakket en masse politik. Hun vil særligt have fokus på klimaområdet, unges trivsel og uddannelse, fortæller hun.", "lt": 1, "lp": 0.88, "src": "TV 2 · 2022-10-06", "s": "Imod", "sc": -0.12}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det er sådan en lidt lang valgkamp, og det er fint. Personligt er jeg mere til det lange seje træk end den hurtige sprint, så det glæder jeg mig til.", "lt": 4, "lp": 0.72, "src": "DR · 2022-10-05", "s": "Neutral", "sc": 0.0}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Alle politikere, der vil noget, vil gerne være statsminister. Men med de tre-fem procent, som Moderaterne nok ender med, så bliver det svært. Men man skal aldrig dømme Lars Løkke ude, lyder det fra Steffen Hjaltelin.", "lt": 1, "lp": 0.55, "src": "DR · 2022-10-05", "s": "Imod", "sc": -0.11}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Nu står vi så og snakker om, at broen skal bygges inden for den blå blok, og Søren Pape er allerede ved at opgive sine mærkesager for at holde sig varm over til Statsministeriet, sagde Lars Løkke Rasmussen.", "lt": 5, "lp": 0.89, "src": "DR · 2022-10-05", "s": "Imod", "sc": -0.06}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det her er en utilsigtet sidegevinst ved en stram udlændingepolitik. Så uden at blive beskyldt for at være halal-hippie, bliver vi nødt til allesammen at arbejde på at få fjernet tåbelighederne.", "lt": 1, "lp": 0.86, "src": "DR · 2022-10-11", "s": "For", "sc": 0.62}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det er jo grundlæggende en fornuftig tanke, at man skal være her så længe, der er basis for, at man er forfulgt. Derfor skal vi have en stram og fair udlændingepolitik, men den skal også være fornuftig. Den må ikke være dum. Og det her er dumt.", "lt": 1, "lp": 0.72, "src": "DR · 2022-10-11", "s": "For", "sc": 0.99}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det er tudetosset, at vi i Danmark fører en udlændingepolitik, hvor det er rigtig svært at få lov til at komme til Danmark eller blive i Danmark, hvis man arbejder, mens nogle gange kan vi ikke sende folk ud, selvom de er dybt kriminelle, og tydeligvis ikke burde være her.", "lt": 1, "lp": 0.9, "src": "DR · 2022-10-11", "s": "For", "sc": 0.63}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Jeg forstår godt, at de her enkeltsager vækker følelser, og at man kan have stor sympati for udlændinge, der ønsker at leve i Danmark. Men vi er helt inde i kernen af dansk udlændingepolitik: Når man er her som flygtning, så er man her midlertidigt. Og det gælder uanset, om man er ledig, i arbejde, under uddannelse eller pensioneret, for alle er lige for loven.", "lt": 1, "lp": 0.71, "src": "DR · 2022-10-11", "s": "For", "sc": 0.57}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Før afgørelsen havde vi en masse planer, men dem har jeg ikke energi til at tænke over. Jeg har stress hver dag, og jeg har svært ved at sove om natten, siger hun og forsøger at finde ro i skufferne med babytøj.", "lt": 1, "lp": 0.65, "src": "DR · 2022-10-11", "s": "Neutral", "sc": 0.02}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Hvis du er rejst ind på en flygtningebillet, så er udgangspunktet selvfølgelig, at du ikke skal være her, når du ikke længere er flygtning i lovens forstand. Men hvis du er godt i gang med at konventere til en billet, der hedder: &quot;Jeg vil gerne Danmark. Jeg vil gerne lukke et hul i jeres arbejdsmarked&quot;, så skal du have mulighed for at blive her.", "lt": 0, "lp": 0.88, "src": "DR · 2022-10-12", "s": "Imod", "sc": -0.06}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det bliver jeg selv mødt med. Til det vil jeg sige, at man lever livet dårligt, hvis man ikke tager læring af det.", "lt": 1, "lp": 0.72, "src": "DR · 2022-10-12", "s": "For", "sc": 0.13}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Vi skal finde en måde at gøre det på, uden at vi gambler med den overordnede stramme udlændingepolitik. Grundlæggende er det en god idé at have en stram udlændingepolitik, men det er gået for vidt.", "lt": 1, "lp": 0.88, "src": "DR · 2022-10-12", "s": "For", "sc": 0.93}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "I de her tilfælde, hvor der er nogle syriske flygtninge, der ikke længere har et beskyttelsesbehov, men som tjener deres egne penge eller er under uddannelse - ja, de skal selvfølgelig have bedre mulighed for at blive her på en arbejdsopholdstilladelse.", "lt": 5, "lp": 0.83, "src": "DR · 2022-10-12", "s": "For", "sc": 0.44}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Vi står og mangler arbejdskraft i Danmark, og så sender vi gudhjælpemig arbejdskraft ud af landet, siger han.", "lt": 5, "lp": 0.88, "src": "DR · 2022-10-12", "s": "Neutral", "sc": 0.02}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Jeg er ikke enig i det forslag, og det vil også medføre det praktiske problem, at vores ældreomsorg, som i forvejen er i knæ, vil komme endnu mere i knæ, siger Lars Løkke Rasmussen.", "lt": 2, "lp": 0.79, "src": "DR · 2022-10-12", "s": "Imod", "sc": -0.12}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "De er en del af vores samfund, de yder en stor indsats i vores hjemmepleje, og dem skal man selvfølgelig ikke kunne sige nej til, siger Lars Løkke Rasmussen.", "lt": 3, "lp": 0.72, "src": "DR · 2022-10-12", "s": "For", "sc": 0.5}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Vi forholder os til, hvordan verden ser ud nu, sagde Lars Løkke Rasmussen på pressemødet på Christiansborg.", "lt": 4, "lp": 0.79, "src": "DR · 2022-10-14", "s": "Neutral", "sc": 0.03}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Der er en personaleflugt. Hver anden stilling, der slås op, bliver ikke besat. Sundhedsvæsnet er sandet til, sagde Lars Løkke Rasmussen.", "lt": 0, "lp": 0.17, "src": "DR · 2022-10-14", "s": "", "sc": NaN}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Man er nødt til at stoppe blødningerne, før man kan begynde at operere, sagde Lars Løkke Rasmussen.", "lt": 2, "lp": 0.72, "src": "DR · 2022-10-14", "s": "For", "sc": 0.31}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det vil muliggøre, at man kan give et tillæg på 2.500 kroner om måneden til alle professionsuddannede sundhedsfaglige medarbejdere, sagde Lars Løkke Rasmussen.", "lt": 0, "lp": 0.79, "src": "DR · 2022-10-14", "s": "For", "sc": 0.13}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Men jeg kan ikke forestille mig, vi kan finde på at støtte en regering, hvis den ikke i sit arbejdsprogram har et &quot;vi er nødt til at gøre noget nu&quot; for at genoprette det danske sundhedsvæsen, siger Lars Løkke Rasmussen.", "lt": 2, "lp": 0.5, "src": "DR · 2022-10-14", "s": "For", "sc": 0.07}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det er, ligesom når man får en patient ind på traumeafdelingen. Man er nødt til at stoppe blødningerne, før man begynder at operere. Sundhedsvæsenet er sygt. Nu handler det om at stoppe blødningerne, siger Lars Løkke Rasmussen.", "lt": 1, "lp": 0.54, "src": "TV 2 · 2022-10-14", "s": "For", "sc": 0.19}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det her er det mest konkrete og pragmatiske forslag, jeg har set lagt frem i den her valgkamp.", "lt": 0, "lp": 0.79, "src": "TV 2 · 2022-10-14", "s": "For", "sc": 0.05}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Indtil vi får skuden rettet op igen. Der ligger en vigtig personalemæssig ressource her, siger Lars Løkke.", "lt": 3, "lp": 0.79, "src": "TV 2 · 2022-10-14", "s": "Neutral", "sc": 0.02}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det duer simpelthen ikke i en situation, hvor det hele er ved at sande til, siger han.", "lt": 5, "lp": 0.72, "src": "TV 2 · 2022-10-14", "s": "Imod", "sc": -0.33}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det her er vigtigere end en ny tandlægehøjskole i Hjørring, siger partiformanden.", "lt": 4, "lp": 0.72, "src": "TV 2 · 2022-10-14", "s": "For", "sc": 0.1}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Men aktuelt er den udhulet, for det hele ligger i ruiner. Når jeg foreslår det her, så er det fordi, det er nødvendigt, og fordi vi gerne vil rette op, siger Lars Løkke.", "lt": 3, "lp": 0.83, "src": "TV 2 · 2022-10-14", "s": "Neutral", "sc": -0.04}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Lars Løkke har selv udtalt, at hvis andre ikke vil, så er han ikke afvisende over for det. Men han siger også, at sandsynligheden er 0,0001 procent. Det synes jeg er et meget rammende citat.", "lt": 2, "lp": 0.72, "src": "DR · 2022-10-16", "s": "Neutral", "sc": 0.01}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Jeg kan meget dårligt udtale mig om Lars Løkkes hedeste drømme. Vi arbejder tæt sammen, men primært om dansk politik, siger han.", "lt": 4, "lp": 0.72, "src": "DR · 2022-10-16", "s": "Neutral", "sc": 0.0}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Vores sundhedsvæsen er på vej ned i en negativ spiral, og derfor synes vi, at vi skal afskaffe behandlingsgarantien i hele 2023. På den måde kan vi give plads til forhåbentlig at få sundhedsvæsenet på fode igen. Og så kan garantien på 30 dage for alle genindføres, men hvor vi rent faktisk til leve op til den igen, siger han.", "lt": 2, "lp": 0.62, "src": "DR · 2022-10-18", "s": "Neutral", "sc": 0.01}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Jeg er ikke med på at fjerne behandlingsgarantien. Den er en motor ind i systemet, der sikrer, at vi bruger al kapacitet både i det offentlige og i det private. Det offentlifge står for cirka 90 procent.", "lt": 3, "lp": 0.91, "src": "DR · 2022-10-18", "s": "For", "sc": 0.1}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Men den mest troværdige er Lars Løkke, understregede han til valgmødet mandag aften.", "lt": 1, "lp": 0.58, "src": "TV 2 · 2022-10-18", "s": "Neutral", "sc": 0.04}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Jeg vil tro, at for alle partiledere ville det være mærkeligt, at de sagde nej, hvis de fik muligheden.", "lt": 3, "lp": 0.79, "src": "TV 2 · 2022-10-18", "s": "Imod", "sc": -0.11}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Jeg synes ikke, de svarede på det. Der er mange ting, de ikke lige er helt klare på endnu. Men de er jo også nye, tilføjede hun.", "lt": 5, "lp": 0.58, "src": "TV 2 · 2022-10-18", "s": "Imod", "sc": -0.08}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Jeg synes, det er så svært. Jeg må tage til lidt flere vælgermøder, lød det opgivende.", "lt": 1, "lp": 0.72, "src": "TV 2 · 2022-10-18", "s": "For", "sc": 0.24}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det (smykkeloven, tildækningsforbud og krav om håndtryk, red.) er i virkeligheden også symboler, som ikke flytter noget, siger formanden for Moderaterne, Lars Løkke Rasmussen.", "lt": 4, "lp": 0.5, "src": "DR · 2022-10-25", "s": "Neutral", "sc": -0.0}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Så vores unge indgår i forpligtende fællesskaber med andre unge, som har et helt andet afsæt end dem selv, en anden opvækst, og snuser til hjørner af vores fælles samfund, som de ellers ikke ville opleve, sagde han dengang.", "lt": 4, "lp": 0.69, "src": "DR · 2022-10-25", "s": "For", "sc": 0.9}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det siger jo også alt om Lars Løkkes skatteplan, at man laver en plan, hvor den almindelige sygeplejerske eller den almindelige metalarbejder mister et sted mellem 5-6.000 kroner, mens direktøren ender med at få sig en skattelettelse på 40.000 kroner.", "lt": 0, "lp": 0.56, "src": "DR · 2022-10-26", "s": "Imod", "sc": -0.18}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Så ved jeg godt, at der har været et skatteudspil, som er blevet diskuteret. Men skatteudspillet er i sin form ment som at give både i top og i bund, siger han.", "lt": 0, "lp": 0.83, "src": "TV 2 · 2022-10-26", "s": "For", "sc": 0.11}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Vi synes, at man skulle begynde at tage nogle drøftelser med arbejdsmarkedets parter og helt åbent diskutere, hvordan man sørger for, at vores velfærdssamfund er robust - også om 20, 30 og 40 år.", "lt": 5, "lp": 0.9, "src": "DR · 2022-10-28", "s": "For", "sc": 0.15}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Der tror jeg godt, man kan få noget interesse for de tanker, vi har, sagde partiformanden, der også sagde, at pensionister i dag og de, der nærmer sig pensionsalderen, ikke kommer til at blive påvirket.", "lt": 2, "lp": 0.83, "src": "DR · 2022-10-28", "s": "Neutral", "sc": 0.01}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Derfor er det faktisk et modigt forslag, fordi der stort set ikke er nogen af dagens vælgere, der får positive gevinster, siger økonomen.", "lt": 0, "lp": 0.54, "src": "DR · 2022-10-28", "s": "Neutral", "sc": -0.0}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "I princippet kunne man godt lave nogle skattenedsættelser, der modvirker den her ulighed - for eksempel ved at give skattelettelser i bunden. Men det kommer an på, hvordan man designer det.", "lt": 0, "lp": 0.79, "src": "DR · 2022-10-28", "s": "For", "sc": 0.23}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Men vi synes, at vi skulle begynde at tage en debat om, hvordan vi får det her til at hænge sammen, når mine ufødte børnebørn bliver gamle, siger han.", "lt": 5, "lp": 0.63, "src": "DR · 2022-10-28", "s": "Neutral", "sc": -0.01}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Jeg synes, at det bliver en vitaminfattig valgkamp, hvis der ikke er nogen, der også tør tale om ikke bare de næste fire år – for det har ikke noget med de næste fire at gøre - men hvad skal der ske med det her land, hvis vi ser en generation frem, siger han.", "lt": 0, "lp": 0.73, "src": "DR · 2022-10-28", "s": "Neutral", "sc": -0.0}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Vi mener, at hjælp i hjemmet og ældrepleje skal være en rettighed, man sparer op til, og som ikke kan blive offer for politiske sparerunder, skriver partiet.", "lt": 5, "lp": 0.79, "src": "DR · 2022-10-28", "s": "Imod", "sc": -0.87}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Altså, vi går efter at gennemføre vores politik, og som vi har sagt gennem hele valgkampen, så er det vigtigere for os at få gennemført vores politiske mærkesager, end hvem der sidder for bordenden i Statsministeriet.", "lt": 4, "lp": 0.5, "src": "DR · 2022-10-30", "s": "For", "sc": 0.25}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Derfor bare et håb til Lars Løkke: Hvis du skal have de ting, du drømmer om, og som jo er groet i vores fælles, tidligere baghave – så kom dog hjem.", "lt": 5, "lp": 0.39, "src": "TV 2 · 2022-10-30", "s": "", "sc": NaN}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Han er en gammel, garvet rotte, ham kan jeg godt lide.", "lt": 4, "lp": 0.58, "src": "TV 2 · 2022-10-30", "s": "Neutral", "sc": 0.03}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Vi er simpelthen nødt til at organisere vores sygehusvæsen anderledes, sagde den tidligere statsminister.", "lt": 3, "lp": 0.32, "src": "DR · 2022-10-31", "s": "", "sc": NaN}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Jeg tror egentlig godt, Lars, at du og jeg kan blive enige om meget af en strukturreform på sundhedsområdet. Hvis bare vi husker nærheden og ikke kun centraliserer.", "lt": 2, "lp": 0.79, "src": "DR · 2022-10-31", "s": "Neutral", "sc": 0.0}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Men hvis ikke vi har viljen til også at gøre forholdene bedre for vores dygtige medarbejdere, så kan vi simpelthen ikke drive et sundhedsvæsen i fremtiden, sagde hun og henviste til Socialdemokratiets forslag om at afsætte en pulje på tre milliarder kroner, der skal øge lønningerne for offentligt ansatte.", "lt": 5, "lp": 0.94, "src": "DR · 2022-10-31", "s": "For", "sc": 0.05}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Jeg står her og efterlyser... Hvad var det egentlig, statsministeren mente, da hun sagde, hun nok kunne blive enig med mig om nogle strukturændringer?", "lt": 3, "lp": 0.52, "src": "DR · 2022-10-31", "s": "Imod", "sc": -0.25}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Nu siger statsministeren her i dag, at der er brug for nogle strukturændringer, og det kan vi nok finde ud af.", "lt": 4, "lp": 0.79, "src": "DR · 2022-10-31", "s": "For", "sc": 0.13}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Der er det da interessant at finde ud af, om det er det her, hun er enig med mig i, lød det fra Lars Løkke Rasmussen, da han forlod DR&#x27;s Koncerthus, hvor debatten havde fundet sted.", "lt": 1, "lp": 0.88, "src": "DR · 2022-10-31", "s": "Neutral", "sc": -0.04}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Der blev spidset ører, da Mette Frederiksen i forbindelse med sundhedsdebatten pludselig sagde, at hun var parat til strukturændringer på sundhedsområdet – sammen med netop Lars Løkke Rasmussen, der jo lægger op til meget store ændringer. Han vil eksempelvis nedlægge regionerne.", "lt": 0, "lp": 0.58, "src": "DR · 2022-10-31", "s": "Imod", "sc": -0.07}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Så vidt er statsminister Mette Frederiksen dog ikke klar til at gå. Det sagde hun efter debatten.", "lt": 3, "lp": 0.54, "src": "DR · 2022-10-31", "s": "Imod", "sc": -0.13}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Vores sygehusvæsen er i frit fald. Det kan man ikke løse bare med flere penge eller et løntillæg, siger Moderaternes formand, Lars Løkke.", "lt": 1, "lp": 0.86, "src": "TV 2 · 2022-10-31", "s": "Imod", "sc": -0.24}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det er en hjørnesten i vores velfærdssamfund, at vi har fri og lige og gratis adgang til god sygdomsbehandling.", "lt": 1, "lp": 0.72, "src": "TV 2 · 2022-10-31", "s": "Neutral", "sc": -0.05}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det varierer jo fra region til region, hvor hurtigt ambulancen kommer. Dine overlevelseschancer er ikke ens i hele landet, hvis du for eksempel får en blodprop i hjernen. Et lille land som Danmark burde have et mere ensartet sygehusvæsen, siger Lars Løkke.", "lt": 4, "lp": 0.83, "src": "TV 2 · 2022-10-31", "s": "For", "sc": 0.22}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Vi har et su-system, som vi har indrettet på en sådan måde, at vi ikke tåler, at unge udlændinge får lov at bruge det.", "lt": 4, "lp": 0.79, "src": "TV 2 · 2022-10-31", "s": "Imod", "sc": -0.4}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Vi har brug for en skattereform, fordi vi har brug for at få nogle flere hænder ud på arbejdsmarkedet, og vi har brug for at få nogle andre rammevilkår for vores virksomheder. Reform af de borgernære institutioner som skoler, plejehjem og daginstitutioner Lars Løkke begrunder reformforslaget med, at &quot;den offentlige sektor er ved at sande til&quot;. Han nævner TV 2s udsendelser fra nogle af landets plejehjem (&#x27; Plejehjemmene bag facaden &#x27; og &#x27; Opråb fra plejehjemmet &#x27;, red.), der viser, at det ikke fungerer lige godt alle steder. Et problem, der vil vokse i takt med, at der kommer flere ældre og færre på arbejdsmarkedet til at tage sig af dem. Venstre har en lang række forslag til reformer, lyder det fra partiets finansordfører, Troels Lund Poulsen.", "lt": 4, "lp": 0.96, "src": "TV 2 · 2022-10-31", "s": "Neutral", "sc": 0.0}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Hvem der skal sidde for bordenden i den regering, det kan man ikke svare på i aften. Der er alt for meget fokus på den bordende, siger Lars Løkke Rasmussen.", "lt": 3, "lp": 0.83, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.26}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Om hun eller en anden skal have dem igen beror på, om man i den kommende tid kan finde sig til rette om et bredt regeringsprogram, der bringer Danmark videre,siger han.", "lt": 3, "lp": 0.83, "src": "DR · 2022-11-01", "s": "For", "sc": 0.97}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Det betyder, at han vil have en dronningrunde for, at der kan komme forhandlinger om en ny regeringsdannelse, siger Ringberg.", "lt": 5, "lp": 0.72, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.07}, {"p": "Lars Løkke Rasmussen", "pa": "M", "c": "Mette Frederiksen har kørt et kæmpe comeback, og det er et meget stort tilvalg af hende som statsminister og Socialdemokratiet.", "lt": 4, "lp": 0.51, "src": "DR · 2022-11-01", "s": "For", "sc": 0.31}, {"p": "Lasse Haugaard Pedersen", "pa": "S", "c": "De her ting skal der simpelthen bare være styr på. Jeg blev chokeret, da jeg opdagede det. Lige nu er jeg vred og skuffet, siger Lasse Haugaard Pedersen, der ikke er afklaret med, hvad han har tænkt sig at gøre, når stemmerne er talt op.", "lt": 3, "lp": 0.28, "src": "DR · 2022-11-01", "s": "", "sc": NaN}, {"p": "Lasse Haugaard Pedersen", "pa": "S", "c": "Jeg tror ikke, det er farbart, at det er mig, der skal fortælle, hvad der skal ske med valget. Jeg kan umuligt være en objektiv part i det her. Jeg har knoklet fra morgen til aften i, ja, jeg ved snart ikke hvor mange uger. Vi må have nogle eksperter på banen. Folk med forstand på valgret og vælgeradfærd og på, hvilken betydning det her har.", "lt": 5, "lp": 0.88, "src": "DR · 2022-11-01", "s": "Imod", "sc": -0.08}, {"p": "Lasse Haugaard Pedersen", "pa": "S", "c": "Det er noget administrativt sjusk og sløseri, og det er ærgerligt, at det skal skabe usikkerhed for os kandidater og borgerne i kommunen, siger Lasse Haugaard Pedersen, der er spidskandidat for Socialdemokratiet i valgkredsen for de to kommuner.", "lt": 2, "lp": 0.9, "src": "TV 2 · 2022-11-01", "s": "Imod", "sc": -0.11}, {"p": "Lasse Haugaard Pedersen", "pa": "S", "c": "Det er en øv-fejl. Det er virkelig træls, siger hun til TV 2 Fyn .", "lt": 4, "lp": 0.72, "src": "TV 2 · 2022-11-01", "s": "Imod", "sc": -0.38}, {"p": "Lea Wermelin", "pa": "S", "c": "Det er vigtigt også for vores tryghed, at vi understreger, at der ikke er en direkte trussel mod os bornholmere eller Danmark. Men det ændrer ikke på, at vi skal sørge for, at vi også bidrager til det Nato-samarbejde, der er, til sikkerheden for hele Danmark og Bornholm, siger Lea Wermelin (S).", "lt": 3, "lp": 0.59, "src": "DR · 2022-10-13", "s": "Neutral", "sc": 0.0}, {"p": "Lea Wermelin", "pa": "S", "c": "Jeg har kun én interesse, og det er at finde ud af, om jeg lever op til reglerne, siger Lea Wermelin ifølge B.T. som svar på kritikken.", "lt": 1, "lp": 0.83, "src": "TV 2 · 2022-10-13", "s": "Neutral", "sc": -0.03}, {"p": "Lea Wermelin", "pa": "S", "c": "Jeg synes, at det er vigtigt for en folketingspolitiker at være tilgængelig. Derfor vil jeg selvfølgelig bo på Bornholm, hvor jeg også er født og opvokset, sagde Lea Wermelin i 2015 til TV 2 Bornholm.", "lt": 3, "lp": 0.79, "src": "TV 2 · 2022-10-13", "s": "Imod", "sc": -0.05}, {"p": "Linea Søgaard-Lidell", "pa": "V", "c": "Det er fantastisk. Vi har kæmpet hårdt den sidste måned. Det er en stor lettelse. Jeg er stolt af den kampagne, vi har ført, og er meget ydmyg over den tillid, som københavnerne har vist, siger hun til TV 2.", "lt": 1, "lp": 0.71, "src": "TV 2 · 2022-11-01", "s": "For", "sc": 0.14}, {"p": "Linea Søgaard-Lidell", "pa": "V", "c": "Der er brug for en større bevågenhed omkring EU. Det kan jeg bidrage med, siger hun.", "lt": 4, "lp": 0.58, "src": "TV 2 · 2022-11-01", "s": "For", "sc": 0.65}, {"p": "Linea Søgaard-Lidell", "pa": "V", "c": "Samira Nawa bliver muligvis valgt. Der er folk i partiet, som spekulerer i, om hun kunne være en mulighed også, siger han.", "lt": 3, "lp": 0.72, "src": "TV 2 · 2022-11-01", "s": "Imod", "sc": -0.2}, {"p": "Linea Søgaard-Lidell", "pa": "V", "c": "Jeg er glad for den tillid, der er vist mig ved det her valg. Men jeg er også enormt ked af at skulle sige farvel til gode kollegaer, siger hun til TV 2.", "lt": 1, "lp": 0.79, "src": "TV 2 · 2022-11-01", "s": "Neutral", "sc": -0.03}, {"p": "Lisbeth Bech-Nielsen", "pa": "SF", "c": "Det store argument imod er, at vi står i en kæmpe inflationskrise, og vi skal passe meget på med at pumpe penge ud, specielt i sektorer, der allerede er overophedet, og det er vores byggesektor stadigvæk på visse stræk, siger SF&#x27;s finansordfører Lisbeth Bech-Nielsen.", "lt": 2, "lp": 0.56, "src": "DR · 2022-10-08", "s": "Imod", "sc": -0.37}, {"p": "Lisbeth Bech-Nielsen", "pa": "SF", "c": "Det er ikke fair at tage pengene derfra. Det er lejernes egne penge, det er deres egen opsparing, men man skal ikke tage pengene fra kassen og så præsentere dem som om, at nu har man selv fundet nogle penge, siger hun.", "lt": 5, "lp": 0.88, "src": "DR · 2022-10-27", "s": "Imod", "sc": -0.35}, {"p": "Lisbeth Bech-Nielsen", "pa": "SF", "c": "SF har foreslået at øge arbejdsudbuddet med 40.000, så jeg tænker ikke, det er de 10.000, der skal skille os ad. Spørgsmålet er, hvordan man gør det, siger finansordfører Lisbeth Bech-Nielsen (SF) i en skriftlig kommentar til Ritzau.", "lt": 0, "lp": 0.39, "src": "TV 2 · 2022-10-29", "s": "", "sc": NaN}, {"p": "Lisbeth Bech-Nielsen", "pa": "SF", "c": "Jeg kan kun omfavne det, og jeg vil gå så langt som til at sige, at man ikke kan være en ansvarlig politiker uden også at have en løsning på, hvordan vi skal løse problemet med kæmpestor mangel på arbejdskraft i Danmark, skriver han.", "lt": 1, "lp": 0.91, "src": "TV 2 · 2022-10-29", "s": "Imod", "sc": -0.05}, {"p": "Lotte Rod", "pa": "RV", "c": "Det her må ikke være en spareøvelse, hvor man forsøger at lade være med at lave minimumsnormeringer ved at sende børn i førskole. Derfor vil vi gerne presse på for, at normeringerne skal være børnehavenormeringer, indtil børn begynder i skole, siger børneordfører for Radikale Venstre Lotte Rod.", "lt": 5, "lp": 0.54, "src": "DR · 2022-10-29", "s": "Imod", "sc": -0.57}, {"p": "Lotte Rod", "pa": "RV", "c": "Loven skal ændres hurtigst muligt, for børn er kun børn én gang.", "lt": 4, "lp": 0.6, "src": "DR · 2022-10-29", "s": "Imod", "sc": -0.22}, {"p": "Mads Fuglede", "pa": "DD", "c": "Det tager længere tid at spise en hel pakke tyggegummi, og så har vælgere æsken med mig på i længere tid. Først tænkte jeg, at det skulle være pastiller som en gajol, men de bliver spist for hurtigt, og så ville jeg ryge for hurtigt i skraldespanden, siger Mads Fuglede.", "lt": 4, "lp": 0.83, "src": "DR · 2022-10-12", "s": "Imod", "sc": -0.07}, {"p": "Mads Fuglede", "pa": "DD", "c": "Når man ved, at det bliver tæt helt til målstregen, så motiverer det os alle sammen til at gøre en ekstra indsats. Jeg er fuld booket ud til allersidst.", "lt": 4, "lp": 0.72, "src": "DR · 2022-10-31", "s": "For", "sc": 0.58}, {"p": "Mads Fuglede", "pa": "DD", "c": "Men det er jo ens for alle. Så det handler netop om at være til stede alle steder og få de gode budskaber ud.", "lt": 1, "lp": 0.63, "src": "DR · 2022-10-31", "s": "Neutral", "sc": -0.04}, {"p": "Mads Fuglede", "pa": "DD", "c": "De små ting her i valgkampens slutspurt kan faktisk gøre rigtig meget i forhold til at blive valgt ind eller ej. Altså, lige den ekstra tur gennem gågaden, de ekstra antal flyers, lige få ringet rundt til vælgerne og få dem til at hjælpe én, forklarer han.", "lt": 4, "lp": 0.9, "src": "DR · 2022-10-31", "s": "For", "sc": 0.43}, {"p": "Mads Olsen", "pa": "SF", "c": "Jeg er et ret ubeskrevet blad her i Roskilde, så plakaterne er med til at gøre mig lidt mere kendt blandt dem, der ikke kender mig i forvejen, siger han.", "lt": 5, "lp": 0.72, "src": "DR · 2022-10-08", "s": "Neutral", "sc": -0.01}, {"p": "Mads Olsen", "pa": "SF", "c": "Hvis vi ikke hænger plakater op, så er det de partier, der ikke er grønne, der kommer ind. Jeg valgte at bruge 16.000 kroner ekstra på at gøre mine plakater så grønne som muligt, siger han.", "lt": 0, "lp": 0.47, "src": "DR · 2022-10-08", "s": "Imod", "sc": -0.16}, {"p": "Mads Olsen", "pa": "SF", "c": "Jeg synes, det ville være en skam, hvis den demokratiske debat kun foregik på sociale medier, for så afkobler man også en masse, siger han.", "lt": 1, "lp": 0.79, "src": "DR · 2022-10-08", "s": "Imod", "sc": -0.23}, {"p": "Mads Olsen", "pa": "SF", "c": "Plakater er stadigvæk en god måde at vise sig på i offentligheden på, siger han.", "lt": 2, "lp": 0.72, "src": "DR · 2022-10-08", "s": "For", "sc": 0.4}, {"p": "Mads Olsen", "pa": "SF", "c": "Det er jo ikke unge, der møder op til en paneldebat eller vælgermøde i Viby-hallen, siger Mads Olsen.", "lt": 1, "lp": 0.39, "src": "DR · 2022-10-11", "s": "", "sc": NaN}, {"p": "Magnus Heunicke", "pa": "S", "c": "Jeg er enig i, at børn og ungepsykiatrien er det sted, hvor vi har de største problemer. Det er også der, at vores sundhedsstyrelse siger, at vi skal sætte ind først. Det er derfor, vi gør det, siger han.", "lt": 2, "lp": 0.67, "src": "DR · 2022-10-12", "s": "For", "sc": 0.13}, {"p": "Magnus Heunicke", "pa": "S", "c": "Vi skal også være langt bedre til at gribe og se de unge mennesker, inden det udvikler sig, siger Magnus Heunicke.", "lt": 3, "lp": 0.52, "src": "DR · 2022-10-12", "s": "Imod", "sc": -0.08}, {"p": "Magnus Heunicke", "pa": "S", "c": "Det er meget, meget vigtigt, at de redskaber, vi tager i brug her på den korte bane, ikke forringer noget, der skal ske på den lange bane. Så en del af Moderaternes forslag er kloge og gode, og andet er jeg lidt mere skeptisk overfor, siger ministeren.", "lt": 5, "lp": 0.62, "src": "DR · 2022-10-14", "s": "Neutral", "sc": 0.01}, {"p": "Magnus Heunicke", "pa": "S", "c": "Jeg kunne være bekymret over, hvis man suspenderer i så lang en periode (i hele 2023, red.), at vi så vil have nogle operationsstuer, der står tomme eller halvtomme i det private. Vi skal bruge både offentligt og privat, siger ministeren.", "lt": 5, "lp": 0.92, "src": "DR · 2022-10-14", "s": "Imod", "sc": -0.22}, {"p": "Magnus Heunicke", "pa": "S", "c": "Om det bliver mig eller en anden, der bliver sundhedsminister, så er det her hovedproblemet. Vi skal have løst de her rekrutteringsproblemer, og på den lange bane kræver det, at vi også løfter sygeplejerskernes løn – og arbejdsvilkår, siger han.", "lt": 1, "lp": 0.6, "src": "DR · 2022-10-19", "s": "For", "sc": 0.45}, {"p": "Magnus Heunicke", "pa": "S", "c": "Vi nåede lige op på 1009 flere. Så havde vi coronasituationen og formentlig også en del af sygeplejerskekonflikten, som har gjort, at det igen er et problem, siger han.", "lt": 3, "lp": 0.39, "src": "DR · 2022-10-19", "s": "", "sc": NaN}, {"p": "Magnus Heunicke", "pa": "S", "c": "Lønpengene er der til dem i vores regioner. Men vi er der jo helt åbenlyst ikke lige nu, og det store problem kan vi ikke løse uden også at kigge på sygeplejerskernes – og andre medarbejdergruppers løn- og arbejdsvilkår, siger ministeren.", "lt": 1, "lp": 0.71, "src": "DR · 2022-10-19", "s": "For", "sc": 0.11}, {"p": "Magnus Heunicke", "pa": "S", "c": "Det er klart utilfredsstillende, og et gigantisk brud på de rettigheder, vi har til at blive undersøgt inden fire uger, siger sundhedsminister Magnus Heunicke (S).", "lt": 3, "lp": 0.56, "src": "DR · 2022-10-29", "s": "Imod", "sc": -0.64}, {"p": "Magnus Heunicke", "pa": "S", "c": "Selv om mange får hurtig og god hjælp, er det ikke demensvenligt at vente så lang tid. Vi kan ikke bruge corona eller andre grunde til at undskylde det. Derfor forventer jeg, at alle regioner får elimineret ventelisten. Der er ingen undskyldning, siger Magnus Heunicke.", "lt": 5, "lp": 0.43, "src": "DR · 2022-10-29", "s": "Imod", "sc": -0.08}, {"p": "Magnus Heunicke", "pa": "S", "c": "Det skal være et krav - og ikke en anbefaling - til regionerne, for der skal ikke være plads til forskellighed til, hvordan og hvem der udreder, siger Magnus Heunicke (S).", "lt": 3, "lp": 0.53, "src": "DR · 2022-10-29", "s": "Neutral", "sc": -0.01}, {"p": "Magnus Heunicke", "pa": "S", "c": "Det er tal, som er fremlagt fra sundhedsdatastyrelsen. Og det er ful
